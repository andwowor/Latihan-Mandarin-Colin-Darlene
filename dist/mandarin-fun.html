AA\u9D54\u9D55\u9D58\u9E87\u9E8F\u9E95\u9F9C\u9F9F", "ka": "\u4F67\u5361\u5494\u5496\u54AF\u5580\u57B0\u64D6\u80E9\u88C3\u9272", "kai": "\u51EF\u51F1\u5240\u5274\u52D3\u5605\u57B2\u584F\u5952\u5C82\u5D66\u5F00\u5FFE\u607A\u6112\u6137\u613E\u6168\u63E9\u669F\u6977\u6B2C\u6B2F\u6FED\u708C\u70D7\u8488\u8C48\u8F06\u9347\u938E\u93A7\u9426\u94E0\u950E\u9534\u958B\u95D3\u95FF\u98BD", "kan": "\u4F83\u5058\u519A\u51F5\u520A\u52D8\u574E\u57F3\u582A\u5888\u5D01\u5D41\u5D4C\u60C2\u6221\u627B\u681E\u69DB\u6ABB\u6B3F\u6B41\u770B\u77B0\u77D9\u780D\u78E1\u7AF7\u83B0\u884E\u8F21\u8F57\u95DE\u961A\u9851\u9B2B\u9F95\u9F9B", "kang": "\u4EA2\u4F09\u531F\u56E5\u5ADD\u5D7B\u5EB7\u5FFC\u6177\u625B\u6297\u69FA\u6F2E\u7095\u72BA\u780A\u7A45\u7C87\u7CE0\u8EBF\u909F\u9227\u93EE\u94AA\u958C\u95F6\u9C47", "kao": "\u4E02\u5C3B\u5D6A\u62F7\u6537\u6832\u6D18\u70E4\u7105\u7292\u8003\u85A7\u92AC\u94D0\u9760\u9ADB\u9BB3\u9BCC\u9C93", "ke": "\u514B\u523B\u524B\u52C0\u52CA\u533C\u53EF\u54B3\u55D1\u5777\u5801\u58F3\u5A14\u5BA2\u5C05\u5CA2\u5CC7\u5D51\u5D59\u5DB1\u606A\u6088\u6118\u6119\u63E2\u6415\u6564\u67EF\u68F5\u69BC\u6A16\u6B41\u6BBC\u6C2A\u6E07\u6E34\u6E98\u6FED\u70A3\u7241\u7271\u7290\u73C2\u75B4\u75FE\u778C\u7822\u785E\u78A6\u78C6\u78D5\u790A\u791A\u79D1\u7A1E\u7AA0\u7ABC\u7DD9\u7F02\u7FD7\u8250\u82DB\u842A\u8596\u86B5\u874C\u8849\u8894\u8AB2\u8BFE\u8DB7\u8EFB\u8F72\u9198\u9233\u927F\u9301\u94B6\u94EA\u951E\u959C\u9826\u9846\u988F\u9897\u9A0D\u9A92\u9AC1", "kei": "\u524B\u5C05", "ken": "\u5543\u57A6\u58BE\u6073\u61C7\u63AF\u73E2\u808E\u80AF\u80BB\u88C9\u8903\u8C64\u8C87\u9339\u9F82\u9F88", "keng": "\u52A5\u542D\u5748\u5751\u5994\u6333\u63C1\u647C\u6BB8\u727C\u7841\u785C\u787B\u8A99\u92B5\u935E\u93D7\u94FF\u962C", "kong": "\u5025\u57EA\u5B54\u5D06\u6050\u60BE\u63A7\u690C\u6DB3\u77FC\u787F\u7A7A\u7B9C\u7FAB\u8EBB\u9313\u979A\u9D7C", "kou": "\u51A6\u527E\u52B6\u53E3\u53E9\u5BBC\u5BC7\u5F44\u6010\u6263\u62A0\u6473\u6542\u6EF1\u770D\u7717\u7789\u7798\u7A9B\u7AD8\u7B58\u7C06\u82A4\u8532\u853B\u91E6\u9DC7", "ku": "\u4FC8\u5233\u54ED\u55BE\u56B3\u5710\u5800\u5E93\u5EAB\u5EE4\u625D\u630E\u6341\u670F\u67AF\u684D\u695B\u72DC\u7614\u77FB\u785E\u79D9\u7A8B\u7A9F\u7D5D\u7ED4\u80D0\u82E6\u88B4\u88E4\u8932\u8DCD\u90C0\u9177\u9AB7\u9BAC", "kua": "\u4F89\u54B5\u57AE\u5938\u59F1\u6057\u630E\u6647\u6947\u7D53\u80EF\u823F\u8A87\u8DB6\u8DE8\u9299\u9ABB", "kuai": "\u4F1A\u4FA9\u5108\u51F7\u54D9\u5672\u5726\u5757\u584A\u58A4\u5DDC\u5EE5\u5FEB\u64D3\u65DD\u6703\u6B33\u6D4D\u6FAE\u72EF\u736A\u74AF\u7B77\u7CE9\u810D\u81BE\u8489\u84AF\u90D0\u9136\u99C3\u9C60\u9C99", "kuan": "\u5BBD\u5BDB\u5BEC\u68A1\u6B35\u6B3E\u6B40\u7ABD\u7ABE\u81D7\u9467\u9ACB\u9AD6", "kuang": "\u4E31\u4FC7\u5123\u51B5\u52BB\u5321\u5329\u535D\u54D0\u5739\u58D9\u593C\u5CB2\u5FF9\u6047\u61EC\u61ED\u6282\u65F7\u663F\u66E0\u6846\u6CC1\u6D2D\u720C\u72C2\u72C5\u7716\u7736\u77CC\u77FF\u783F\u7844\u7926\u7A6C\u7B50\u7B7A\u7D4B\u7D56\u7E8A\u7EA9\u8A86\u8A91\u8BD3\u8BF3\u8CBA\u8D36\u8ED6\u8EE0\u8EE6\u8EED\u8FCB\u909D\u90BC\u913A\u9271\u92DB\u945B\u9D5F\u9ECB", "kui": "\u4E8F\u5080\u5232\u532E\u5331\u559F\u55B9\u5633\u5914\u594E\u5ABF\u5B07\u5C2F\u5CBF\u5DCB\u5DD9\u609D\u6126\u6127\u6192\u6223\u63C6\u6646\u668C\u694F\u6951\u6AC6\u6BA8\u6E83\u6F70\u7143\u72AA\u76D4\u777D\u7786\u77B6\u78C8\u7AA5\u7ABA\u7BD1\u7C23\u7C44\u8067\u8069\u806D\u8075\u80FF\u81AD\u8475\u8489\u8562\u85C8\u8637\u8641\u8667\u8770\u8B09\u8DEC\u8E5E\u8EA8\u9035\u9108\u9368\u9377\u95DA\u9697\u980D\u982F\u985D\u993D\u994B\u9988\u9997\u9A24\u9A99\u9B41\u9BAD", "kun": "\u56F0\u5764\u5803\u5812\u58F8\u58FC\u5A6B\u5D10\u5D11\u6083\u6346\u6606\u665C\u68B1\u6D83\u6F49\u711C\u71B4\u7311\u7428\u747B\u774F\u7871\u7975\u7A07\u7A1B\u7D91\u83CE\u872B\u88C8\u88CD\u88E9\u890C\u8C87\u918C\u9315\u951F\u95AB\u95B8\u9603\u9A09\u9AE0\u9AE1\u9AE8\u9BE4\u9CB2\u9D7E\u9DA4\u9E4D", "kuo": "\u564B\u5ED3\u6269\u62E1\u62EC\u6304\u64F4\u681D\u6F37\u6FF6\u79EE\u79F3\u7B48\u843F\u8440\u86DE\u9002\u929B\u92BD\u94E6\u95CA\u9614\u9729\u979F\u97B9\u97D5\u9822\u9AFA\u9B20", "la": "\u524C\u5566\u5587\u56B9\u5783\u62C9\u63E6\u63E7\u641A\u64F8\u650B\u65EF\u67C6\u694B\u6AF4\u6E82\u7209\u74CE\u760C\u782C\u78D6\u7FCB\u814A\u81C8\u81D8\u83C8\u843D\u85DE\u8721\u874B\u8772\u881F\u8FA2\u8FA3\u908B\u945E\u9574\u97A1\u9B0E\u9BFB", "lai": "\u4F86\u4FEB\u5008\u553B\u5A15\u5A61\u5D03\u5D0D\u5EB2\u5F95\u5FA0\u650B\u6765\u68BE\u68F6\u6AF4\u6D9E\u6DF6\u6FD1\u7028\u702C\u730D\u741C\u75A0\u7658\u765E\u7669\u7750\u775E\u7B59\u7B82\u7C41\u7C5F\u83B1\u840A\u85FE\u8970\u8ABA\u8CDA\u8CF4\u8D49\u8D56\u9028\u90F2\u9338\u94FC\u983C\u9842\u9A0B\u9BE0\u9D63\u9D86\u9EB3", "lan": "\u5116\u5170\u53B1\u5549\u5682\u56D2\u5754\u58C8\u58CF\u5A6A\u5B3E\u5B44\u5B4F\u5C9A\u5D50\u5E71\u60CF\u61D2\u61E2\u61F6\u62E6\u63FD\u64E5\u6514\u652C\u6593\u6595\u6695\u680F\u6984\u6B04\u6B16\u6B17\u6D68\u6EE5\u6F24\u6F9C\u6FEB\u703E\u7046\u7060\u7061\u70C2\u71D7\u71E3\u71F7\u7201\u721B\u7224\u7226\u74BC\u74D3\u7BEE\u7C43\u7C63\u7CF7\u7E7F\u7E9C\u7F06\u7F71\u847B\u84DD\u85CD\u862B\u862D\u8934\u8955\u8964\u8974\u897D\u89A7\u89BD\u89C8\u8B4B\u8B95\u8C30\u8E9D\u9182\u946D\u9484\u9567\u95CC\u9611\u97CA\u9872", "lang": "\u52C6\u54F4\u5577\u57CC\u5871\u5ACF\u5D00\u5ECA\u658F\u6716\u6717\u6724\u6879\u6994\u6A03\u6B34\u6D6A\u70FA\u72FC\u7405\u746F\u7860\u7A02\u7B64\u8246\u83A8\u8497\u84C8\u84E2\u870B\u8782\u8A8F\u8EB4\u90CE\u90D2\u90DE\u92C3\u93AF\u9512\u95AC\u9606\u99FA", "lao": "\u4E50\u4F6C\u50D7\u52B3\u52B4\u52DE\u54BE\u54F0\u5520\u55E0\u562E\u59E5\u5AEA\u5D02\u5D97\u6045\u61A5\u61A6\u635E\u6488\u6725\u6833\u6A02\u6A6F\u6D76\u6D9D\u6F66\u6F87\u70D9\u7262\u72EB\u73EF\u75E8\u7646\u7853\u78F1\u7A82\u7C29\u7CA9\u7D61\u7EDC\u8001\u8002\u8022\u802E\u8356\u843D\u86EF\u87E7\u8EBC\u8EC2\u8F51\u916A\u91AA\u92A0\u9412\u94D1\u94F9\u985F\u9ADD\u9BB1", "le": "\u4E50\u4E86\u4EC2\u52D2\u53FB\u561E\u5FC7\u6250\u697D\u6A02\u6C3B\u6CD0\u725E\u738F\u7833\u7AFB\u7C15\u808B\u827B\u961E\u97F7\u990E\u9979\u9C33\u9C73\u9CD3", "lei": "\u50AB\u5121\u513D\u52D2\u53BD\u561E\u5792\u5841\u58D8\u58E8\u5AD8\u64C2\u6502\u6A0F\u6A91\u6AD0\u6AD1\u6B19\u6CEA\u6D21\u6D99\u6DDA\u7045\u74C3\u757E\u7623\u7657\u77CB\u78CA\u78E5\u790C\u7927\u7928\u7971\u79B7\u7C7B\u7D2F\u7D6B\u7E32\u7E87\u7E8D\u7E9D\u7F27\u7F4D\u7FB8\u8012\u808B\u8502\u854C\u857E\u85DF\u8631\u8632\u863D\u8646\u881D\u8A84\u8B84\u8BD4\u8F60\u9179\u9287\u9311\u9433\u9458\u9478\u956D\u96F7\u9741\u981B\u982A\u985E\u98A3\u9C69\u9E13\u9F3A", "leng": "\u5030\u51B7\u5525\u580E\u5844\u5D1A\u6123\u68F1\u695E\u7756\u7890\u7A1C\u8590\u8E1C", "li": "\u4E3D\u4F8B\u4FD0\u4FDA\u4FEA\u5088\u512E\u5137\u51D3\u5215\u5229\u5253\u527A\u5299\u529B\u52B1\u52F5\u5386\u5389\u5398\u53A4\u53AF\u53B2\u53D3\u53D5\u540F\u5456\u54E9\u550E\u5533\u55B1\u569F\u56A6\u56C4\u56C7\u575C\u585B\u58E2\u5A0C\u5A33\u5A6F\u5AE0\u5B4B\u5B77\u5C74\u5CA6\u5CE2\u5CF2\u5DC1\u5EF2\u609D\u60A1\u60A7\u60B7\u6144\u623E\u6250\u625A\u642E\u64FD\u650A\u6526\u652D\u6584\u66A6\u66C6\u66DE\u6738\u674E\u675D\u67A5\u67C2\u6803\u680E\u6817\u681B\u68A8\u68A9\u68B8\u68C3\u68D9\u6A06\u6AAA\u6AD4\u6ADF\u6AEA\u6B10\u6B1A\u6B74\u6B77\u6CA5\u6CB4\u6CB5\u6D6C\u6D70\u6D96\u6EA7\u6F13\u6FA7\u6FFF\u701D\u7055\u7204\u720F\u7281\u7282\u729B\u72A1\u72F8\u7301\u73D5\u7406\u740D\u746E\u7483\u74C5\u74C8\u74D1\u74E5\u75A0\u75AC\u75E2\u7658\u7667\u76AA\u76E0\u76ED\u7759\u775D\u7805\u782C\u783A\u783E\u78FF\u792A\u792B\u7930\u793C\u79AE\u79B2\u79BB\u79DD\u7A72\u7ACB\u7AF0\u7B20\u7B63\u7BE5\u7BF1\u7C6C\u7C92\u7C9D\u7CB4\u7CCE\u7CF2\u7D9F\u7E2D\u7E85\u7E9A\u7F21\u7F79\u8137\u8243\u82C8\u82D9\u8318\u8354\u8372\u8385\u8389\u83DE\u849A\u849E\u84E0\u853E\u85DC\u85F6\u863A\u86B8\u86CE\u86E0\u870A\u8727\u8777\u87CD\u87F8\u8807\u8821\u8823\u882B\u88CF\u88E1\u8935\u89FB\u8A48\u8B27\u8B88\u8C4A\u8C8D\u8D72\u8DDE\u8E92\u8F62\u8F63\u8F79\u8FE3\u9026\u908C\u9090\u90E6\u9148\u91A8\u91B4\u91CC\u91D0\u925D\u9290\u92EB\u92F0\u9305\u9398\u93EB\u9457\u9502\u9549\u96B6\u96B7\u96B8\u96E2\u96F3\u9742\u974B\u9A6A\u9A8A\u9B01\u9B32\u9BC9\u9BCF\u9BEC\u9C67\u9C71\u9C7A\u9CA1\u9CA4\u9CE2\u9CE8\u9D17\u9D79\u9DC5\u9E1D\u9E42\u9E97\u9E9C\u9ECE\u9EE7", "lia": "\u4FE9\u5006", "lian": "\u4EB7\u50C6\u5286\u5332\u5333\u55F9\u5652\u581C\u5941\u5969\u5AA1\u5AFE\u5B1A\u5E18\u5EC9\u601C\u604B\u6169\u6190\u6200\u6459\u655B\u6582\u68BF\u695D\u69CF\u69E4\u6AB6\u6AE3\u6B5B\u6B93\u6BAE\u6D70\u6D9F\u6E45\u6E93\u6F23\u6F4B\u6FB0\u6FC2\u6FD3\u702E\u7032\u70BC\u7149\u7191\u71EB\u740F\u7453\u7489\u78CF\u7A34\u7C3E\u7C62\u7C68\u7DF4\u7E3A\u7E9E\u7EC3\u7FB7\u7FF4\u8054\u8068\u806B\u806E\u806F\u8138\u81C1\u81C9\u83B2\u83B6\u8430\u84EE\u8539\u8595\u859F\u861D\u861E\u878A\u880A\u88E2\u88E3\u8933\u895D\u899D\u8B30\u8E65\u8FDE\u9023\u913B\u91B6\u932C\u934A\u938C\u93C8\u942E\u94FE\u9570\u9B11\u9C0A\u9C31\u9CA2", "liang": "\u4E21\u4E24\u4EAE\u4FCD\u4FE9\u5006\u501E\u5169\u51C9\u54F4\u5521\u5562\u55A8\u589A\u60A2\u639A\u667E\u6881\u690B\u6A11\u6DBC\u6E78\u7CAE\u7CB1\u7CE7\u7DC9\u813C\u826F\u83A8\u873D\u88F2\u8AD2\u8C05\u8E09\u8F0C\u8F1B\u8F2C\u8F86\u8F8C\u91CF\u9344\u9753\u975A\u99FA\u9B49\u9B4E", "liao": "\u4E86\u50DA\u5639\u5AFD\u5BE5\u5BEE\u5C1E\u5C25\u5C26\u5C6A\u5D7A\u5D9A\u5D9B\u5ED6\u5EEB\u6180\u61AD\u644E\u6482\u64A9\u6579\u6599\u66B8\u66E2\u6A1B\u6A51\u6F3B\u6F66\u7093\u71CE\u720E\u7212\u7360\u7499\u7597\u7642\u77AD\u7A8C\u7AB7\u7AC2\u7C1D\u7E46\u7E5A\u7F2A\u7F2D\u804A\u818B\u81AB\u84FC\u85D4\u87DF\u87E7\u8C42\u8CFF\u8E58\u8E7D\u8FBD\u907C\u911D\u91D5\u9410\u948C\u9563\u957D\u98C2\u98C9\u9ACE\u9DEF\u9E69", "lie": "\u5120\u51BD\u5217\u52A3\u52A6\u52BD\u54A7\u54F7\u57D2\u57D3\u59F4\u5CDB\u5DC1\u5DE4\u5FDA\u6312\u6318\u6369\u64F8\u6835\u68D9\u6BDF\u6D0C\u6D56\u70C8\u70EE\u716D\u71E4\u7204\u7209\u72A3\u730E\u731F\u7366\u7375\u7D9F\u8057\u811F\u8322\u86DA\u88C2\u8D94\u8E90\u8FFE\u98B2\u9B1B\u9B23\u9BA4\u9C72\u9D37", "lin": "\u4E34\u4E83\u50EF\u51A7\u51DB\u51DC\u53B8\u541D\u5549\u58E3\u5D0A\u5D99\u5EE9\u5EEA\u6061\u608B\u60CF\u61CD\u61D4\u62CE\u649B\u65B4\u667D\u66BD\u6797\u6A49\u6A81\u6AA9\u6DCB\u6F7E\u6F9F\u7036\u711B\u71D0\u735C\u7433\u7498\u7510\u7584\u75F3\u765B\u765D\u77B5\u7884\u78F7\u7B96\u7CA6\u7CBC\u7D9D\u7E57\u7FF7\u81A6\u81E8\u83FB\u853A\u85FA\u8CC3\u8D41\u8E78\u8E8F\u8E99\u8EAA\u8F54\u8F65\u8F9A\u9074\u90BB\u9130\u93FB\u95B5\u963E\u96A3\u9716\u9A4E\u9C57\u9CDE\u9E90\u9E9F", "ling": "\u4EE4\u4F36\u51CC\u5222\u53E6\u5464\u56F9\u577D\u590C\u59C8\u5A48\u5B41\u5CAD\u5CBA\u5D1A\u5DBA\u5F7E\u6395\u6624\u670E\u67C3\u68C2\u68F1\u6AFA\u6B1E\u6CE0\u6DE9\u6FAA\u7075\u70A9\u71EF\u7227\u72D1\u73B2\u740C\u74F4\u768A\u7831\u797E\u79E2\u7A1C\u7ADB\u7B2D\u7D37\u7DBE\u7EEB\u7F90\u7F9A\u7FCE\u8046\u8232\u82D3\u83F1\u84E4\u8506\u8576\u8626\u86C9\u8851\u888A\u88EC\u8A45\u8DC9\u8EE8\u8F18\u9143\u91BD\u9234\u9302\u94C3\u959D\u9675\u96F6\u970A\u9717\u971B\u971D\u9748\u9818\u9886\u99D6\u9B7F\u9BEA\u9CAE\u9D12\u9E30\u9E77\u9EA2\u9F61\u9F62\u9F84\u9F97", "liu": "\u516D\u5218\u5289\u56A0\u586F\u5AB9\u5B3C\u5D67\u5EC7\u61F0\u644E\u65BF\u65C8\u65D2\u67F3\u6801\u685E\u687A\u69B4\u6A4A\u6A6E\u6D41\u6D4F\u6E9C\u6F3B\u6F91\u700F\u7198\u71AE\u73CB\u7409\u7460\u746C\u74A2\u7544\u7559\u7571\u7581\u7624\u7645\u786B\u788C\u78C2\u78DF\u7A8C\u7DB9\u7EFA\u7F76\u7F80\u7FCF\u84A5\u84C5\u85F0\u87C9\u88D7\u8E53\u905B\u92F6\u938F\u93A6\u93D0\u9402\u950D\u954F\u9560\u9646\u96E1\u9724\u98C0\u98C2\u98C5\u98D7\u993E\u998F\u99E0\u99F5\u9A2E\u9A51\u9A9D\u9B38\u9C21\u9DB9\u9DDA\u9E60\u9E68\u9E8D", "lo": "\u54AF", "long": "\u5131\u5499\u54E2\u56A8\u5784\u5785\u58DF\u58E0\u5C28\u5C78\u5D90\u5DC3\u5DC4\u5F04\u5FBF\u62E2\u650F\u663D\u66E8\u6727\u680A\u6887\u69DE\u6AF3\u6CF7\u6E70\u6EDD\u6F0B\u7027\u7216\u73D1\u74CF\u7643\u772C\u77D3\u783B\u7866\u7931\u7932\u7ABF\u7AC9\u7ADC\u7B3C\u7BE2\u7BED\u7C60\u804B\u807E\u80E7\u830F\u8622\u882A\u882C\u8971\u8C45\u8D1A\u8E98\u93E7\u9468\u9647\u9686\u96B4\u9733\u9747\u9A61\u9E17\u9F8D\u9F92\u9F93\u9F99", "lou": "\u507B\u50C2\u5245\u55BD\u560D\u587F\u5A04\u5A41\u5BE0\u5C5A\u5D5D\u5D81\u5ED4\u617A\u6402\u645F\u697C\u6A13\u6E87\u6F0A\u6F0F\u71A1\u750A\u7618\u763A\u763B\u779C\u7BD3\u7C0D\u8027\u802C\u825B\u848C\u851E\u877C\u87BB\u8B31\u8C97\u8EC1\u9071\u93E4\u9542\u964B\u9732\u97BB\u9AC5\u9ACF\u9DDC", "lu": "\u4F93\u50C7\u516D\u5279\u52CE\u52E0\u5362\u5364\u565C\u5695\u56A7\u5725\u5774\u5786\u5876\u5877\u58DA\u5A3D\u5CCD\u5E90\u5ED8\u5EEC\u5F54\u5F55\u622E\u63B3\u645D\u64B8\u64C4\u64FC\u650E\u66E5\u67A6\u680C\u6902\u6A10\u6A1A\u6A79\u6AD3\u6AE8\u6C07\u6C0C\u6CF8\u6DD5\u6DE5\u6E0C\u6EF7\u6F09\u6F5E\u6F9B\u7002\u7018\u7089\u719D\u7210\u7379\u7388\u742D\u7490\u74B7\u74D0\u752A\u76DD\u76E7\u7769\u77D1\u7849\u7875\u788C\u78E0\u797F\u7984\u7A11\u7A4B\u7A5E\u7B93\u7C0F\u7C2C\u7C35\u7C36\u7C59\u7C5A\u7CB6\u7DD1\u7E91\u7EFF\u7F4F\u80EA\u8194\u81DA\u822E\u823B\u8263\u826A\u826B\u82A6\u83C9\u84FC\u84FE\u850D\u8557\u8606\u8642\u864F\u865C\u87B0\u8826\u89FB\u8B22\u8CC2\u8D42\u8DA2\u8DEF\u8E1B\u8E57\u8F05\u8F46\u8F64\u8F73\u8F82\u8F98\u902F\u9181\u9229\u9304\u9332\u9334\u93C0\u93D5\u93F4\u942A\u9465\u946A\u9565\u9646\u9678\u9732\u9871\u9885\u99BF\u9A04\u9A3C\u9AD7\u9B6F\u9B72\u9BE5\u9C78\u9C81\u9C88\u9D3C\u9D66\u9D71\u9DFA\u9E15\u9E2C\u9E6D\u9E75\u9E7F\u9E93\u9EF8", "luan": "\u4E71\u4E7F\u4E82\u5375\u571D\u571E\u5971\u5A08\u5B4C\u5B6A\u5B7F\u5CE6\u5DD2\u631B\u6523\u66EB\u683E\u6B12\u6EE6\u7053\u7064\u7674\u7675\u7F89\u8114\u81E0\u81E1\u858D\u864A\u89B6\u91E0\u92AE\u947E\u9D49\u9E1E\u9E3E", "lun": "\u4ED1\u4F26\u4F96\u502B\u56F5\u5707\u57E8\u5A68\u5D18\u5D19\u60C0\u62A1\u6384\u68C6\u6CA6\u6DEA\u6EA3\u7896\u78EE\u7A10\u7DB8\u7EB6\u8023\u8140\u82B2\u83D5\u8726\u8AD6\u8BBA\u8E1A\u8F2A\u8F6E\u9300\u966F\u9BE9", "luo": "\u502E\u5138\u5246\u54AF\u5570\u56C9\u56D6\u5BFD\u5CC8\u634B\u6370\u645E\u64FD\u650A\u650E\u651E\u652D\u66EA\u6924\u6B0F\u6CFA\u6D1B\u6D1C\u6E03\u6F2F\u6FFC\u70D9\u7296\u7321\u7380\u73DE\u7630\u7673\u76AA\u7822\u784C\u7866\u78F1\u7B3F\u7BA9\u7C6E\u7D61\u7E99\u7EDC\u7F57\u7F85\u8136\u8161\u81DD\u8366\u841D\u843D\u84CF\u863F\u86D2\u87BA\u8803\u88F8\u89B6\u89BC\u8A7B\u8DDE\u8E92\u8EB6\u903B\u908F\u93CD\u947C\u9523\u9559\u96D2\u9831\u9960\u99F1\u9A3E\u9A58\u9A86\u9AA1\u9BA5\u9D45\u9E01", "lv": "\u4FA3\u4FB6\u507B\u50C2\u5122\u52F4\u535B\u5415\u5442\u54F7\u578F\u5C61\u5C62\u5C65\u5D42\u5F8B\u616E\u617A\u6314\u634B\u635B\u65C5\u68A0\u6988\u6AD6\u6ADA\u6C00\u6C2F\u6EE4\u6FFE\u7112\u7208\u7387\u779C\u7963\u7A06\u7A6D\u7BBB\u7D7D\u7DA0\u7DD1\u7E37\u7E42\u7EFF\u7F15\u8182\u8190\u819F\u81A2\u83C9\u844E\u85D8\u8651\u891B\u8938\u90D8\u92C1\u9462\u94DD\u95AD\u95FE\u9A62\u9A74\u9DDC", "lve": "\u5719\u5BFD\u63A0\u7565\u7567\u7A24\u92DD\u92E2\u950A", "m": "\u5452\u5463\u5638", "ma": "\u4E48\u4E87\u508C\u5417\u55CE\u561B\u561C\u5988\u5ABD\u5AF2\u5B56\u62B9\u6469\u6769\u69AA\u6EA4\u7298\u72B8\u7341\u739B\u746A\u75F2\u75F3\u7770\u7801\u78BC\u7943\u79A1\u7F75\u83FB\u8534\u8682\u879E\u87C6\u87C7\u9064\u93B7\u9581\u99AC\u99E1\u9A6C\u9A82\u9B15\u9C22\u9DCC\u9EBB\u9EBD", "mai": "\u4E70\u4F45\u52A2\u52F1\u5356\u551B\u562A\u57CB\u58F2\u8108\u8109\u836C\u8552\u85B6\u8847\u8CB7\u8CE3\u8FC8\u9081\u9721\u9722\u973E\u9DF6\u9EA5\u9EA6\u9FCF", "man": "\u50C8\u57CB\u5881\u59CF\u5A28\u5ADA\u5C58\u5E54\u6097\u6162\u6172\u6471\u66FC\u69FE\u6A20\u6E80\u6EE1\u6EFF\u6F2B\u6FAB\u6FB7\u71B3\u734C\u7792\u779E\u77D5\u7D7B\u7E35\u7F26\u8504\u8513\u8630\u86EE\u87A8\u87CE\u883B\u8954\u8B3E\u8C29\u9124\u93CB\u93DD\u9558\u9794\u9862\u989F\u9945\u9992\u9B17\u9B18\u9C3B\u9CD7", "mang": "\u5396\u5402\u54E4\u58FE\u5A0F\u5C28\u5EAC\u5FD9\u607E\u671A\u6757\u6767\u6C13\u6C52\u6D5D\u6F2D\u7264\u727B\u72F5\u75DD\u76F2\u76F3\u7865\u786D\u7B00\u8292\u832B\u833B\u83BD\u83BE\u8609\u86D6\u87D2\u880E\u9099\u91EF\u92E9\u94D3\u99F9", "mao": "\u4E6E\u5183\u5187\u5190\u5192\u536F\u5825\u5918\u5AA2\u5CC1\u5D4D\u5E3D\u6117\u61CB\u623C\u65C4\u6634\u6693\u6786\u67D5\u6959\u6BDB\u6BF7\u6C02\u6CD6\u6E35\u7266\u729B\u732B\u7441\u7683\u770A\u7780\u77DB\u79CF\u7B37\u7DE2\u7F5E\u8004\u82BC\u8302\u8305\u8306\u843A\u84E9\u8750\u8765\u87CA\u88A4\u8992\u8C8C\u8C93\u8CBF\u8D38\u8EDE\u911A\u912E\u9155\u925A\u927E\u9328\u94C6\u951A\u9AE6\u9AF3\u9D9C", "me": "\u4E48\u5692\u569C\u56B0\u5E85\u6FF9\u9EBC\u9EBD", "mei": "\u51C2\u569C\u5746\u5833\u587A\u59B9\u5A12\u5A84\u5A92\u5A9A\u5ABA\u5B0D\u5BD0\u5D44\u5D4B\u5FBE\u62BA\u6334\u6517\u65C0\u6627\u679A\u6802\u6885\u6963\u6973\u69D1\u6AD7\u6B99\u6BCE\u6BCF\u6C92\u6CA1\u6CAC\u6D7C\u6E3C\u6E44\u6E48\u715D\u7164\u71D8\u7338\u73AB\u73FB\u7442\u75D7\u7709\u771B\u7742\u7778\u7959\u7996\u7A48\u7BC3\u7CDC\u7F8E\u7F99\u8104\u8122\u815C\u82FA\u8393\u847F\u875E\u8882\u8C1C\u8DCA\u8EBE\u90FF\u9176\u92C2\u9382\u9387\u9541\u9545\u9709\u97CE\u9B3D\u9B45\u9DA5\u9E5B\u9EE3\u9EF4", "men": "\u4EB9\u4EEC\u5011\u5447\u600B\u6097\u60B6\u60DB\u61D1\u61E3\u626A\u636B\u6596\u66AA\u691A\u6C76\u7116\u71DC\u73A7\u748A\u7792\u779E\u7A48\u83DB\u864B\u9346\u9494\u9580\u9585\u95E8\u95F7\u9794", "meng": "\u511A\u51A1\u52D0\u5922\u5923\u5B5F\u5C28\u5E6A\u5EAC\u61DC\u61DE\u61F5\u63B9\u64DD\u66DA\u6726\u68A6\u6A57\u6AAC\u6C0B\u6C13\u6E95\u6FDB\u731B\u7374\u750D\u753F\u7666\u76DF\u77A2\u77C7\u77D2\u791E\u824B\u8268\u8394\u840C\u8499\u8544\u867B\u8722\u8771\u87D2\u8813\u9133\u9138\u92C2\u9333\u9530\u96FA\u9725\u973F\u9740\u986D\u995B\u9AF3\u9BCD\u9BED\u9E0F\u9E72\u9EFE\u9F06", "mi": "\u4F8E\u5196\u519E\u51AA\u54AA\u5627\u5853\u5B4A\u5B93\u5BBB\u5BC6\u5CDA\u5E42\u5E4E\u5E66\u5F25\u5F2D\u5F4C\u603D\u6202\u6475\u64DF\u6520\u6549\u6788\u6993\u6A12\u6AB7\u6AC1\u6C68\u6C95\u6CB5\u6CCC\u6D23\u6DE7\u6E33\u6EF5\u6F1E\u6FD4\u6FD7\u7030\u7056\u7190\u7222\u7315\u737C\u74D5\u772F\u7787\u77B4\u7955\u7962\u79B0\u79D8\u7C1A\u7C73\u7C8E\u7CDC\u7CF8\u7E3B\u7F83\u7F8B\u8112\u8288\u845E\u84BE\u84C2\u851D\u8524\u85CC\u862A\u863C\u871C\u88AE\u8993\u8994\u899B\u89C5\u8A78\u8B0E\u8B10\u8C1C\u8C27\u8FF7\u919A\u91BE\u91BF\u91C4\u92A4\u957E\u9761\u9E0D\u9E8A\u9E8B\u9E9B\u9EBF\u9F0F", "mian": "\u4E0F\u506D\u514D\u5195\u52C9\u52D4\u5595\u5A29\u5A42\u5A94\u5B35\u5B80\u6110\u6763\u68C9\u6AB0\u6ACB\u6C45\u6C94\u6E11\u6E4E\u6FA0\u7251\u7704\u7720\u774C\u77C8\u77CA\u77CF\u7CC6\u7D7B\u7DBF\u7DDC\u7DEC\u7EF5\u7F05\u817C\u81F1\u8287\u83AC\u8442\u8752\u9762\u9763\u9766\u9BB8\u9EAA\u9EAB\u9EB5\u9EBA\u9EFE", "miao": "\u4EEF\u52B0\u53B8\u55B5\u5999\u5A8C\u5AF9\u5E99\u5EBF\u5EDF\u63CF\u676A\u6DFC\u6E3A\u7385\u7707\u7784\u79D2\u7AD7\u7BCE\u7DE2\u7DF2\u7E46\u7F08\u7F2A\u82D7\u85D0\u9088\u9D93\u9E4B", "mie": "\u4E5C\u5400\u54A9\u54F6\u5B6D\u5E6D\u61F1\u6423\u6AD7\u6EC5\u700E\u706D\u70D5\u771C\u7923\u7BFE\u7C1A\u8511\u858E\u881B\u884A\u8995\u9456\u9C74\u9D13", "min": "\u50F6\u51BA\u5221\u52C4\u5461\u578A\u59C4\u5CB7\u5D0F\u5FDE\u5FDF\u600B\u60AF\u60FD\u610D\u615C\u61AB\u62BF\u636A\u6543\u654F\u656F\u65FB\u65FC\u668B\u6C11\u6CEF\u6E02\u6E4F\u6E63\u6F63\u739F\u73C9\u7418\u741D\u7449\u75FB\u76BF\u76FF\u7807\u7B22\u7B3D\u7C22\u7DCD\u7DE1\u7F17\u7F60\u82E0\u8820\u8CEF\u9231\u9309\u9372\u9594\u95A9\u95F5\u95FD\u9C35\u9CD8\u9D16\u9EFD\u9EFE", "ming": "\u4F72\u51A5\u51D5\u540D\u547D\u59F3\u5AC7\u614F\u63B5\u660E\u669D\u6719\u69A0\u6D3A\u6E9F\u733D\u7700\u7733\u7791\u8317\u84C2\u879F\u89AD\u8A7A\u910D\u9169\u9298\u94ED\u9CF4\u9E23", "miu": "\u7E46\u7F2A\u8B2C\u8C2C", "mo": "\u4E07\u4E48\u5192\u5298\u55FC\u563F\u569C\u56A4\u573D\u587B\u58A8\u59BA\u5AEB\u5AFC\u5B24\u5B37\u5BDE\u5C1B\u5E13\u5E1E\u61E1\u6202\u62B9\u6469\u6478\u6479\u64F5\u6520\u65E0\u6629\u672B\u67BA\u6A21\u6A45\u6B7E\u6B7F\u6B81\u6C92\u6CA1\u6CAB\u6F20\u700E\u7205\u72E2\u734F\u763C\u768C\u771C\u773D\u773F\u7790\u7799\u781E\u78E8\u7933\u79E3\u7CE2\u7D48\u7D54\u7E38\u7E86\u8031\u8109\u819C\u8309\u8388\u83AB\u84E6\u85E6\u8611\u86E8\u87C6\u87D4\u88B9\u8B28\u8B29\u8C1F\u8C83\u8C88\u8C89\u8C8A\u8C98\u9286\u93CC\u9546\u964C\u977A\u9943\u995D\u998D\u9A40\u9AB3\u9ACD\u9B54\u9B69\u9B79\u9EBC\u9EBD\u9EBF\u9ED8\u9ED9", "mou": "\u4F94\u52BA\u53B6\u5463\u54DE\u5825\u6048\u6544\u67D0\u6859\u725F\u7738\u7E46\u7F2A\u86D1\u8B00\u8C0B\u8E0E\u936A\u97AA\u9D3E\u9EB0", "mu": "\u4EA9\u4EEB\u51E9\u52DF\u5776\u5893\u59C6\u59E5\u5A12\u5CD4\u5E55\u5E59\u6154\u6155\u62C7\u66AE\u66AF\u6728\u6737\u6958\u6A21\u6A22\u6BCD\u6BE3\u6BEA\u6C01\u6C90\u7091\u725F\u7261\u7267\u7273\u72C7\u7542\u7546\u7552\u755D\u755E\u756E\u76EE\u7766\u782A\u7A46\u7E38\u7F2A\u80DF\u8252\u82DC\u83AB\u83AF\u869E\u8E07\u9267\u926C\u94BC\u96EE\u9702\u97AA", "n": "\u5514", "na": "\u4E78\u5185\u5357\u5436\u5450\u54EA\u55F1\u59A0\u5A1C\u6290\u62CF\u62FF\u6310\u637A\u643B\u79C5\u7B1A\u7B1D\u7D0D\u7EB3\u80AD\u8498\u84B3\u8872\u88A6\u8ABD\u8C7D\u8C80\u8EDC\u90A3\u90CD\u9209\u93BF\u94A0\u954E\u96EB\u9779\u9B76", "nai": "\u4E43\u4F74\u5037\u54EA\u5948\u5976\u59B3\u5B2D\u5B7B\u5EFC\u6431\u6468\u67F0\u6C16\u6E3F\u7593\u800F\u8010\u80FD\u8149\u827F\u8418\u879A\u8926\u8FFA\u91E2\u933C\u9F10", "nan": "\u4FBD\u5357\u5583\u56DD\u56E1\u59A0\u5A1A\u5A7B\u5AE8\u6201\u62A9\u63C7\u6694\u678F\u67DF\u6960\u6E73\u7175\u7537\u7558\u8169\u83AE\u8433\u877B\u8AF5\u8D67\u9056\u96BE\u96E3", "nang": "\u4E6A\u513E\u56A2\u56CA\u56D4\u61B9\u6411\u64C3\u652E\u66E9\u6B1C\u6DB3\u7062\u8830\u995F\u9962\u9995\u9F49", "nao": "\u5318\u5476\u57B4\u5816\u5912\u5A65\u5AD0\u5B6C\u5CF1\u5DA9\u5DCE\u6013\u607C\u60A9\u60F1\u61B9\u6320\u644E\u6493\u6861\u6A48\u6DD6\u7331\u7376\u737F\u7459\u7847\u7899\u78AF\u8111\u8133\u8166\u81D1\u86F2\u87EF\u8A49\u8B4A\u9403\u94D9\u9599\u95F9\u9B27", "ne": "\u5436\u5462\u54EA\u6290\u7592\u7732\u8A25\u8BB7", "nei": "\u5167\u5185\u54EA\u5A1E\u6C1D\u6C1E\u6D7D\u812E\u8147\u90A3\u9317\u9912\u9981\u9BBE\u9BD8", "nen": "\u5A86\u5AE9\u5AF0\u6041", "neng": "\u80FD\u879A", "ng": "\u5514\u55EF", "ni": "\u4F31\u4F32\u4F60\u502A\u5117\u511E\u533F\u5462\u576D\u57FF\u5804\u59AE\u59B3\u5A57\u5ADF\u5B3A\u5B74\u5C3C\u5C54\u5C70\u6029\u60C4\u6135\u61DD\u6290\u62B3\u62DF\u639C\u64EC\u65CE\u6635\u6672\u66B1\u67C5\u68FF\u6AB7\u6C3C\u6CE5\u6DE3\u6EBA\u6FD4\u72D4\u730A\u7591\u7724\u7768\u79DC\u7C7E\u7E0C\u8063\u807B\u80D2\u817B\u81A9\u81E1\u82E8\u85BF\u86AD\u86EA\u873A\u89EC\u8ABD\u8C8E\u8DDC\u8F17\u9006\u90F3\u922E\u94CC\u96AC\u9713\u999C\u9BE2\u9CB5\u9E91\u9F6F", "nian": "\u5344\u54D6\u5538\u57DD\u59E9\u5E74\u5EFF\u5FF5\u60A5\u60D7\u62C8\u637B\u649A\u64B5\u6506\u6990\u6D8A\u6DF0\u6E93\u713E\u78BE\u79CA\u79E5\u7C10\u7C98\u824C\u852B\u8E4D\u8E68\u8E8E\u8F26\u8F87\u8F97\u9B8E\u9BF0\u9C87\u9CB6\u9D47\u9ECF", "niang": "\u5A18\u5B22\u5B43\u917F\u91B8\u91C0", "niao": "\u5ACB\u5B1D\u5B32\u5C3F\u6A22\u6EBA\u8132\u8311\u8526\u8885\u88CA\u892D\u9CE5\u9E1F", "nie": "\u4E5C\u556E\u55EB\u565B\u5699\u56C1\u56D0\u56D3\u573C\u5B7C\u5B7D\u5CCA\u5D72\u5DAD\u5DD5\u5E07\u634F\u637B\u639C\u63D1\u6444\u6470\u651D\u655C\u67BF\u69F7\u6AF1\u6D85\u6E7C\u75C6\u7BDE\u7C4B\u7CF1\u7CF5\u8042\u8076\u81EC\u81F2\u82F6\u83CD\u8616\u8825\u8B98\u8E02\u8E17\u8E19\u8E51\u8EA1\u92B8\u92F7\u931C\u93B3\u9448\u9477\u9480\u954A\u954D\u95D1\u9667\u9689\u9873\u989E\u9F67", "nin": "\u56DC\u6041\u60A8\u62F0\u810C", "ning": "\u4F5E\u4FAB\u503F\u511C\u51DD\u549B\u5680\u5B23\u5B81\u5BCD\u5BD5\u5BD7\u5BDC\u5BE7\u62E7\u64F0\u67E0\u6A63\u6AB8\u6CDE\u6F9D\u6FD8\u72DE\u7370\u752F\u77C3\u804D\u8079\u82E7\u85B4\u944F\u9B21\u9E0B", "niu": "\u599E\u5B67\u5FF8\u6013\u626D\u629D\u62D7\u677B\u6C7C\u6C91\u7084\u725B\u725C\u72C3\u7D10\u7EBD\u83A5\u9215\u94AE\u9775", "nong": "\u4FAC\u5102\u519C\u54DD\u5665\u5F04\u630A\u6335\u6A82\u6B01\u6D53\u6FC3\u71F6\u7651\u79AF\u79FE\u7A60\u7E77\u8113\u81BF\u857D\u895B\u8B68\u8FB2\u8FB3\u91B2\u9B1E\u9F48", "nou": "\u6419\u69C8\u6ABD\u7373\u7FBA\u8028\u9392\u941E", "nu": "\u4F2E\u5089\u52AA\u5974\u5B65\u5E11\u5F29\u6012\u6419\u782E\u7B2F\u80EC\u99D1\u9A7D", "nuan": "\u597B\u6696\u6E1C\u6E6A\u7157\u992A", "nuo": "\u50A9\u513A\u558F\u5A1C\u611E\u61E6\u61E7\u632A\u63BF\u6419\u6426\u643B\u689B\u6992\u6A60\u6BED\u7A2C\u7A64\u7CD1\u7CE5\u7CEF\u800E\u88B2\u88B3\u8AFE\u8BFA\u8E43\u903D\u9369\u9518\u96BE", "nv": "\u5973\u6067\u6712\u6C91\u7C79\u804F\u8842\u8844\u91F9\u9495", "nve": "\u5A69\u759F\u7627\u7878\u8650", "o": "\u54E6\u5594\u5662\u5684\u7B7D", "ou": "\u5076\u533A\u5340\u5418\u543D\u5455\u5614\u5878\u6004\u616A\u6AD9\u6B27\u6B50\u6BB4\u6BC6\u6CA4\u6F1A\u71B0\u74EF\u750C\u79BA\u8026\u8162\u8192\u8545\u85D5\u85F2\u8B33\u8BB4\u93C2\u9D0E\u9DD7\u9E25", "pa": "\u556A\u5991\u5E0A\u5E15\u6015\u6252\u63B1\u6777\u6C43\u6F56\u722C\u7436\u7685\u7B62\u8019\u8225\u82E9\u8469\u8899\u8DB4\u9200\u94AF", "pai": "\u4FF3\u54CC\u5EF9\u5F98\u62CD\u6392\u68D1\u6CA0\u6D3E\u6E12\u6E43\u724C\u72A4\u7305\u7B84\u7C30\u7C32\u848E\u8F2B\u8FEB\u9383", "pan": "\u4E2C\u51B8\u5224\u53DB\u5762\u5ABB\u5E4B\u6273\u62CC\u62DA\u642B\u6500\u67C8\u69C3\u6C9C\u6CEE\u6D00\u6E74\u6EBF\u6F58\u700A\u708D\u723F\u7249\u7554\u7568\u756A\u76D8\u76E4\u76FB\u76FC\u7705\u772B\u78D0\u78FB\u7C53\u7E0F\u8041\u80A8\u80D6\u81B0\u822C\u8420\u84B0\u87E0\u88A2\u897B\u8A4A\u8DD8\u8E52\u8E63\u92EC\u939C\u947B\u95C6\u97B6\u9816\u9D65", "pang": "\u4E53\u5390\u55D9\u5906\u5ACE\u5C28\u5E9E\u5EAC\u5F77\u5FAC\u65C1\u6C78\u6C97\u6EC2\u7090\u772B\u78C5\u7BE3\u802A\u80A8\u80D6\u80EE\u8180\u8196\u823D\u8783\u89AB\u8DBD\u9004\u96F1\u9736\u9AC8\u9C1F\u9CD1\u9F8E\u9F90", "pao": "\u5228\u530F\u5486\u5697\u5789\u5945\u5E96\u629B\u62CB\u6CE1\u70AE\u70B0\u70F0\u722E\u72CD\u74DF\u75B1\u76B0\u7832\u791F\u792E\u7A6E\u812C\u8422\u85E8\u888C\u888D\u891C\u8DC1\u8DD1\u8EF3\u9764\u9784\u9E83\u9E85\u9EAD", "pei": "\u4F02\u4F69\u4FD6\u5478\u574F\u57F9\u5983\u599A\u59F5\u5A44\u5A90\u5D8F\u5E14\u600C\u62B7\u6508\u65BE\u65C6\u6622\u67ED\u67F8\u68D1\u6BF0\u6C9B\u6D7F\u6DE0\u72BB\u73EE\u7423\u80A7\u80DA\u8337\u84DC\u8843\u88F4\u88F5\u8CE0\u8D54\u8F61\u8F94\u914D\u9185\u9307\u952B\u962B\u966A\u9708\u99B7", "pen": "\u5460\u55AF\u55B7\u5674\u6B55\u6E53\u6FC6\u74EB\u76C6\u7FF8\u8450", "peng": "\u4EA8\u5017\u50B0\u527B\u5309\u562D\u580B\u585C\u5873\u5F38\u5F6D\u6026\u6072\u6189\u62A8\u6337\u6340\u6367\u63BD\u6412\u6453\u670B\u6888\u68DA\u6916\u692A\u69F0\u6A25\u6CD9\u6DCE\u6DDC\u6F28\u6F30\u6F8E\u70F9\u71A2\u75ED\u768F\u7830\u7851\u787C\u78B0\u78DE\u7A1D\u7AFC\u7BE3\u7BF7\u7D63\u7E84\u80D3\u81A8\u8283\u82F9\u8391\u84EC\u8615\u87DA\u87DB\u88B6\u8E2B\u8EEF\u8F23\u930B\u945D\u959B\u97F8\u97FC\u99CD\u9A2F\u9AFC\u9B05\u9B14\u9D6C\u9E4F", "pi": "\u4E15\u4EF3\u4F13\u4F3E\u50FB\u5288\u5339\u5421\u5426\u5564\u567C\u567D\u568A\u56AD\u572E\u574F\u576F\u57E4\u58C0\u599A\u5AB2\u5AD3\u5C41\u5CAF\u5D25\u5D8F\u5E80\u6036\u6082\u61B5\u6279\u62AB\u62B7\u63CA\u64D7\u65C7\u6707\u6787\u6788\u6911\u698C\u6BD7\u6BD8\u6DE0\u6F4E\u6FBC\u6FDE\u708B\u7137\u72C9\u72D3\u7308\u7435\u7513\u7588\u758B\u75B2\u75DE\u7656\u76AE\u7765\u7812\u78C7\u7914\u7915\u7986\u79DB\u79E0\u7A2B\u7B13\u7BFA\u7D15\u7EB0\u7F62\u7F74\u7F77\u7F86\u7FCD\u801A\u80B6\u8134\u813E\u8157\u818D\u8298\u82C9\u868D\u86BD\u86BE\u8731\u8795\u87B7\u882F\u88AB\u88E8\u8AC0\u8B6C\u8C7C\u8C7E\u8C94\u8F9F\u90B3\u90EB\u91FD\u921A\u9239\u925F\u9294\u92A2\u9303\u930D\u939E\u94CD\u95E2\u9630\u9642\u9674\u96A6\u9739\u979E\u99D3\u9AEC\u9B6E\u9B7E\u9B8D\u9C8F\u9D04\u9D67\u9DFF\u9E0A\u9F19", "pian": "\u4FBF\u504F\u56E8\u5AA5\u6241\u6944\u6969\u7247\u728F\u7335\u7371\u7478\u74B8\u7BC7\u7DF6\u7F0F\u7FE9\u80FC\u8141\u8991\u8ADE\u8C1D\u8CB5\u8CC6\u8DF0\u8E41\u9342\u99E2\u9A08\u9A17\u9A19\u9A88\u9A97\u9ABF\u9B78\u9DA3", "piao": "\u50C4\u527D\u52E1\u560C\u5AD6\u5F6F\u5FB1\u6153\u65DA\u6734\u6B8D\u6F02\u72A5\u74E2\u76AB\u779F\u7968\u7BFB\u7E39\u7F25\u7FF2\u83A9\u8508\u85B8\u87B5\u91A5\u95DD\u9860\u98C3\u98C4\u98D8\u9A43\u9AA0\u9B52", "pie": "\u4E3F\u5AF3\u6486\u6487\u66BC\u6C15\u6F4E\u77A5\u82E4\u8995\u9405", "pin": "\u54C1\u56AC\u59D8\u5A26\u5AD4\u5B2A\u62DA\u62FC\u6980\u6C56\u725D\u73AD\u7415\u77C9\u780F\u7917\u7A66\u8058\u85B2\u860B\u8819\u8CA7\u8D2B\u983B\u9870\u9891\u98A6\u99AA\u9A5E", "ping": "\u4E52\u4FDC\u51AF\u51ED\u51F4\u546F\u576A\u5840\u5A09\u5C4F\u5CBC\u5E21\u5E32\u5E48\u5E73\u5EB0\u617F\u6191\u67B0\u6A98\u6CD9\u6D34\u6D84\u6DDC\u7129\u73B6\u74F6\u7501\u7539\u782F\u7851\u7AEE\u7BB3\u7C08\u7F3E\u8060\u80D3\u8275\u82F9\u8353\u840D\u84F1\u860B\u86B2\u86E2\u8A55\u8BC4\u8EFF\u8F27\u90F1\u927C\u9829\u99AE\u9B83\u9C86", "po": "\u53F5\u54F1\u5619\u56A9\u5761\u5964\u5A46\u5C00\u5CA5\u5CB6\u5EF9\u642B\u6540\u6622\u6734\u6872\u6AC7\u6CCA\u6CFA\u6CFC\u6D26\u6E50\u6E8C\u6F51\u6FFC\u70DE\u733C\u73C0\u76A4\u7834\u7836\u7B38\u7BA5\u7C95\u7E41\u7FCD\u84AA\u8522\u8FEB\u9131\u9166\u9197\u91B1\u91D9\u9255\u93FA\u948B\u94B7\u9642\u9817\u9887\u99CA\u9AF2\u9B44", "pou": "\u5256\u5485\u54E3\u57BA\u5A1D\u5A44\u6294\u6299\u634A\u638A\u68D3\u7283\u7B81\u88D2", "pu": "\u4EC6\u50D5\u530D\u535C\u5657\u5703\u5711\u5724\u57D4\u5821\u58A3\u6251\u62AA\u6357\u64B2\u64C8\u6534\u6535\u666E\u669C\u66B4\u66DD\u6734\u67E8\u6A38\u6A8F\u6C06\u6D66\u6EA5\u6F7D\u6FEE\u7011\u7087\u70F3\u735B\u749E\u75E1\u77A8\u79FF\u7A59\u7B81\u7E80\u812F\u8216\u8217\u8386\u83D0\u83E9\u8461\u84B1\u84B2\u8AE9\u8B5C\u8C31\u8D0C\u8E7C\u917A\u92EA\u93F7\u9420\u94FA\u9564\u9568\u9660\u9BC6", "qi": "\u4E03\u4E0C\u4E5E\u4E93\u4E9D\u4E9F\u4F01\u4F0E\u4FDF\u501B\u50B6\u50DB\u5176\u51C4\u5258\u542F\u5447\u545A\u546E\u54A0\u5518\u552D\u5550\u5553\u5554\u555F\u55B0\u5601\u5650\u5668\u573B\u57FC\u5884\u5921\u5947\u5951\u59BB\u5A38\u5A4D\u5C7A\u5C82\u5C90\u5C93\u5D0E\u5D5C\u5E3A\u5F03\u5FD4\u5FEF\u6053\u60BD\u6112\u612D\u617C\u617D\u6187\u61A9\u61E0\u621A\u6271\u637F\u6391\u63ED\u6456\u6532\u6567\u6589\u658A\u65C2\u65D7\u6675\u66A3\u671F\u675E\u679D\u67D2\u6814\u6816\u6864\u687C\u68A9\u68C4\u68CA\u68CB\u68E8\u68F2\u69BF\u69ED\u6AB1\u6AC0\u6B2B\u6B39\u6B3A\u6B67\u6C14\u6C17\u6C23\u6C54\u6C7D\u6C8F\u6CE3\u6D13\u6DC7\u6DD2\u6E46\u6E47\u6ECA\u6F06\u6FDD\u7081\u710F\u7309\u7382\u7398\u7426\u742A\u7482\u7508\u7541\u7566\u75A7\u76C0\u76F5\u77F5\u780C\u7881\u7895\u789B\u78B6\u78DC\u78E7\u78E9\u7918\u7941\u7947\u7948\u797A\u79A5\u7A18\u7A3D\u7AD0\u7AD2\u7C2F\u7C31\u7C4F\u7CB8\u7D2A\u7DA5\u7DA6\u7DA8\u7DAE\u7DBA\u7DC0\u7DDD\u7EEE\u7F09\u7F4A\u8006\u80B5\u8110\u81CD\u8269\u8291\u829E\u82AA\u8360\u8401\u840B\u8415\u847A\u8572\u85BA\u85C4\u85D2\u8604\u8691\u8694\u869A\u86F4\u871D\u871E\u8787\u87A7\u87FF\u8810\u88B3\u8900\u8904\u89ED\u8A16\u8AC6\u8AEC\u8BAB\u8C48\u8D77\u8D9E\u8DC2\u8E4A\u8EDD\u8FC4\u8FC9\u9094\u90EA\u913F\u91EE\u9321\u93DA\u9411\u951C\u95D9\u966D\u9691\u970B\u980E\u9880\u9A0E\u9A0F\u9A39\u9A90\u9A91\u9B10\u9B3F\u9B4C\u9BD5\u9C2D\u9CAF\u9CCD\u9D78\u9D80\u9D88\u9E92\u9EA1\u9F4A\u9F50", "qia": "\u51BE\u533C\u5361\u54AD\u5736\u5CE0\u5E22\u6070\u6118\u62B2\u62E4\u6390\u63E2\u6B8E\u6D3D\u7848\u78CD\u80E2\u845C\u88B7\u8DD2\u9160\u9790\u9AC2", "qian": "\u4E79\u4E7E\u4E81\u4EDF\u4EF1\u4F23\u4F65\u4FD4\u5029\u5042\u5094\u50C9\u5119\u51F5\u520B\u524D\u5343\u53B1\u550A\u55DB\u5731\u5732\u5811\u5879\u5898\u58CD\u5977\u5A5C\u5A8A\u5B31\u5B45\u5B6F\u5C8D\u5C92\u5D4C\u5D70\u5FF4\u6093\u60AD\u6106\u614A\u6173\u6266\u6272\u62D1\u62EA\u6333\u6385\u6394\u63AE\u63F5\u6434\u647C\u6481\u648D\u6510\u6511\u6513\u6701\u6744\u68C8\u6920\u69A9\u69CF\u69E7\u6A6C\u6AB6\u6ACF\u6B20\u6B26\u6B3F\u6B49\u6B6C\u6C58\u6C67\u6D45\u6DFA\u6F5B\u6F5C\u6FF3\u704A\u70B6\u7154\u7275\u727D\u728D\u73AA\u7698\u78CF\u7ACF\u7B7E\u7B9D\u7BCF\u7BDF\u7C3D\u7C56\u7C64\u7C81\u7DAA\u7E34\u7E7E\u7EA4\u7F31\u7F9F\u7FAC\u80B7\u8181\u81E4\u828A\u82A1\u831C\u833E\u8368\u8465\u84A8\u8533\u8541\u8654\u8688\u8699\u8738\u8930\u8AD0\u8B19\u8B74\u8C26\u8C34\u8C38\u8EE1\u8F24\u8FC1\u9063\u9077\u91FA\u9206\u9210\u9257\u925B\u92AD\u9322\u9386\u93F2\u9453\u948E\u94A4\u94B1\u94B3\u94C5\u9621\u976C\u97C6\u9845\u9A1A\u9A1D\u9A2B\u9A9E\u9B1C\u9B1D\u9C2C\u9CFD\u9D6E\u9E50\u9ED4\u9EDA", "qiang": "\u545B\u5534\u554C\u55C6\u55F4\u588F\u5899\u58BB\u5AF1\u5B19\u5C06\u5D88\u5EE7\u5F37\u5F3A\u5F4A\u6215\u6217\u6227\u62A2\u6436\u6464\u646A\u65A8\u67AA\u690C\u69CD\u6A2F\u6AA3\u6EAC\u6F12\u709D\u7197\u7244\u7246\u7310\u7347\u73B1\u7472\u7586\u77FC\u7BEC\u7E48\u7E66\u7F8C\u7F97\u7F9F\u7FA5\u7FAB\u7FBB\u8154\u8262\u8503\u8537\u8594\u8620\u8723\u8941\u8B12\u8DC4\u8E4C\u8E61\u9397\u93D8\u93F9\u9516\u9535\u956A\u9DAC", "qiao": "\u4E02\u4E54\u4FA8\u4FCF\u5062\u50D1\u50FA\u5281\u52EA\u55AC\u55BF\u563A\u566D\u589D\u58A7\u58BD\u58F3\u5AF6\u5CE4\u5CED\u5D6A\u5DA0\u5DE7\u5E29\u5E53\u5E67\u6084\u6100\u6194\u646E\u64AC\u64BD\u6572\u6865\u69D7\u6A35\u6A47\u6A4B\u6A7E\u6AF5\u6BBB\u6BBC\u6BC3\u6F50\u714D\u71C6\u71CB\u729E\u7644\u7744\u77A7\u7857\u785A\u78BB\u78DD\u78FD\u7904\u7909\u7A8D\u7AC5\u7BBE\u7E51\u7E70\u7F32\u7FD8\u7FF9\u834D\u835E\u83EC\u854E\u85EE\u8A9A\u8B59\u8BEE\u8C2F\u8DAB\u8DAC\u8DF7\u8E0D\u8E7A\u8E7B\u8E88\u90FB\u9121\u9125\u91E5\u936B\u936C\u93D2\u9408\u9430\u9539\u9657\u96C0\u9792\u9798\u97A9\u97BD\u97D2\u981D\u9866\u9AB9\u9ADA\u9ADC", "qie": "\u4E14\u4F3D\u5207\u5327\u5392\u5951\u59BE\u5E39\u602F\u608F\u60EC\u611C\u614A\u6308\u6705\u6814\u6904\u6D2F\u6DC1\u7330\u758C\u780C\u7A27\u7A55\u7A83\u7ACA\u7B21\u7BA7\u7BCB\u7C61\u807A\u82C6\u8304\u86EA\u8D84\u8DD9\u8E25\u90C4\u9365\u9532\u9BDC", "qin": "\u4EB2\u4FB5\u5153\u52E4\u5422\u5423\u551A\u55EA\u5659\u5745\u57D0\u5807\u5A87\u5AC0\u5BD1\u5BD6\u5BDD\u5BE2\u5BF4\u5D5A\u5D70\u5D94\u5D9C\u5E88\u5ED1\u5FF4\u616C\u61C3\u61C4\u6272\u628B\u6366\u63FF\u6407\u64B3\u64D2\u65B3\u6611\u68A3\u68AB\u6A8E\u6B3D\u6C81\u6EB1\u6FBF\u7019\u73E1\u7434\u7439\u763D\u77DC\u77DD\u79BD\u79E6\u7B09\u7D85\u8039\u80A3\u82A9\u82B9\u83E3\u83E6\u83F3\u85FD\u8699\u8793\u87BC\u8804\u887E\u8983\u89AA\u8A9B\u8D7E\u9219\u922B\u92DF\u94A6\u9513\u96C2\u9772\u9849\u99F8\u9A8E\u9BBC\u9CF9\u9D6D", "qing": "\u4EB2\u503E\u50BE\u512C\u51CA\u5260\u52CD\u537F\u5568\u570A\u57E5\u591D\u5BC8\u5E86\u5EBC\u5ECE\u60C5\u6176\u6385\u64CE\u64CF\u6674\u6692\u68FE\u6A08\u6AA0\u6ABE\u6AE6\u6B91\u6BB8\u6C22\u6C2B\u6C30\u6DF8\u6E05\u6E39\u6F00\u6FEA\u7520\u7858\u7883\u78EC\u7B90\u7DAA\u7DAE\u7F44\u82D8\u845D\u873B\u89AA\u8ACB\u8B26\u8BF7\u8EFD\u8F15\u8F7B\u90EC\u9306\u944B\u9751\u9752\u9758\u9803\u9877\u9BD6\u9CAD\u9EE5", "qiong": "\u511D\u536D\u5B1B\u5B86\u60F8\u618C\u684F\u6A69\u712A\u712D\u7162\u718D\u7401\u743C\u749A\u74CA\u74D7\u7758\u778F\u7A77\u7A79\u7AAE\u7AC6\u7B3B\u7B47\u823C\u8315\u85D1\u85ED\u86E9\u86EC\u8D79\u8DEB\u909B\u928E", "qiu": "\u4E18\u4E20\u4EC7\u4FC5\u53B9\u53F4\u5512\u56DA\u5775\u5878\u5A9D\u5D37\u5DEF\u5DF0\u6058\u6077\u624F\u641D\u6739\u6882\u6978\u6A5A\u6B8F\u6BEC\u6C42\u6C53\u6CC5\u6D57\u6E1E\u6E6B\u6E6C\u6E6D\u716A\u726B\u72B0\u738C\u7403\u7486\u76B3\u76DA\u79CB\u79CC\u7A50\u7BCD\u7CD7\u7D0C\u7D7F\u7DE7\u808D\u827D\u8281\u838D\u8429\u84F2\u8612\u866C\u866F\u86AF\u86F7\u8764\u8775\u87D7\u8824\u88D8\u89D3\u89E9\u8A04\u8A05\u8CD5\u8D47\u8DA5\u900E\u9011\u9052\u90B1\u914B\u9194\u91DA\u91FB\u92B6\u97A6\u97A7\u9804\u9B82\u9BC4\u9C0C\u9C0D\u9C3D\u9CC5\u9D96\u9E59\u9F3D\u9F9C\u9F9D\u9F9F", "qu": "\u4F39\u4F49\u4F62\u521E\u52AC\u5324\u533A\u5340\u53BA\u53BB\u53D6\u547F\u5765\u5A36\u5C48\u5C96\u5CA8\u5CB4\u5D87\u5FC2\u6188\u620C\u6235\u62BE\u657A\u65AA\u66F2\u6710\u6B0B\u6B14\u6B2A\u6C0D\u6D40\u6DED\u6E20\u7048\u710C\u7140\u7220\u7496\u74A9\u766F\u77BF\u78F2\u795B\u7AD8\u7AEC\u7B41\u7C67\u7CAC\u7D36\u7D47\u7FD1\u7FF5\u801D\u80CA\u80E0\u81DE\u82E3\u83C3\u844B\u8556\u8627\u86BC\u86C6\u86D0\u877A\u87B6\u87DD\u8837\u883C\u8850\u8862\u88AA\u89B0\u89B7\u89BB\u89D1\u8A53\u8A58\u8AB3\u8BCE\u8D8B\u8D8D\u8DA3\u8DA8\u8EA3\u8EAF\u8EC0\u8EE5\u947A\u95B4\u95C3\u9612\u9639\u99C6\u99C8\u9A45\u9A71\u9AF7\u9B7C\u9C38\u9C4B\u9D1D\u9D8C\u9E1C\u9E32\u9EAE\u9EAF\u9EB4\u9EB9\u9EE2\u9F01\u9F29\u9F72\u9F8B", "quan": "\u4F7A\u5168\u5238\u529D\u52E7\u52F8\u5573\u5708\u570F\u57E2\u594D\u59FE\u5A58\u5B49\u5CD1\u5DCF\u5F2E\u606E\u609B\u60D3\u62F3\u6372\u643C\u6743\u68EC\u6926\u697E\u69EB\u6A29\u6B0A\u6CC9\u6D24\u6E76\u7065\u70C7\u7276\u7277\u7288\u72AC\u72AD\u72AE\u72CB\u7454\u754E\u75CA\u77D4\u7842\u7B4C\u7B9E\u7D5F\u7DA3\u7E13\u7EFB\u8343\u8472\u8647\u8737\u8838\u89E0\u8A6E\u8BE0\u8DE7\u8E21\u8F07\u8F81\u919B\u9293\u9409\u94E8\u95CE\u97CF\u9874\u98A7\u99E9\u9A21\u9B08\u9C01\u9CC8\u9F64", "que": "\u5095\u5374\u537B\u57C6\u5859\u58A7\u5D05\u60AB\u6128\u6164\u6409\u6560\u656A\u69B7\u6C4B\u7094\u71E9\u7437\u7638\u76B5\u785E\u786E\u788F\u78BA\u78BB\u7910\u792D\u7F3A\u7F3C\u828D\u849B\u8697\u8D9E\u95CB\u95D5\u9615\u9619\u96C0\u9D72\u9E4A", "qun": "\u56F7\u590B\u5BAD\u5CEE\u5E2C\u6B4F\u7B98\u7FA3\u7FA4\u88D9\u88E0\u9021\u9E87\u9E95", "ran": "\u5184\u5189\u5465\u562B\u59CC\u5AA3\u67D3\u6A6A\u7136\u71AF\u71C3\u73C3\u7E4E\u80B0\u82D2\u8485\u86A6\u86BA\u887B\u8887\u88A1\u9AE5\u9AEF", "rang": "\u5134\u52F7\u56B7\u58CC\u58E4\u61F9\u6518\u703C\u7219\u737D\u74E4\u79B3\u7A63\u7A70\u7E95\u8618\u8B72\u8B93\u8BA9\u8E9F\u9B24", "rao": "\u5A06\u5B08\u6270\u64FE\u6861\u6A48\u7A58\u7E5E\u7ED5\u835B\u8558\u8953\u9076\u96A2\u9952\u9976", "re": "\u558F\u60F9\u637C\u6E03\u70ED\u71B1\u82E5", "ren": "\u4EBA\u4EBB\u4EC1\u4EDE\u4EED\u4EFB\u5203\u5204\u58EC\u598A\u59D9\u5C7B\u5C83\u5FC8\u5FCD\u5FCE\u6268\u6732\u6752\u6820\u6823\u6895\u68EF\u7263\u794D\u79C2\u79F9\u7A14\u7D09\u7D1D\u7D4D\u7D9B\u7EAB\u7EB4\u8095\u814D\u82A2\u834F\u8375\u83CD\u845A\u887D\u88B5\u8A12\u8A8D\u8BA4\u8BB1\u8EB5\u8ED4\u8F6B\u91F0\u91FC\u9213\u928B\u976D\u9771\u97CC\u97E7\u98EA\u9901\u996A\u9B5C\u9D40", "reng": "\u4ECD\u6254\u793D\u82BF\u8FB8\u967E", "ri": "\u56F8\u65E5\u6C1C\u8875\u91F0\u91FC\u9224\u99B9\u9A72", "rong": "\u5087\u509B\u5197\u5748\u5AB6\u5AC6\u5B2B\u5B82\u5BB9\u5CF5\u5D58\u5D64\u5DB8\u620E\u6408\u6411\u66E7\u6804\u6995\u69AE\u69B5\u69E6\u6BE7\u6C04\u6EB6\u701C\u70FF\u7194\u7203\u72E8\u7462\u7A41\u7A43\u7D68\u7E19\u7ED2\u7FA2\u809C\u8319\u8338\u8363\u84C9\u877E\u878D\u878E\u8811\u8923\u8EF5\u9394\u9555\u99E5", "rou": "\u53B9\u5A83\u5B8D\u63C9\u67D4\u697A\u6E18\u7163\u7448\u74C7\u79B8\u7C88\u7CC5\u8089\u811C\u816C\u8447\u875A\u8B73\u8E42\u8F2E\u9352\u97A3\u97D6\u9A25\u9C07\u9D94", "ru": "\u4E73\u4F9E\u5112\u5165\u543A\u55D5\u5685\u5973\u5982\u5AB7\u5B2C\u5B7A\u5DBF\u5E24\u6256\u6310\u64E9\u66D8\u6741\u6847\u6ABD\u6C5D\u6D33\u6E2A\u6EBD\u6FE1\u7373\u7B4E\u7E1F\u7F1B\u8097\u8339\u8498\u84D0\u8560\u85B7\u8761\u8815\u88BD\u8925\u8966\u8FB1\u909A\u910F\u91B9\u92A3\u94F7\u986C\u98A5\u9C6C\u9CF0\u9D11\u9D3D", "rua": "\u633C", "ruan": "\u5044\u5827\u58D6\u5A86\u648B\u670A\u6ABD\u744C\u74C0\u789D\u791D\u7DDB\u800E\u815D\u8EDF\u8F2D\u8F6F\u962E", "rui": "\u514A\u514C\u5151\u53E1\u58E1\u60E2\u6290\u6798\u6875\u6A64\u6C6D\u745E\u7524\u777F\u7B0D\u7DCC\u7E60\u82AE\u82FC\u854A\u854B\u8564\u8602\u8603\u868B\u8739\u92B3\u92ED\u93F8\u9510", "run": "\u6A4D\u6DA6\u6F64\u77A4\u81B6\u958F\u95A0\u95F0", "ruo": "\u504C\u53D2\u5A7C\u5D76\u5F31\u633C\u637C\u6949\u6E03\u712B\u7207\u7BAC\u7BDB\u82E5\u84BB\u9100\u9C19\u9C2F\u9DB8", "sa": "\u4EE8\u5345\u6332\u644B\u6492\u6503\u6AD2\u6CE7\u6D12\u6F75\u7051\u7E9A\u810E\u8428\u856F\u85A9\u8A2F\u8EA0\u9212\u93FE\u9491\u96A1\u9778\u9788\u98AF\u98D2\u99BA", "sai": "\u50FF\u55EE\u5625\u567B\u585E\u601D\u6122\u63CC\u6BE2\u6BF8\u7C3A\u816E\u8CFD\u8D5B\u984B\u9C13\u9CC3", "san": "\u4E09\u4ED0\u4F1E\u4FD5\u5098\u5381\u53C1\u53C2\u53C3\u53C4\u53C5\u58ED\u5E34\u5F0E\u6563\u6BF5\u6BF6\u6BFF\u6F75\u7299\u7CC1\u7CDD\u7CE3\u7CE4\u7E56\u93D2\u93FE\u9590\u994A\u9993\u9B16", "sang": "\u4E27\u55AA\u55D3\u6421\u6851\u6852\u69E1\u78C9\u892C\u939F\u9859\u98A1", "sao": "\u57FD\u5AC2\u6145\u61C6\u626B\u6383\u63BB\u6414\u68A2\u6C09\u6E9E\u7619\u77C2\u7E45\u7E70\u7F2B\u7F32\u81CA\u87A6\u98BE\u9A12\u9A37\u9A9A\u9ADE\u9C20\u9C62\u9CCB", "se": "\u556C\u55C7\u585E\u5EE7\u61CE\u62FA\u6475\u64CC\u681C\u69ED\u6B6E\u6B70\u6D13\u6DA9\u6E0B\u6F80\u6F81\u6FC7\u6FCF\u7012\u7417\u745F\u74B1\u7637\u7A51\u7A61\u7A6F\u7CA3\u7E6C\u8272\u8594\u8B45\u8F56\u92AB\u938D\u93FC\u94EF\u95AA\u95DF\u96ED\u98CB", "sen": "\u68EE\u692E\u69EE\u8942", "seng": "\u50E7\u9B19", "sha": "\u4E77\u503D\u50BB\u510D\u5239\u524E\u53A6\u5526\u553C\u5551\u5565\u55A2\u55C4\u5E39\u5EC8\u6331\u6332\u644B\u6740\u6749\u686C\u699D\u6A27\u6B43\u6B70\u6BBA\u6BEE\u6C99\u6FC8\u715E\u7300\u75E7\u7802\u7870\u7B91\u7C86\u7D17\u7E7A\u7EB1\u7FDC\u7FE3\u838E\u83E8\u8410\u8531\u88DF\u93A9\u94E9\u95AF\u95B7\u970E\u9AFF\u9B66\u9BCA\u9BCB\u9CA8", "shai": "\u644B\u6526\u6652\u66EC\u7B5B\u7BE9\u7C01\u7C1B\u7C6D\u8272\u8AF0\u917E", "shan": "\u5093\u50D0\u5103\u5220\u522A\u5261\u527C\u5355\u5584\u55AE\u5607\u5738\u57CF\u58A0\u58A1\u59CD\u59D7\u5B17\u5C71\u5DA6\u5E53\u5F61\u6247\u633B\u639E\u63B8\u63BA\u6427\u64A3\u64C5\u657E\u6671\u6749\u67F5\u6805\u692B\u6A3F\u6A86\u6B5A\u6C55\u6F6C\u6F78\u6F98\u7057\u70B6\u70FB\u7154\u717D\u718C\u72E6\u73CA\u759D\u75C1\u7752\u78F0\u7985\u79AA\u7A47\u7B18\u7E3F\u7E55\u7F2E\u7FB4\u7FB6\u8120\u81B3\u81BB\u8222\u829F\u82EB\u87EE\u87FA\u886B\u89A2\u8A15\u8B06\u8B71\u8BAA\u8D0D\u8D61\u8D78\u8DDA\u8ED5\u9096\u912F\u91E4\u928F\u9425\u9490\u9583\u9584\u958A\u95EA\u9655\u965D\u994D\u9A38\u9A9F\u9BC5\u9C53\u9C54\u9CDD\u9CE3", "shang": "\u4E04\u4E0A\u4F24\u50B7\u5546\u57A7\u5892\u5C19\u5C1A\u6066\u6113\u616F\u6244\u664C\u6A09\u6B87\u6BA4\u6C64\u6E6F\u6EF3\u6F21\u71B5\u7993\u7DD4\u7EF1\u850F\u87AA\u88F3\u89DE\u89F4\u8B2A\u8CDE\u8D18\u8D4F\u92FF\u93DB\u945C\u979D\u9B3A", "shao": "\u4F4B\u52AD\u52FA\u5372\u53EC\u54E8\u5A0B\u5C11\u5F30\u634E\u65D3\u6753\u67D6\u68A2\u6F72\u70E7\u713C\u71D2\u73BF\u7744\u7A0D\u7B72\u7D39\u7DA4\u7ECD\u8244\u828D\u82D5\u83A6\u8437\u8571\u86F8\u8891\u8F0E\u90B5\u9798\u97F6\u9AFE\u9BB9", "she": "\u4F58\u538D\u5399\u5962\u5C04\u5F3D\u6151\u6174\u61FE\u6298\u62FE\u6315\u6368\u63F2\u6442\u6444\u651D\u6AA8\u6B07\u6B59\u6CCF\u6D89\u6DBB\u6E09\u6EE0\u7044\u731E\u756C\u756D\u7572\u78FC\u793E\u820C\u820D\u820E\u850E\u8675\u86C7\u86E5\u8802\u8A2D\u8BBE\u8CD2\u8CD6\u8D4A\u8D66\u8F0B\u95CD\u9607\u97D8\u9A07\u9E9D", "shei": "\u8AB0\u8C01", "shen": "\u4EC0\u4F38\u4F81\u4FBA\u4FE1\u515F\u53C2\u53C3\u53C4\u53C5\u5432\u547B\u54C2\u5814\u59BD\u59FA\u5A20\u5A76\u5AC0\u5B38\u5BA1\u5BB7\u5BE9\u5C7E\u5CF7\u5E53\u5F1E\u613C\u614E\u625F\u628C\u6437\u6552\u661A\u66CB\u66D1\u67DB\u68EF\u68FD\u6939\u698A\u6C20\u6C88\u6D81\u6DF0\u6DF1\u6E16\u6E17\u6EF2\u700B\u71CA\u73C5\u751A\u7521\u7527\u7533\u7606\u762E\u7712\u7718\u77AB\u77E4\u77E7\u7837\u795E\u7973\u7A7C\u7C76\u7C78\u7CC1\u7CC2\u7CDD\u7CE3\u7D33\u7EC5\u7F59\u7F67\u80BE\u80C2\u8124\u814E\u8398\u845A\u8460\u84E1\u8518\u8593\u8703\u8704\u88D1\u89BE\u8A20\u8A37\u8A75\u8AD7\u8B85\u8BDC\u8C02\u8C09\u8C0C\u8EAB\u90A5\u926E\u92E0\u9823\u99EA\u9B6B\u9BD3\u9BF5\u9C30\u9C3A\u9CB9\u9D62\u9EEE", "sheng": "\u4E57\u4E58\u5057\u5269\u5270\u52DD\u5347\u544F\u5723\u58AD\u58F0\u5A0D\u5D4A\u61B4\u6598\u6607\u665F\u6660\u66FB\u67A1\u6909\u69BA\u6A73\u6B85\u6BB8\u6CE9\u6E11\u6E3B\u6E66\u6FA0\u713A\u7272\u72CC\u73C4\u741E\u751F\u7525\u7538\u76DB\u7701\u771A\u7AD4\u7B19\u7E04\u7E49\u7E69\u7EF3\u8056\u8072\u80DC\u82FC\u8542\u8B5D\u8CB9\u8CF8\u924E\u935F\u9629\u965E\u9679\u9D7F\u9F2A", "shi": "\u4E16\u4E17\u4E68\u4E6D\u4E8A\u4E8B\u4EC0\u4ED5\u4F3C\u4F7F\u4F8D\u5158\u519F\u52BF\u52E2\u5319\u5341\u534B\u5394\u53F2\u545E\u5469\u54B6\u556B\u55DC\u5618\u5653\u566C\u57D8\u57F6\u5852\u58EB\u5931\u596D\u59CB\u59FC\u5A9E\u5B15\u5B9E\u5B9F\u5BA4\u5BA9\u5BB2\u5BD4\u5BE6\u5C38\u5C4D\u5C4E\u5CD5\u5CD9\u5D3B\u5D3C\u5D75\u5E02\u5E08\u5E2B\u5F0F\u5F11\u5F12\u5FA5\u5FD5\u5FEF\u6040\u6043\u60FF\u623A\u62ED\u62FE\u63D3\u65BD\u65F6\u65F9\u662F\u6630\u6642\u67BE\u67F9\u67FF\u6805\u683B\u6974\u6981\u69AF\u6AA1\u6B96\u6C0F\u6CFD\u6D49\u6E5C\u6E64\u6E7F\u6EA1\u6EAE\u6EBC\u6FA4\u6FA8\u6FD5\u70BB\u70D2\u7176\u72E7\u72EE\u72F6\u7345\u7461\u7564\u75D1\u7702\u770E\u7721\u7757\u77E2\u77F3\u7855\u78A9\u793A\u793B\u794F\u79F2\u7ACD\u7B36\u7B6E\u7BB7\u7C2D\u7C42\u7D41\u8006\u8210\u8213\u83B3\u8479\u8492\u8494\u84CD\u8671\u8680\u8755\u8768\u87AB\u8937\u896B\u8979\u8996\u89C6\u89E2\u8A66\u8A69\u8A93\u8ADF\u8AE1\u8B1A\u8B58\u8BC6\u8BD5\u8BD7\u8C25\u8C55\u8CB0\u8D33\u8EFE\u8F7C\u8FBB\u9002\u901D\u9048\u9069\u907E\u90BF\u917E\u91B3\u91C3\u91C8\u91CA\u91CB\u91F6\u9230\u9242\u9243\u9247\u9250\u927D\u92B4\u9366\u94C8\u98DF\u98E0\u98FE\u9919\u991D\u9963\u9970\u99B6\u99DB\u9A76\u9B96\u9BF4\u9C18\u9C23\u9C24\u9CA5\u9CBA\u9CF2\u9CFE\u9DB3\u9E24\u9F2B\u9F2D", "shou": "\u517D\u53CE\u53D7\u552E\u563C\u57A8\u58FD\u5900\u5B88\u5BFF\u624B\u624C\u6388\u6536\u654A\u6DAD\u719F\u72E9\u7363\u7378\u75E9\u7626\u7DAC\u7EF6\u8184\u824F\u93C9\u9996", "shu": "\u4E66\u4FB8\u4FDE\u500F\u5010\u5135\u516A\u53D4\u54B0\u587E\u5885\u59DD\u5A4C\u5B70\u5C0C\u5C17\u5C5E\u5C6C\u5EB6\u5EBB\u5FEC\u6037\u6038\u6055\u6086\u620D\u6292\u6348\u6352\u6393\u6445\u6504\u6570\u6578\u668F\u6691\u66D9\u66F8\u672E\u672F\u6731\u675F\u6778\u67A2\u6811\u68B3\u6A1E\u6A39\u6A7E\u6B8A\u6BB3\u6BF9\u6BFA\u6CAD\u6DD1\u6F31\u6F44\u6F7B\u6F8D\u6FD6\u702D\u7102\u719F\u7479\u74B9\u758B\u758E\u758F\u7659\u79EB\u7A0C\u7AD6\u7AEA\u7C54\u7CEC\u7D13\u7D49\u7D80\u7DF0\u7EBE\u7F72\u8167\u8212\u8357\u83FD\u8481\u84A3\u852C\u85A5\u85AF\u85F7\u866A\u8700\u8834\u8853\u88CB\u8961\u8969\u8C4E\u8D16\u8D4E\u8DFE\u8E08\u8ED7\u8F38\u8F93\u8FF0\u9103\u9265\u9330\u93E3\u964E\u9683\u9714\u9B9B\u9C6A\u9C70\u9D68\u9D90\u9ECD\u9F20\u9F21", "shua": "\u5237\u5530\u800D\u8A9C", "shuai": "\u535B\u5E05\u5E25\u6454\u7387\u7529\u7E17\u7F1E\u87C0\u8870", "shuan": "\u62F4\u6813\u69EB\u6DAE\u7D5F\u8168\u9582\u95E9", "shuang": "\u53CC\u587D\u5B40\u5B47\u6161\u6B06\u6CF7\u6F34\u6F3A\u7027\u7040\u723D\u7935\u7E14\u826D\u93EF\u96D9\u971C\u9A3B\u9A66\u9AA6\u9DDE\u9E18\u9E74", "shui": "\u5A37\u5E28\u6329\u635D\u6C34\u6C35\u6C3A\u6D97\u6D9A\u7761\u7971\u7A05\u7A0E\u813D\u88DE\u8AAA\u8AB0\u8BF4\u8C01\u9596", "shun": "\u542E\u696F\u6A53\u7734\u779A\u77A4\u77AC\u821C\u8563\u9806\u987A\u9B0A", "shuo": "\u5981\u612C\u6420\u6570\u6578\u6714\u69CA\u6B36\u6D2C\u70C1\u720D\u7361\u77DF\u7855\u78A9\u7BBE\u84B4\u8AAA\u8BF4\u928F\u9399\u9460\u94C4", "si": "\u4E1D\u4E96\u4F3A\u4F3C\u4F40\u4FA1\u4FDF\u4FEC\u5072\u5082\u5129\u5155\u51D8\u53AE\u53B6\u53F8\u549D\u55E3\u5636\u565D\u56DB\u59D2\u5A30\u5AA4\u5B60\u5BFA\u5DF3\u5EDD\u601D\u6056\u6122\u6495\u65AF\u676B\u67B1\u67F6\u68A9\u6952\u69B9\u6B7B\u6C5C\u6CC0\u6CD7\u6CE4\u6D0D\u6D20\u6D98\u6F8C\u7003\u71CD\u726D\u78C3\u7940\u7997\u79A0\u79A9\u79C1\u7AE2\u7B25\u7C1B\u7CF8\u7CF9\u7D72\u7DE6\u7E9F\u7F0C\u7F73\u801B\u801C\u8082\u8086\u856C\u857C\u8652\u86F3\u8724\u8784\u87D6\u87F4\u8997\u8C84\u91F2\u9236\u923B\u9270\u9289\u92AF\u92D6\u9376\u9401\u9536\u98B8\u98D4\u98DF\u98E4\u98F4\u98FC\u9972\u99DF\u9A03\u9A26\u9A77\u9BE3\u9DE5\u9E36\u9F36", "song": "\u502F\u50B1\u51C7\u5405\u5A00\u5B8B\u5D27\u5D69\u5D77\u5EBA\u5FEA\u6002\u609A\u6121\u612F\u616B\u61BD\u6352\u63D4\u6457\u677E\u6780\u67A9\u67D7\u68A5\u68C7\u6964\u6AA7\u6DDE\u6F0E\u6FCD\u7879\u7AE6\u8038\u8073\u83D8\u8A1F\u8AA6\u8BBC\u8BF5\u9001\u93B9\u980C\u9882\u9938\u99F7\u9B06", "sou": "\u5081\u51C1\u53DC\u53DF\u55D6\u55FD\u55FE\u5EC0\u5ECB\u6352\u635C\u641C\u6449\u6457\u64A8\u64DE\u64FB\u68F7\u6AE2\u6B36\u6EB2\u7340\u7636\u778D\u7C54\u8258\u8490\u84C3\u85AE\u85EA\u878B\u910B\u9199\u93AA\u93C9\u953C\u98BC\u98BE\u98D5\u993F\u998A\u9A2A", "su": "\u4FD7\u5083\u50F3\u55C9\u56CC\u5731\u57E3\u5850\u5851\u5919\u5ACA\u5BBF\u612B\u612C\u619F\u6475\u6880\u68F4\u69A1\u6A0E\u6A15\u6A5A\u6AEF\u6B90\u6CDD\u6D2C\u6D91\u6EAF\u6EB8\u6F5A\u6F65\u738A\u73DF\u749B\u7526\u78BF\u7A21\u7A23\u7A4C\u7AA3\u7C0C\u7C9B\u7C9F\u7D20\u7E24\u7E2E\u7F29\u8083\u8085\u8186\u82CF\u83A4\u850C\u85D7\u8607\u8613\u89EB\u8A34\u8B16\u8BC9\u8C21\u8D9A\u8E5C\u901F\u9061\u906C\u9165\u92C9\u9917\u9A4C\u9A95\u9BC2\u9C50\u9DEB\u9E54", "suan": "\u5334\u72FB\u75E0\u7958\u7B07\u7B6D\u7B97\u7BF9\u849C\u9178", "sui": "\u4E97\u5020\u54F8\u55FA\u57E3\u590A\u5A1E\u5B18\u5C3F\u5C81\u5D57\u65DE\u6A96\u6B72\u6B73\u6BF8\u6D7D\u6ED6\u6FBB\u6FC9\u7021\u716B\u71A3\u71E7\u74B2\u74CD\u772D\u775F\u7762\u7815\u788E\u795F\u79AD\u7A42\u7A57\u7A5F\u7D8F\u7E40\u7E50\u7E78\u7EE5\u7F1E\u81B8\u8295\u837D\u837E\u867D\u895A\u8AB6\u8B62\u8C07\u8CE5\u9040\u9042\u9083\u93F8\u9406\u9429\u968B\u968F\u96A7\u96A8\u96D6\u9796\u97E2\u9AC4\u9AD3", "sun": "\u55B0\u5B59\u5B6B\u627B\u635F\u640D\u640E\u644C\u69AB\u69C2\u72F2\u733B\u7B0B\u7B4D\u7BB0\u7C28\u836A\u84C0\u8575\u859E\u93A8\u96BC\u98E7\u98F1\u9DBD", "suo": "\u4E7A\u4E9B\u509E\u5506\u5522\u55CD\u55E6\u55E9\u5A11\u5AC5\u60E2\u6240\u6331\u6332\u644D\u669B\u686B\u68AD\u6E91\u6EB9\u7410\u7411\u7463\u7485\u7743\u7C11\u7C14\u7D22\u7E12\u7E2E\u7F29\u7FA7\u838E\u838F\u8470\u84D1\u8736\u8928\u8D96\u9024\u938D\u9396\u93BB\u93C1\u9501\u9BBB", "ta": "\u4ED6\u4FA4\u509D\u55D2\u5683\u56BA\u584C\u5854\u5896\u5979\u5B83\u5D09\u62D3\u631E\u6428\u64BB\u6999\u69BB\u6A7D\u6BFE\u6C93\u6DBE\u6E9A\u6EBB\u6F2F\u6FBE\u6FCC\u7260\u72E7\u736D\u737A\u7942\u79A2\u7C8F\u891F\u8ABB\u8B76\u8DBF\u8E0F\u8E4B\u8E79\u8E82\u8EA2\u905D\u9062\u9248\u9314\u9389\u9391\u94CA\u95D2\u95DF\u95E5\u95E7\u95FC\u9618\u9788\u979C\u97B3\u9B99\u9C28\u9CCE\u9FCE", "tai": "\u5113\u51AD\u53F0\u5454\u56FC\u576E\u592A\u5933\u5964\u5B2F\u5B61\u5FD5\u5FF2\u6001\u614B\u62AC\u64E1\u6584\u65F2\u67B1\u6AAF\u6C4F\u6C70\u6C71\u6CF0\u6E99\u70B1\u70B2\u71E4\u73C6\u7B88\u7C49\u80BD\u80CE\u81FA\u8226\u82D4\u83ED\u85B9\u8DC6\u90B0\u915E\u9226\u949B\u98B1\u99D8\u9A80\u9B90\u9C90", "tan": "\u5013\u509D\u50CB\u5103\u53F9\u5574\u55FF\u5606\u563D\u563E\u574D\u575B\u5766\u57EE\u58B0\u58B5\u58C7\u58DC\u5A52\u5B95\u5F39\u5F3E\u5F48\u5FD0\u6039\u60D4\u619B\u61B3\u61BB\u63A2\u644A\u64F9\u6524\u6619\u66BA\u66C7\u6983\u6A5D\u6A80\u6B4E\u6BEF\u6E60\u6EE9\u6F6C\u6F6D\u6FB9\u7058\u70AD\u71C2\u74AE\u75D1\u75F0\u762B\u7671\u78B3\u78F9\u7DC2\u7E75\u7F48\u7F4E\u8211\u8215\u83FC\u85EB\u8892\u8962\u8983\u8AC7\u8B5A\u8B60\u8C08\u8C2D\u8C9A\u8CAA\u8D2A\u90EF\u9188\u9193\u91B0\u926D\u931F\u94BD\u952C\u9561\u9843", "tang": "\u4F16\u5018\u5052\u508F\u50A5\u513B\u528F\u5510\u557A\u5621\u5763\u57EB\u5802\u5858\u5D63\u5E11\u60DD\u6113\u6203\u642A\u6465\u66ED\u68E0\u69B6\u6A18\u6A56\u6C64\u6DCC\u6E6F\u6E8F\u6F1F\u7059\u70EB\u717B\u71D9\u7223\u746D\u77D8\u78C4\u799F\u7BD6\u7CC3\u7CD6\u7CDB\u7FB0\u8025\u8185\u819B\u84CE\u859A\u876A\u8797\u87B3\u8D6F\u8D9F\u8E3C\u8E5A\u8EBA\u910C\u91A3\u9395\u93B2\u93DC\u940B\u9482\u94F4\u954B\u9557\u95DB\u969A\u97BA\u9939\u9944\u9967\u9DB6\u9F1E", "tao": "\u530B\u53E8\u54B7\u5555\u5932\u5935\u5957\u5ACD\u5E4D\u5F22\u6146\u62AD\u638F\u642F\u6843\u68BC\u69C4\u6AAE\u6D2E\u6D9B\u6DAD\u6DD8\u6ED4\u6FE4\u7118\u746B\u7979\u7D5B\u7DAF\u7E1A\u7E27\u7EE6\u7EF9\u8404\u872A\u88EA\u8A0E\u8A5C\u8B1F\u8BA8\u8DF3\u8F41\u8FEF\u9003\u9184\u92FE\u9676\u9780\u9789\u97B1\u97DC\u97EC\u98F8\u9940\u9955\u99E3\u9A0A\u9F17", "te": "\u5FD1\u5FD2\u615D\u7279\u7286\u8126\u87D8\u8CB8\u92F1\u94FD", "tei": "\u5FD2", "teng": "\u512F\u5E50\u6ED5\u6F1B\u71A5\u75BC\u75CB\u7C50\u7C58\u7E22\u817E\u81AF\u85E4\u8645\u87A3\u8A8A\u8B04\u9086\u972F\u99E6\u9A30\u9A63\u9C27\u9F1F", "ti": "\u4F53\u4FF6\u501C\u504D\u5082\u5243\u5254\u5397\u5551\u557C\u55C1\u568F\u5694\u5943\u5A82\u5A9E\u5C49\u5C5C\u5C5F\u5D39\u5F1F\u5FA5\u5FB2\u608C\u6090\u60D5\u60D6\u60FF\u623B\u632E\u63A6\u63D0\u63E5\u64FF\u66FF\u6711\u684B\u68AF\u68E3\u6B52\u6BA2\u6D95\u6E27\u6F3D\u73F6\u7445\u74CB\u7723\u777C\u78AE\u78C3\u7994\u79B5\u7A0A\u7B39\u7C4A\u7D88\u7DF9\u7EE8\u7F07\u7F64\u82D0\u8351\u855B\u8599\u88FC\u8905\u8906\u8B15\u8DA7\u8DAF\u8E22\u8E44\u8E4F\u8EB0\u8EC6\u9016\u9037\u9046\u918D\u92BB\u9357\u9511\u984C\u9898\u9A20\u9AB5\u9AD4\u9AF0\u9B00\u9B04\u9BB7\u9BF7\u9CC0\u9D5C\u9D97\u9D99\u9DC8\u9DC9\u9DE4\u9E48", "tian": "\u4F43\u500E\u5172\u5451\u553A\u5861\u586B\u5929\u5975\u5A56\u5C47\u5FDD\u606C\u60BF\u6375\u63AD\u6437\u666A\u6B84\u6CBA\u6DDF\u6DFB\u6E49\u7420\u7471\u74B3\u751B\u751C\u7530\u7538\u754B\u7551\u7560\u75F6\u76F7\u7753\u78B5\u78CC\u7AB4\u7D3E\u7DC2\u80CB\u8146\u8214\u821A\u83FE\u89A5\u89CD\u8CDF\u915F\u929B\u92BD\u932A\u94BF\u94E6\u95D0\u9617\u9754\u975D\u9902\u9D2B\u9DC6\u9DCF\u9EC7", "tiao": "\u4F7B\u5541\u5B25\u5BA8\u5CA7\u5CB9\u5EA3\u604C\u6311\u65A2\u65EB\u6640\u6713\u6737\u6761\u689D\u6A24\u773A\u7952\u7967\u7A95\u7AB1\u7B24\u7C9C\u7CF6\u7D69\u804E\u8101\u8280\u82D5\u8414\u84DA\u84E7\u84E8\u8729\u899C\u8A82\u8ABF\u8C03\u8D92\u8DF3\u8FE2\u929A\u92DA\u93A5\u94EB\u9797\u9AEB\u9BC8\u9C37\u9CA6\u9F60\u9F86", "tie": "\u50E3\u546B\u5E16\u6017\u8051\u841C\u86C8\u8CBC\u8D34\u8DD5\u9244\u9295\u9421\u9435\u94C1\u98FB\u992E\u9A56", "ting": "\u4EAD\u4FB1\u4FB9\u505C\u5385\u539B\u542C\u5722\u5A17\u5A77\u5D49\u5E81\u5E8D\u5EAD\u5EF0\u5EF3\u5EF7\u5FCA\u633A\u686F\u6883\u695F\u69B3\u6C40\u6D8F\u6E1F\u6FCE\u70C3\u70F4\u70F6\u73FD\u753A\u753C\u7B73\u7D8E\u8013\u8064\u8074\u807C\u807D\u8121\u8247\u839B\u8476\u8713\u874F\u8A94\u8AEA\u9092\u92CC\u94E4\u95AE\u9706\u9793\u9832\u988B\u9F2E", "tong": "\u4EDD\u4F5F\u4F97\u5045\u50EE\u52ED\u540C\u54C3\u55F5\u56F2\u578C\u5CC2\u5CD2\u5CDD\u5E9D\u5F64\u606B\u6078\u615F\u6185\u6345\u664D\u66C8\u6723\u6850\u6876\u6A0B\u6A66\u6C03\u6D1E\u6D75\u6F7C\u70B5\u70D4\u71D1\u729D\u72EA\u735E\u75CC\u75DB\u772E\u77B3\u783C\u7867\u79F1\u7A5C\u7AE5\u7B52\u7B69\u7CA1\u7D67\u7D71\u7D82\u7EDF\u81A7\u833C\u84EA\u8692\u8855\u8A77\u8D68\u901A\u916E\u9256\u9275\u9285\u94DC\u9907\u9BA6\u9C96", "tou": "\u4EA0\u5077\u5078\u57F1\u5934\u59B5\u5A7E\u5AAE\u6109\u6295\u6568\u65A2\u7D0F\u7DF0\u8623\u900F\u92C0\u936E\u94AD\u982D\u98F3\u9AB0\u9EC8", "tu": "\u514E\u5154\u51C3\u51F8\u5410\u550B\u555A\u56F3\u56FE\u5716\u5717\u571F\u5721\u580D\u5817\u5857\u58BF\u5B8A\u5C60\u5CF9\u5D5E\u5D80\u5EA9\u5EDC\u5F92\u6022\u6087\u6348\u6378\u63EC\u6455\u688C\u6AA1\u6C62\u6D82\u6D8B\u6E65\u6F73\u7479\u75DC\u760F\u79BF\u79C3\u7A0C\u7A81\u7B61\u816F\u837C\u83B5\u83DF\u8456\u84A4\u8D83\u8DFF\u8FCC\u9014\u9174\u91F7\u922F\u92C0\u92F5\u934E\u948D\u999F\u99FC\u9D4C\u9D5A\u9D75\u9D9F\u9DCB\u9DF5\u9F35", "tuan": "\u5278\u56E2\u56E3\u5715\u5718\u587C\u58A5\u5F56\u6171\u629F\u63E3\u6476\u69EB\u6AB2\u6E4D\u6E6A\u6F19\u7153\u732F\u757D\u7583\u7BFF\u7CF0\u8916\u8C92\u93C4\u9DD2\u9DFB", "tui": "\u4FBB\u4FC0\u50D3\u58A4\u5A27\u5C35\u5F1A\u5F1F\u5FD2\u63A8\u6A54\u717A\u7A68\u8049\u817F\u84F7\u85EC\u8608\u86FB\u8715\u892A\u8B89\u8E46\u8E6A\u9000\u96A4\u9839\u983A\u983D\u9893\u99FE\u9ABD\u9B4B", "tun": "\u541E\u5451\u554D\u564B\u56E4\u5749\u5C6F\u5E89\u5FF3\u619E\u65FD\u66BE\u671C\u6C3D\u6D92\u711E\u81C0\u81CB\u829A\u86CC\u892A\u8C58\u8C5A\u8ED8\u9715\u98E9\u9968\u9B68\u9C80\u9ED7", "tuo": "\u4E47\u4EDB\u4F57\u4F82\u4FBB\u5483\u549C\u553E\u5574\u572B\u5768\u5836\u59A5\u5AA0\u5AF7\u5CAE\u5D9E\u5EB9\u5F75\u6258\u6261\u62D3\u62D5\u62D6\u6329\u635D\u64B1\u6754\u67C1\u67DD\u692D\u6955\u69D6\u6A50\u6A62\u6BE4\u6BFB\u6C51\u6CB0\u6CB1\u6CB2\u6DB6\u72CF\u7823\u7824\u78A2\u7BA8\u7C5C\u7D3D\u812B\u8131\u838C\u841A\u8600\u8889\u88A5\u8A17\u8A51\u8BAC\u8DC5\u8DCE\u9161\u9248\u92D6\u94CA\u9624\u9640\u9641\u98E5\u9966\u99B1\u99B2\u99C4\u99DD\u99DE\u9A28\u9A52\u9A5D\u9A6E\u9A7C\u9B0C\u9B60\u9B80\u9BB5\u9C16\u9D15\u9D4E\u9E35\u9F09\u9F0D\u9F27", "wa": "\u4F64\u51F9\u52B8\u5493\u54C7\u5532\u5558\u55D7\u55E2\u576C\u5A03\u5A32\u5A60\u5AA7\u5C72\u5E13\u5F8D\u6316\u6432\u6528\u6D3C\u6E9B\u6F25\u74E6\u74FE\u7556\u7819\u7A75\u7A8A\u7A90\u7AAA\u8049\u817D\u8183\u86D9\u889C\u896A\u90B7\u97C8\u97CE\u97E4\u9BAD\u9F03", "wai": "\u54BC\u558E\u5916\u5D34\u6B6A\u7024\u7AF5\u9861", "wan": "\u4E07\u4E38\u5007\u5213\u525C\u534D\u5350\u550D\u57E6\u5846\u58EA\u5917\u5918\u59A7\u5A49\u5A60\u5B8C\u5B9B\u5C8F\u5E35\u5F2F\u5F4E\u5FE8\u60CB\u60CC\u628F\u633D\u6356\u6365\u6394\u665A\u6665\u6669\u667C\u6764\u676C\u689A\u6900\u69FE\u6BCC\u6C4D\u6DB4\u6E7E\u6F6B\u6FAB\u7063\u70F7\u73A9\u7413\u742C\u7579\u7696\u76CC\u7755\u77A3\u7897\u7B02\u7BA2\u7D08\u7D7B\u7D84\u7DA9\u7DB0\u7EA8\u7EFE\u7FEB\u8115\u8118\u8155\u8284\u839E\u83AC\u83C0\u8416\u842C\u8513\u858D\u8696\u873F\u87C3\u8C4C\u8CA6\u8D03\u8D0E\u8E20\u8F10\u8F13\u92C4\u92D4\u92FA\u933D\u93AB\u9811\u987D", "wang": "\u4EA1\u4EBE\u4EFC\u5166\u5984\u5C22\u5C23\u5C29\u5C2A\u5C2B\u5F7A\u5F80\u5F83\u5F8D\u5FD8\u5FF9\u60D8\u6282\u65FA\u6680\u671A\u671B\u6722\u6789\u68E2\u6C6A\u7007\u738B\u76F3\u7DB2\u7F51\u7F52\u7F53\u7F54\u7F56\u83A3\u83F5\u869F\u86E7\u8744\u8AB7\u8F1E\u8F8B\u8FCB\u8FEC\u9B4D", "wei": "\u4E3A\u4EB9\u4F1F\u4F2A\u4F4D\u502D\u5049\u504E\u507D\u50DE\u5130\u536B\u5371\u5383\u53DE\u5473\u5529\u552F\u5582\u55A1\u55B4\u56D7\u56F2\u56F4\u570D\u5729\u589B\u58DD\u59D4\u5A01\u5A13\u5A81\u5A99\u5AA6\u5BEA\u5C09\u5C3E\u5C57\u5CD7\u5CDE\u5D23\u5D34\u5D54\u5D6C\u5D89\u5DB6\u5DCD\u5E0F\u5E37\u5E43\u5EC6\u5FAB\u5FAE\u60DF\u6104\u6107\u6170\u61C0\u6364\u637C\u63CB\u63FB\u649D\u64B1\u6596\u6690\u672A\u6845\u68B6\u6932\u6933\u6972\u6B08\u6CA9\u6D08\u6D27\u6D58\u6DA0\u6E28\u6E2D\u6E4B\u6E88\u6EA6\u6F4D\u6F59\u6F7F\u6FF0\u6FFB\u7022\u709C\u70BA\u70D3\u7152\u715F\u7168\u71AD\u71F0\u7232\u729A\u72A9\u731A\u7325\u732C\u73AE\u741F\u744B\u74D7\u754F\u75CF\u75FF\u7650\u7653\u7786\u77C0\u7859\u78A8\u78C8\u78D1\u7DAD\u7DED\u7DEF\u7E05\u7EAC\u7EF4\u7F7B\u80C3\u8172\u8249\u829B\u82C7\u82FF\u8371\u83CB\u840E\u8466\u8468\u8473\u848D\u84F6\u851A\u853F\u8587\u85B3\u85EF\u8636\u8732\u873C\u875B\u875F\u87B1\u885B\u885E\u893D\u89A3\u89B9\u8A74\u8AC9\u8B02\u8B86\u8B8F\u8BFF\u8C13\u8E13\u8E97\u8E9B\u8ECE\u8F4A\u8FDD\u9036\u9055\u9057\u912C\u9180\u934F\u9361\u93CF\u95C8\u95F1\u9687\u9688\u9697\u96B9\u9728\u973A\u97CB\u97D1\u97D9\u97E1\u97E6\u97EA\u9820\u98B9\u9927\u9935\u9956\u9AA9\u9AAA\u9AAB\u9B4F\u9B87\u9BA0\u9BAA\u9C03\u9C04\u9C94\u9CC2\u9CDA", "wen": "\u4F06\u520E\u543B\u5445\u5461\u554F\u586D\u598F\u5F63\u5FDE\u5FDF\u6286\u63FE\u6435\u6587\u6637\u687D\u6985\u69B2\u6B7E\u6B9F\u6C76\u6E02\u6E29\u6EAB\u7086\u739F\u73F3\u7465\u74BA\u7612\u761F\u7A33\u7A4F\u7A69\u7D0A\u7D0B\u7D7B\u7DFC\u7E15\u7E67\u7EB9\u7F0A\u805E\u80B3\u8117\u82A0\u83AC\u8570\u8689\u868A\u87A1\u87C1\u8C71\u8F3C\u8F40\u8F92\u93BE\u95BA\u95BF\u95C5\u95E6\u95EE\u95FB\u960C\u96EF\u97B0\u97EB\u9850\u9942\u99BC\u99C7\u9B70\u9C1B\u9C2E\u9CC1\u9CFC\u9D0D\u9F24", "weng": "\u52DC\u55E1\u5855\u5963\u5D61\u651A\u66A1\u6EC3\u74EE\u7515\u7788\u7F4B\u7FC1\u806C\u84CA\u8579\u8789\u9393\u9DB2\u9E5F\u9F46", "wo": "\u4EF4\u502D\u5053\u5367\u54BC\u5529\u5594\u5A50\u5A51\u5A89\u5E44\u6211\u631D\u6370\u637E\u63E1\u64BE\u65A1\u6782\u6943\u6C83\u6DA1\u6DB4\u6DB9\u6E25\u6E26\u6FC4\u6FE3\u7125\u7327\u74C1\u7783\u786A\u7A9D\u7AA9\u7DFA\u809F\u815B\u81D2\u81E5\u83B4\u8435\u85B6\u8717\u8778\u8E12\u99A7\u9F77\u9F8C\u9F8F", "wu": "\u4E44\u4E4C\u4E94\u4EA1\u4EF5\u4F0D\u4FAE\u4FC9\u5035\u50EB\u511B\u5140\u526D\u52A1\u52D9\u52FF\u5348\u537C\u5433\u5434\u543E\u5449\u545C\u5514\u554E\u55DA\u572C\u575E\u5825\u5862\u58B2\u5966\u59A9\u5A12\u5A2A\u5A2C\u5A7A\u5AF5\u5BE4\u5C4B\u5C7C\u5C89\u5CFF\u5D4D\u5D68\u5DEB\u5E91\u5EE1\u5F19\u5FE2\u5FE4\u6003\u6076\u609E\u609F\u60AE\u60E1\u61AE\u620A\u625C\u625D\u6264\u6342\u6440\u6544\u65BC\u65E0\u65FF\u6664\u6745\u6747\u674C\u67EE\u68A7\u6A46\u6B4D\u6B66\u6BCB\u6C59\u6C5A\u6C61\u6C95\u6D16\u6D3F\u6D6F\u6E1E\u6EA9\u6F55\u70CF\u7110\u7121\u7183\u7193\u7269\u727E\u739D\u73F7\u73F8\u7466\u7491\u7512\u75E6\u77B4\u77F9\u7894\u7966\u7A8F\u7AB9\u7BBC\u7C85\u81B4\u821E\u829C\u82B4\u8323\u8381\u856A\u8601\u8708\u8790\u87F1\u8A88\u8AA3\u8AA4\u8B55\u8BEC\u8BEF\u8DB6\u8E8C\u8FD5\u901C\u90AC\u90DA\u9114\u91EB\u92C8\u92D8\u92D9\u93A2\u94A8\u94FB\u9622\u965A\u9696\u96FA\u96FE\u971A\u9727\u9770\u9A16\u9A9B\u9BC3\u9C1E\u9D2E\u9D50\u9D61\u9DA9\u9DE1\u9E40\u9E49\u9E5C\u9F2F\u9F3F\u9F40", "xi": "\u4E60\u4FC2\u4FD9\u5092\u50D6\u516E\u51DE\u5338\u534C\u5365\u5380\u5438\u546C\u54A5\u54AD\u550F\u553D\u559C\u55BA\u563B\u564F\u56B1\u56CD\u588D\u58D0\u5915\u595A\u5A2D\u5AB3\u5B06\u5B09\u5C43\u5C53\u5C56\u5C63\u5C6D\u5D60\u5D8D\u5DB2\u5DC2\u5DC7\u5E0C\u5E2D\u5F86\u5F99\u5FAF\u5FDA\u5FE5\u5FFE\u602C\u6038\u6044\u6053\u606F\u6089\u6095\u60C1\u60DC\u613E\u6140\u6198\u6199\u620F\u622F\u6231\u6232\u6262\u6271\u6278\u6461\u6614\u665E\u6670\u6673\u66BF\u66E6\u676B\u6790\u67B2\u6816\u6878\u691E\u693A\u69BD\u69E2\u6A28\u6A40\u6A72\u6A84\u6B2A\u6B2F\u6B37\u6B56\u6B59\u6C25\u6C50\u6D12\u6D17\u6D60\u6DC5\u6E13\u6EAA\u6ECA\u6F07\u6F1D\u6F5D\u6F5F\u6F99\u70EF\u7101\u7108\u711F\u712C\u7155\u7182\u7184\u7188\u7199\u71B9\u71BA\u71BB\u71E8\u7214\u727A\u7280\u7294\u72A0\u72A7\u72F6\u7361\u73BA\u740B\u74BD\u74D5\u761C\u7699\u76FB\u774E\u77A6\u77D6\u77FD\u7852\u788F\u78CE\u78F6\u7902\u798A\u79A7\u7A00\u7A27\u7A78\u7AB8\u7C9E\u7CE6\u7CFB\u7D30\u7D8C\u7DC6\u7E18\u7E30\u7E65\u7E6B\u7E9A\u7EC6\u7EE4\u7F9B\u7FB2\u7FD2\u7FD5\u7FD6\u80B8\u80B9\u814A\u819D\u8203\u8204\u823E\u831C\u8383\u83E5\u8448\u8478\u84A0\u84B5\u84C6\u84F0\u856E\u8582\u8669\u8725\u8785\u8787\u87CB\u87E2\u8835\u884B\u88AD\u88FC\u8972\u897F\u89A1\u89A4\u89CB\u89F9\u89FD\u89FF\u8A92\u8AF0\u8B11\u8B35\u8B46\u8BF6\u8C3F\u8C40\u8C68\u8C6F\u8C95\u8D65\u8D69\u8D87\u8D98\u8E4A\u8E5D\u8EA7\u909C\u90C4\u90CB\u90D7\u90E4\u910E\u9145\u91AF\u91D0\u91F3\u91F8\u9222\u9268\u9269\u9291\u932B\u93B4\u93ED\u940A\u9474\u9491\u94E3\u9521\u95AA\u95DF\u960B\u9699\u969F\u96B0\u96B5\u96DF\u96ED\u972B\u973C\u98C1\u990F\u993C\u994E\u9969\u997B\u9A31\u9A3D\u9A68\u9B29\u9BD1\u9C3C\u9C5A\u9CC3\u9CDB\u9D57\u9E02\u9ED6\u9F37", "xia": "\u4E05\u4E0B\u4E64\u4FA0\u4FE0\u5084\u5323\u53A6\u53DA\u5413\u5477\u552C\u5687\u5737\u57C9\u590F\u5913\u5939\u593E\u5CE1\u5CFD\u5EC8\u5FA6\u61D7\u637E\u656E\u6687\u67D9\u68BA\u70A0\u70DA\u7146\u72CE\u72ED\u72F9\u73E8\u7455\u759C\u75A8\u7615\u7771\u778E\u7856\u7864\u78AC\u78CD\u796B\u7B1A\u7B6A\u7E16\u7F45\u7FC8\u821D\u823A\u8290\u8578\u8672\u867E\u8766\u879B\u8AD5\u8C3A\u8D6E\u8F44\u8F96\u9050\u935C\u938B\u93BC\u93EC\u9595\u959C\u965C\u967F\u971E\u98AC\u9A22\u9B7B\u9C15\u9DB7\u9EE0", "xian": "\u4ED9\u4EDA\u4F2D\u4F61\u50CA\u50E9\u50F2\u50F4\u5148\u51BC\u53BF\u5481\u549E\u54B8\u54EF\u550C\u5563\u55DB\u5615\u57B7\u57F3\u586A\u58CF\u597E\u59B6\u59ED\u59FA\u5A0A\u5A34\u5A39\u5A71\u5ACC\u5AFA\u5AFB\u5B10\u5B45\u5BAA\u5C1F\u5C20\u5C73\u5C98\u5CF4\u5D04\u5DAE\u5E70\u5EEF\u5F26\u5F61\u5FFA\u61AA\u61B2\u61B8\u61E2\u6326\u6380\u63BA\u641A\u641F\u648A\u648F\u6507\u6515\u663E\u665B\u66B9\u6774\u67AE\u69CF\u6A4C\u6A7A\u6AF6\u6B26\u6BE8\u6C19\u6D17\u6D80\u6D8E\u6E7A\u6E93\u6F96\u7017\u7066\u70CD\u71F9\u72DD\u7303\u732E\u736B\u736E\u737B\u7381\u73B0\u73B9\u73D7\u73FE\u7509\u75EB\u7647\u764E\u76F7\u770C\u774D\u77AF\u7925\u7946\u7992\u79C8\u7A34\u7B45\u7BB2\u7C7C\u7CAF\u7CEE\u7D43\u7D64\u7D85\u7D96\u7DAB\u7DDA\u7E23\u7E4A\u7E8E\u7E96\u7EA4\u7EBF\u7F10\u7FA1\u7FA8\u7FAC\u80D8\u817A\u81D4\u81E4\u81FD\u8237\u82CB\u82EE\u83A7\u83B6\u859F\u85D3\u85D6\u861A\u86AC\u86BF\u86DD\u8706\u8854\u8858\u893C\u8973\u898B\u89C1\u8AA2\u8AB8\u8AF4\u8B63\u8C4F\u8CE2\u8D12\u8D24\u8D7B\u8DE3\u8DF9\u8E6E\u8E9A\u8ED0\u8F31\u9170\u918E\u91B6\u9291\u929B\u929C\u92BD\u92E7\u930E\u9341\u934C\u93FE\u9466\u94E3\u94E6\u9528\u952C\u9591\u9592\u95F2\u9650\u9665\u9669\u9677\u967A\u96AA\u9730\u97C5\u97EF\u97F1\u9855\u986F\u9921\u9985\u99A6\u9BAE\u9C7B\u9C9C\u9DB1\u9DF3\u9DF4\u9DFC\u9E47\u9E79\u9E99\u9EB2\u9F38", "xiang": "\u4E61\u4EAB\u4EAF\u4F6D\u50CF\u5134\u52E8\u52F7\u53A2\u5411\u54CD\u554D\u56AE\u5905\u59E0\u5D91\u5DF7\u5EA0\u5EC2\u5FC0\u60F3\u6651\u66CF\u6819\u697F\u6A61\u6B00\u6E58\u6F52\u73E6\u74D6\u74E8\u76F8\u7965\u7A25\u7BB1\u7D74\u7DD7\u7E95\u7F03\u7F3F\u7F8A\u7F8F\u7FD4\u81B7\u8297\u842B\u8459\u858C\u8683\u87D3\u8801\u8856\u8944\u8950\u8A73\u8BE6\u8C61\u8DED\u90F7\u9109\u910A\u9115\u9284\u9297\u940C\u9472\u9576\u95A7\u95C2\u964D\u97FF\u9805\u9879\u98E8\u9909\u9957\u995F\u9977\u9999\u9A64\u9AA7\u9B9D\u9BD7\u9C4C\u9C5C\u9C76\u9C9E\u9E98", "xiao": "\u4FBE\u4FCF\u4FF2\u509A\u524A\u52B9\u547A\u54B2\u54D3\u54EE\u5578\u55C3\u560B\u5610\u5628\u562F\u5635\u56A3\u56BB\u56C2\u59E3\u5A4B\u5B5D\u5BAF\u5BB5\u5C0F\u5D24\u5EA8\u5F47\u6054\u61A2\u63F1\u64A8\u6548\u6569\u6585\u6586\u6653\u6681\u66C9\u67AD\u67B5\u6821\u689F\u6AF9\u6B4A\u6B57\u6BBD\u6BCA\u6D28\u6D88\u6D8D\u6DC6\u6EE7\u6F47\u701F\u7071\u7072\u70CB\u7107\u7187\u71BD\u7307\u735F\u7362\u75DA\u75DF\u769B\u76A2\u7744\u785D\u7863\u7A58\u7A99\u7B11\u7B71\u7B7F\u7BAB\u7BBE\u7BE0\u7C18\u7C2B\u7D83\u7EE1\u7FDB\u8096\u81AE\u83A6\u8427\u856D\u8582\u85C3\u8648\u8653\u86F8\u87C2\u87CF\u87F0\u8828\u8A24\u8A68\u8A9F\u8AB5\u8B0F\u8E03\u900D\u90E9\u92B7\u9500\u9704\u98B5\u9A4D\u9A81\u9AB9\u9AC7\u9AD0\u9B48\u9D1E\u9D35\u9DCD\u9E2E", "xie": "\u4E9B\u4EB5\u4F33\u5055\u505E\u5070\u50C1\u5136\u5199\u51A9\u52A6\u52F0\u534F\u5354\u5368\u5378\u53F6\u55CB\u5667\u56A1\u57A5\u586E\u5911\u594A\u5951\u5A0E\u5A9F\u5B48\u5BEB\u5C51\u5C5F\u5C67\u5CEB\u5DB0\u5EE8\u5FA2\u604A\u6136\u6140\u61C8\u62F9\u631F\u633E\u63F3\u641A\u643A\u64B7\u64D5\u64F7\u651C\u659C\u65EA\u66AC\u67BB\u6827\u688B\u68B0\u6954\u698D\u699D\u69AD\u6A27\u6B47\u6CC4\u6CFB\u6D29\u6E2B\u6ECA\u6FA5\u7009\u7023\u707A\u70A7\u70A8\u70F2\u710E\u7181\u71EE\u71F2\u7215\u7332\u7366\u736C\u744E\u78BF\u7944\u79BC\u7CCF\u7D32\u7D4F\u7D5C\u7D6C\u7D8A\u7DE4\u7DF3\u7E00\u7E72\u7E88\u7EC1\u7F2C\u7F37\u7FD3\u80C1\u8105\u8107\u810B\u818E\u85A2\u85A4\u85DB\u874E\u8762\u87F9\u880D\u880F\u8840\u887A\u8909\u893B\u896D\u89DF\u89E3\u89E7\u8AE7\u8B1D\u8B97\u8C10\u8C22\u8E9E\u8EA0\u9082\u90AA\u977E\u978B\u97A2\u97B5\u97D8\u97F0\u9889\u9BAD\u9C91\u9F42\u9F58\u9F5B\u9F65\u9FA4", "xin": "\u4F08\u4F29\u4FE1\u4FFD\u5677\u567A\u56DF\u59A1\u5B1C\u5B5E\u5EDE\u5FC3\u5FC4\u5FFB\u60DE\u6116\u65B0\u6615\u677A\u6794\u6B23\u6B46\u7098\u712E\u76FA\u7925\u812A\u820B\u82AF\u8398\u85AA\u8845\u8951\u8A22\u8A2B\u8ED0\u8F9B\u90A4\u91C1\u920A\u92C5\u9414\u946B\u950C\u9561\u9620\u9856\u99A8\u99AB\u99B8\u9B35", "xing": "\u4F80\u5016\u5174\u5211\u54D8\u578B\u57B6\u59D3\u5A19\u5A5E\u5B39\u5DE0\u5E78\u5F62\u6027\u60BB\u60FA\u64E4\u661F\u66D0\u674F\u6D10\u6DAC\u6ECE\u714B\u72CC\u7329\u7446\u76A8\u7701\u7772\u784E\u7BB5\u7BC2\u7DC8\u8165\u81D6\u8208\u8347\u8365\u8395\u8455\u86F5\u884C\u89EA\u89F2\u8B03\u90A2\u90C9\u9192\u9203\u9276\u9292\u92DE\u9498\u94CF\u9649\u9658\u9933\u9967\u9A02\u9A8D\u9B8F\u9BF9", "xiong": "\u5144\u5147\u51F6\u5302\u5308\u54C5\u5910\u5FF7\u605F\u657B\u6C79\u6D36\u7138\u713D\u718A\u718B\u80F7\u80F8\u828E\u8A29\u8A57\u8A7E\u8BBB\u8BC7\u8CEF\u96C4", "xiu": "\u4F11\u4FE2\u4FEE\u54BB\u55C5\u568A\u5BBF\u5CAB\u5CC0\u5EA5\u673D\u6A07\u6EB4\u6EEB\u6F43\u70CC\u73DB\u7407\u7493\u79C0\u7CD4\u7D89\u7E4D\u7E61\u7EE3\u7F9E\u8119\u8129\u81ED\u81F9\u82EC\u8791\u8896\u890E\u890F\u8C85\u929D\u92B9\u9380\u93C5\u93E5\u93FD\u9508\u98CD\u9948\u9990\u9AE4\u9AF9\u9BB4\u9C43\u9D42\u9E3A\u9F45", "xu": "\u4F11\u4F35\u4F90\u4FC6\u5066\u5194\u52D6\u52D7\u5379\u53D9\u5401\u5474\u5590\u55A3\u5618\u563C\u5653\u5729\u57BF\u589F\u58FB\u59B6\u59C1\u5A7F\u5AAD\u5B03\u5E8F\u5F90\u6034\u6053\u6064\u60D0\u6149\u620C\u639D\u63DF\u654D\u6558\u65ED\u65F4\u662B\u6647\u668A\u6702\u6710\u6829\u6948\u69D2\u6B28\u6B30\u6B3B\u6B54\u6B58\u6B88\u6C7F\u6C80\u6D2B\u6D52\u6DE2\u6E4F\u6E51\u6E86\u6EC0\u6EF8\u6F35\u6F4A\u70C5\u70FC\u7166\u71F8\u735D\u73DD\u73EC\u755C\u759E\u76E2\u76E8\u76F1\u7717\u7781\u77DE\u7809\u7991\u7A30\u7A38\u7CC8\u7D6E\u7D87\u7D9A\u7DD2\u7DD6\u7DF0\u7E03\u7E7B\u7E8C\u7EEA\u7EED\u8053\u805F\u80E5\u82A7\u84A3\u84C4\u84F2\u84FF\u8566\u85C7\u85DA\u8657\u865A\u865B\u86BC\u86E1\u8751\u88C7\u8A0F\u8A31\u8A39\u8A61\u8ADD\u8AFF\u8B43\u8BB8\u8BE9\u8C1E\u8CC9\u90AA\u9126\u9157\u9191\u928A\u9450\u9700\u9808\u980A\u987B\u987C\u9A49\u9B1A\u9B46\u9B56\u9C6E", "xuan": "\u4F2D\u5107\u5238\u53BF\u5405\u54BA\u559B\u55A7\u5847\u5910\u59B6\u5A97\u5AD9\u5B1B\u5BA3\u5F32\u6030\u60AC\u6103\u610B\u61C1\u61F8\u63CE\u657B\u65CB\u660D\u6621\u6645\u6684\u66B6\u688B\u6965\u6966\u6A88\u6CEB\u6E32\u6F29\u70AB\u70DC\u714A\u7156\u7384\u73B9\u7401\u7404\u7444\u7487\u74BF\u75C3\u7663\u766C\u7729\u7734\u777B\u77CE\u78B9\u79A4\u7BAE\u7D62\u7E23\u7E3C\u7E4F\u7EDA\u7FE7\u7FFE\u8431\u8432\u84D2\u8519\u857F\u85FC\u8610\u8701\u8756\u8809\u8852\u88A8\u8AE0\u8AFC\u8B5E\u8B82\u8C16\u8D19\u8ED2\u8F69\u9009\u9078\u9249\u92D7\u9379\u93C7\u94C9\u955F\u9799\u98B4\u99E8\u99FD\u9C1A", "xue": "\u4E74\u524A\u5437\u5671\u5779\u58C6\u5B66\u5B78\u5CA4\u5CC3\u5DA8\u5F50\u6034\u6569\u6588\u6856\u6A30\u6CEC\u6CF6\u6EC8\u6FA9\u7025\u71E2\u72D8\u75A6\u75B6\u77B2\u7A74\u81A4\u825D\u8313\u8486\u859B\u8840\u8895\u89F7\u8B14\u8C11\u8D90\u8E05\u8F4C\u8FA5\u8FAA\u96EA\u9774\u97BE\u9C48\u9CD5\u9DFD\u9E34", "xun": "\u4F28\u4F9A\u5071\u52CB\u52DB\u52F2\u52F3\u5342\u54B0\u5640\u565A\u5691\u5743\u57D9\u5864\u58CE\u58E6\u595E\u59F0\u5B59\u5B6B\u5BFB\u5C0B\u5CCB\u5DE1\u5DFA\u5DFD\u5EF5\u5F87\u5FAA\u6042\u613B\u63D7\u6533\u65EC\u66DB\u674A\u6812\u686A\u6A33\u6B89\u6BBE\u6BE5\u6C5B\u6D35\u6D54\u6D5A\u6F60\u6F6F\u6FEC\u7065\u7104\u7147\u718F\u71C5\u71D6\u71FB\u720B\u7213\u72E5\u736F\u73E3\u7495\u7543\u7734\u77C4\u7A04\u7AA8\u7D03\u7E81\u81D0\u8340\u8368\u8541\u8548\u85AB\u85B0\u860D\u87EB\u87F3\u8A0A\u8A13\u8A19\u8A62\u8BAD\u8BAF\u8BE2\u8FC5\u8FFF\u900A\u905C\u90C7\u9129\u91BA\u9442\u9868\u99B4\u99E8\u9A6F\u9C4F\u9C58\u9C9F\u9DBD", "ya": "\u4E2B\u4E9A\u4E9C\u4E9E\u4F22\u4FF9\u51B4\u529C\u538A\u538B\u5391\u5393\u5416\u5440\u54D1\u5516\u555E\u5714\u5720\u5727\u57AD\u57E1\u5810\u58D3\u59F6\u5A05\u5A6D\u5B72\u5C88\u5D15\u5D16\u5E8C\u5E98\u62BC\u62C1\u631C\u6397\u63E0\u6792\u6860\u690F\u693B\u6C29\u6C2C\u6DAF\u6F04\u7259\u72BD\u731A\u7330\u73A1\u740A\u74DB\u758B\u75A8\u75D6\u7602\u775A\u7811\u78A3\u78CD\u7A0F\u7AAB\u7B0C\u8050\u82BD\u8565\u869C\u8859\u897E\u8980\u8A1D\u8BB6\u8ECB\u8F67\u8FD3\u90AA\u91FE\u930F\u941A\u94D4\u96C5\u9D09\u9D28\u9D76\u9E26\u9E2D\u9F56\u9F7E", "yan": "\u4E25\u4E75\u4FE8\u5043\u5050\u50BF\u513C\u5156\u5157\u5261\u5266\u533D\u5383\u538C\u53A3\u53AD\u53B3\u53B4\u54BD\u5501\u550C\u5571\u55A6\u55AD\u565E\u5688\u56A5\u56B4\u56D0\u57CF\u5830\u5869\u5895\u58DB\u58E7\u5935\u5944\u598D\u599F\u59F2\u59F8\u5A2B\u5A2E\u5AE3\u5B0A\u5B10\u5B2E\u5B3F\u5B4D\u5BB4\u5CA9\u5D26\u5D43\u5D52\u5D53\u5D96\u5DCC\u5DD6\u5DD7\u5DD8\u5DDA\u5EF6\u5F07\u5F65\u5F66\u6079\u611D\u61D5\u61E8\u622D\u624A\u6281\u639E\u63A9\u63C5\u63DC\u6565\u6616\u664F\u667B\u66A5\u66D5\u66E3\u66EE\u68B4\u68EA\u693B\u693C\u694C\u6A2E\u6A6A\u6A90\u6ABF\u6AE9\u6B15\u6B45\u6B97\u6BB7\u6C87\u6CBF\u6D1D\u6DCA\u6DF9\u6E30\u6E37\u6E6E\u6E8E\u6EDF\u6F14\u6F39\u704E\u7054\u7067\u7069\u708E\u708F\u70DF\u70FB\u7109\u7111\u7114\u7130\u7131\u7159\u7196\u71C4\u71D5\u7213\u726A\u72FF\u730F\u7312\u73DA\u7402\u7430\u7517\u76D0\u773C\u7814\u781A\u784F\u786F\u787D\u789E\u7939\u7AB4\u7B75\u7BF6\u7C37\u7D96\u7E2F\u7F68\u7FAC\u80ED\u814C\u81D9\u8273\u8276\u8277\u82AB\u839A\u83F8\u8412\u8505\u8664\u8712\u8758\u884D\u88FA\u8917\u898E\u89C3\u89FE\u8A00\u8A01\u8A2E\u8A7D\u8AFA\u8B8C\u8B9E\u8BA0\u8C1A\u8C33\u8C53\u8C54\u8C63\u8D0B\u8D17\u8D5D\u8EBD\u8EC5\u9043\u90D4\u90FE\u9122\u9140\u9153\u917D\u9183\u91B6\u91BC\u91C5\u94C5\u9586\u95B9\u95BB\u95BC\u95EB\u9609\u960E\u960F\u963D\u9681\u9692\u96C1\u984F\u9854\u9869\u989C\u990D\u995C\u9A10\u9A13\u9A34\u9A57\u9A60\u9A8C\u9B33\u9B47\u9B58\u9C0B\u9CEB\u9CF1\u9D08\u9D33\u9DA0\u9DC3\u9DF0\u9E7D\u9EA3\u9EE1\u9EE4\u9EEB\u9EEC\u9EED\u9EF0\u9EF6\u9F34\u9F39\u9F5E\u9F74\u9F82\u9F91", "yang": "\u4EF0\u4F52\u4F6F\u509F\u517B\u52B7\u52DC\u536C\u5489\u5771\u579F\u592E\u59CE\u5A78\u5C9F\u5D35\u5D38\u5F89\u600F\u6059\u6113\u6143\u61E9\u626C\u62B0\u63DA\u6501\u656D\u65F8\u661C\u6698\u6768\u67CD\u6837\u694A\u6967\u69D8\u6A23\u6B83\u6C1C\u6C27\u6C31\u6CF1\u6D0B\u6F3E\u7001\u7080\u70B4\u70CA\u716C\u739A\u73DC\u7452\u75A1\u75D2\u760D\u7662\u770F\u773B\u7922\u7993\u79E7\u7D3B\u7F8A\u7F8F\u7F95\u80E6\u86D8\u8746\u8A47\u8AF9\u8BE6\u8EEE\u8F30\u9260\u9348\u935A\u9496\u9626\u9633\u967D\u96F5\u9737\u9785\u98BA\u98CF\u98EC\u990A\u99DA\u9C11\u9D26\u9D39\u9E09\u9E2F", "yao": "\u4E48\u4E50\u4EF8\u4FA5\u5004\u5060\u509C\u50E5\u530B\u5406\u54AC\u5593\u55C2\u579A\u582F\u592D\u5996\u59DA\u5A79\u5AB1\u5B8E\u5C27\u5C2D\u5C86\u5CE3\u5D3E\u5DA2\u5DA4\u5E7A\u5FAD\u5FBA\u602E\u604C\u612E\u62AD\u63FA\u6416\u6447\u647F\u64BD\u669A\u66DC\u6773\u6796\u67FC\u6946\u699A\u69A3\u6A02\u6B80\u6BBD\u6E94\u6EE7\u70C4\u70D1\u718E\u71FF\u723B\u72D5\u733A\u735F\u73E7\u7464\u7476\u759F\u7627\u7690\u7711\u77C5\u78D8\u7945\u7A7E\u7A85\u7A88\u7A91\u7A94\u7A95\u7AAF\u7AB0\u7B44\u7BB9\u7D04\u7E47\u7E85\u7EA6\u8000\u80B4\u8170\u8200\u825E\u82ED\u836F\u846F\u847D\u84D4\u85AC\u85E5\u8628\u888E\u8981\u899E\u8A1E\u8A4F\u8B20\u8B21\u8B91\u8C23\u8EFA\u8F7A\u9059\u9065\u9080\u908E\u929A\u9390\u94A5\u94EB\u95C4\u9676\u9683\u977F\u9864\u98BB\u98D6\u9906\u991A\u9A15\u9C29\u9C59\u9CD0\u9D01\u9D22\u9DC2\u9DD5\u9E5E\u9F3C\u9F69", "ye": "\u4E1A\u4E5F\u4EAA\u4EB1\u503B\u50F7\u51B6\u53F6\u5414\u54BD\u559D\u5622\u564E\u57DC\u5828\u58B7\u58C4\u591C\u5C04\u5CEB\u5DAA\u5DAB\u62B4\u62FD\u6353\u6359\u6396\u63F2\u63F6\u64DB\u64E8\u64EA\u64EB\u6654\u668D\u66C4\u66C5\u66D7\u66F3\u66F5\u67BC\u67BD\u6930\u696A\u696D\u6B4B\u6B97\u6D02\u6DB2\u6F1C\u6F71\u6FB2\u70E8\u7106\u7160\u71C1\u7217\u7237\u723A\u7458\u748D\u74DB\u75F7\u76A3\u77B1\u77B8\u790F\u7AAB\u7DE4\u8036\u814B\u8449\u882E\u8B01\u8C12\u90AA\u90BA\u9134\u91CE\u91FE\u92E3\u9371\u9381\u9391\u9437\u94D8\u9765\u9768\u9801\u9875\u9923\u9941\u998C\u9A5C\u9D7A\u9E08", "yi": "\u4E00\u4E41\u4E42\u4E49\u4E4A\u4E59\u4E5A\u4E5B\u4E84\u4EA6\u4EBF\u4EE1\u4EE5\u4EEA\u4F07\u4F0A\u4F3F\u4F41\u4F5A\u4F7E\u4F87\u4F9D\u4FCB\u501A\u506F\u5100\u5104\u5117\u517F\u519D\u5208\u5293\u52AE\u52DA\u52E9\u5307\u531C\u533B\u53C6\u53D5\u541A\u5453\u546D\u5479\u54A6\u54BF\u5508\u55CC\u566B\u56C8\u571B\u572F\u5744\u57BC\u57F6\u57F8\u58BF\u58F1\u58F9\u5901\u5937\u5955\u59B7\u59E8\u5A90\u5AD5\u5ADB\u5B04\u5B11\u5B1F\u5B90\u5B9C\u5BA7\u5BF1\u5BF2\u5C04\u5C3E\u5C79\u5CC4\u5CD3\u5D3A\u5DA7\u5DAC\u5DB7\u5DF2\u5DF8\u5E1F\u5E20\u5E46\u5EA1\u5ED9\u5F02\u5F08\u5F0B\u5F0C\u5F2C\u5F5B\u5F5C\u5F5D\u5F5E\u5F75\u5F79\u5FC6\u5FD4\u6008\u6021\u603F\u605E\u6092\u6098\u60A5\u610F\u61B6\u61CC\u61DD\u61FF\u6245\u6246\u6261\u6291\u62F8\u6339\u639C\u63D6\u648E\u6532\u653A\u6561\u6567\u657C\u6581\u65D1\u65D6\u6613\u6633\u6679\u6686\u66C0\u66CE\u6759\u675D\u678D\u67BB\u67C2\u6818\u6827\u683A\u684B\u68ED\u6905\u692C\u6938\u698F\u69F8\u6A8D\u6AA5\u6AB9\u6B25\u6B2D\u6B39\u6B5D\u6B94\u6BAA\u6BB9\u6BC5\u6BC9\u6C82\u6CB6\u6CC4\u6CC6\u6D1F\u6D22\u6D42\u6D65\u6D73\u6E0F\u6E59\u6EA2\u6F2A\u6F69\u6FBA\u7037\u7088\u712C\u7132\u7155\u71A0\u71A4\u71AA\u71BC\u71DA\u71E1\u71F1\u72CB\u72CF\u7317\u7348\u73B4\u73C6\u747F\u74F5\u7569\u7570\u7591\u7599\u75AB\u75CD\u75EC\u7617\u761E\u7631\u7654\u76CA\u7719\u776A\u7796\u77E3\u7912\u794E\u7995\u79C7\u79FB\u7A26\u7A53\u7AE9\u7B16\u7BB7\u7BD2\u7C03\u7C4E\u7E0A\u7E44\u7E76\u7E79\u7ECE\u7F22\u7F9B\u7FA0\u7FA9\u7FBF\u7FCA\u7FCC\u7FF3\u7FFC\u8034\u8084\u808A\u80F0\u8189\u81C6\u8223\u8257\u8264\u827A\u827E\u8285\u82C5\u82E1\u82E2\u8351\u8413\u841F\u84FA\u858F\u85D9\u85DD\u8619\u8649\u8681\u86C7\u86DC\u86E1\u86E6\u86FE\u8734\u8794\u8798\u87A0\u87FB\u8863\u8864\u886A\u8898\u88A3\u88D4\u88DB\u88FF\u8939\u897C\u89FA\u8A32\u8A33\u8A4D\u8A52\u8A63\u8A83\u8ABC\u8B3B\u8B69\u8B6F\u8B70\u8B89\u8B9B\u8BAE\u8BD1\u8BD2\u8BE3\u8C0A\u8C59\u8C5B\u8C77\u8C96\u8CA4\u8CBD\u8D00\u8D3B\u8DC7\u8DE0\u8E26\u8EFC\u8F22\u8F59\u8F76\u8FB7\u8FC6\u8FE4\u8FF1\u8FFB\u9018\u9038\u9057\u907A\u9091\u90FC\u9113\u914F\u91AB\u91B3\u91B7\u91D4\u91F4\u91F6\u9218\u9220\u926F\u92A5\u93B0\u93D4\u943F\u9487\u94F1\u9552\u9571\u9623\u96BF\u972C\u9809\u9824\u9825\u984A\u9857\u9890\u98DF\u98F4\u9950\u9974\u99C5\u9A5B\u9A7F\u9AAE\u9BA7\u9BA8\u9BE3\u9CE6\u9D3A\u9D82\u9D83\u9D8D\u9DC1\u9DCA\u9DD6\u9DE7\u9DFE\u9E03\u9E5D\u9E62\u9E65\u9ED3\u9EDF\u9EF3\u9F6E\u9F78", "yin": "\u4E51\u4F12\u4F8C\u5198\u51D0\u5370\u541F\u5432\u552B\u5591\u5656\u567E\u569A\u56D9\u56E0\u5701\u573B\u5794\u57A0\u57BD\u5819\u5837\u5924\u59FB\u5A63\u5A6C\u5BC5\u5C39\u5CFE\u5D1F\u5D2F\u5DBE\u5ED5\u5EF4\u5F15\u6114\u6147\u616D\u6196\u6197\u61DA\u65A6\u6704\u6836\u6880\u6A83\u6AAD\u6ABC\u6AFD\u6B2D\u6B45\u6BA5\u6BB7\u6C24\u6CFF\u6D07\u6D15\u6DEB\u6DFE\u6E5A\u6E6E\u6EB5\u6EDB\u6FE5\u6FE6\u70CE\u72BE\u72FA\u730C\u73E2\u748C\u7616\u763E\u764A\u766E\u784D\u7892\u78E4\u798B\u79F5\u7AA8\u7B43\u7C8C\u7D6A\u7DF8\u7E2F\u80E4\u82C2\u831A\u8335\u836B\u8376\u8491\u8529\u852D\u861F\u8693\u87BE\u87EB\u88C0\u8A14\u8A1A\u8A21\u8ABE\u8AF2\u8B94\u8D7A\u8D9B\u8F11\u911E\u9153\u9173\u920F\u921D\u9280\u92A6\u94DF\u94F6\u95C9\u9625\u9634\u9670\u967B\u9682\u9690\u96A0\u96B1\u9712\u9720\u972A\u9777\u9787\u97F3\u97FE\u98EE\u98F2\u996E\u99F0\u9A83\u9BA3\u9DE3\u9F57\u9F66\u9F82\u9F88", "ying": "\u5040\u50CC\u5568\u55B6\u5624\u565F\u56B6\u584B\u5903\u5A74\u5A96\u5AB5\u5AC8\u5B30\u5B34\u5B46\u5B7E\u5D64\u5DC6\u5DCA\u5E94\u5EEE\u5F71\u5FDC\u6125\u61C9\u646C\u6484\u650D\u6516\u65F2\u6620\u666F\u668E\u6720\u67CD\u685C\u686F\u68AC\u6967\u6979\u6A31\u6AFB\u6AFF\u6D67\u6E36\u6E81\u6E8B\u6ECE\u6EE2\u6F41\u6F46\u6FD9\u6FDA\u6FF4\u7005\u701B\u7020\u702F\u7034\u7050\u705C\u7138\u713D\u7150\u7192\u71DF\u7203\u73F1\u745B\u7469\u748E\u74D4\u7507\u7516\u763F\u766D\u76C1\u76C8\u770F\u77E8\u786C\u78A4\u792F\u799C\u7A4E\u7C5D\u7C6F\u7DD3\u7E08\u7E93\u7EEC\u7F28\u7F42\u7F43\u7F4C\u803A\u81A1\u81BA\u82F1\u8314\u8365\u8367\u83B9\u83BA\u8424\u8425\u8426\u843E\u84E5\u85C0\u8621\u86CD\u8747\u8767\u877F\u87A2\u8805\u8833\u892E\u89AE\u8B0D\u8B4D\u8B7B\u8CCF\u8D0F\u8D62\u8EC8\u8FCE\u90E2\u93A3\u941B\u944D\u9533\u9719\u9795\u97FA\u9834\u988D\u9895\u9896\u9C66\u9D2C\u9D91\u9DA7\u9DAF\u9DEA\u9DF9\u9E0E\u9E1A\u9E66\u9E70", "yo": "\u54DF\u5537\u55B2\u80B2", "yong": "\u4F63\u4FD1\u50AD\u52C7\u52C8\u548F\u5581\u55C8\u5670\u57C7\u584E\u5889\u58C5\u5ADE\u5D71\u5EB8\u5EF1\u5F6E\u603A\u607F\u6080\u60E5\u6111\u6139\u6142\u6175\u62E5\u63D8\u64C1\u67E1\u6810\u69E6\u6C38\u6CF3\u6D8C\u6E67\u6EFD\u6FAD\u7049\u7245\u7257\u7528\u752C\u75C8\u7655\u7670\u783D\u7867\u81C3\u82DA\u848F\u86F9\u8A60\u8E0A\u8E34\u9095\u90FA\u9118\u919F\u92BF\u93DE\u955B\u96CD\u96DD\u9852\u9899\u9954\u9BD2\u9C2B\u9C45\u9CAC\u9CD9\u9DDB", "you": "\u4E23\u4EB4\u4F18\u4F51\u4F66\u4F91\u5064\u512A\u5198\u5363\u53C8\u53CB\u53F3\u5466\u54CA\u5500\u5698\u56FF\u598B\u59F7\u5B67\u5BA5\u5C22\u5C24\u5CDF\u5CF3\u5E7C\u5E7D\u5EAE\u5FE7\u601E\u6023\u602E\u60A0\u6182\u61EE\u63C2\u6538\u65BF\u6709\u67DA\u682F\u6884\u688E\u6962\u69F1\u6ACC\u6AFE\u6C7C\u6C8B\u6CB9\u6CD1\u6D5F\u6E38\u6E75\u6EFA\u7000\u7256\u7257\u7270\u72B9\u72D6\u7336\u7337\u7376\u737F\u7531\u7534\u75A3\u75CF\u7950\u7989\u79DE\u7E47\u7E8B\u7F91\u7FAA\u8030\u8048\u80AC\u82C3\u839C\u83A0\u83A4\u83B8\u8555\u86B0\u86B4\u870F\u8763\u8764\u8A27\u8A98\u8BF1\u8C81\u8F0F\u8F36\u8FF6\u900C\u9030\u904A\u90AE\u90F5\u913E\u9149\u916D\u91C9\u923E\u92AA\u94C0\u94D5\u99C0\u9B77\u9B8B\u9C7F\u9C89\u9E80\u9EDD\u9F2C", "yu": "\u4E02\u4E0E\u4E7B\u4E88\u4E8E\u4E90\u4F03\u4F1B\u4F59\u4FC1\u4FDE\u4FE3\u4FFC\u504A\u50B4\u50EA\u5125\u516A\u532C\u53DE\u5401\u543E\u5539\u5581\u5585\u55A9\u55BB\u5673\u5704\u5709\u57DF\u5809\u5823\u582C\u5965\u5967\u59A4\u59AA\u5A1B\u5A2A\u5A2F\u5A31\u5A7E\u5A80\u5AAE\u5AD7\u5B29\u5B87\u5BD3\u5BD9\u5C09\u5C7F\u5CEA\u5D33\u5D4E\u5D5B\u5D8E\u5DBC\u5EBD\u5EBE\u5F67\u5FA1\u5FEC\u6086\u60D0\u6108\u6109\u611A\u617E\u61D9\u622B\u625C\u625D\u6275\u6327\u6353\u6365\u63C4\u6554\u6594\u659E\u65BC\u65DF\u6631\u6745\u682F\u6859\u68DB\u68DC\u68EB\u6940\u6961\u6970\u6986\u6AF2\u6B0E\u6B1D\u6B24\u6B25\u6B32\u6B48\u6B5F\u6B76\u6BD3\u6D74\u6DE2\u6DE4\u6DEF\u6E14\u6E1D\u6E61\u6EEA\u6F01\u6F4F\u6F9A\u6F9E\u6FA6\u706A\u7079\u7134\u715C\u71A8\u71CF\u71E0\u7229\u724F\u72F1\u72F3\u7344\u7389\u7397\u7399\u7419\u741F\u7440\u745C\u74B5\u756C\u75CF\u7600\u7609\u7610\u7652\u76C2\u76D3\u776E\u77DE\u7821\u7862\u7872\u7907\u7916\u791C\u7964\u79A6\u79B9\u79BA\u79D7\u7A22\u7A36\u7A65\u7A7B\u7AAC\u7AB3\u7AFD\u7B8A\u7BFD\u7C45\u7C5E\u7C72\u7C96\u7CA5\u7D06\u7DCE\u7EA1\u7F6D\u7FAD\u7FBD\u7FD1\u807F\u8080\u80B2\u8174\u81FE\u8201\u8206\u8207\u8245\u8248\u828B\u828C\u831F\u8330\u83C0\u842D\u842E\u8438\u84AE\u84E3\u84F9\u851A\u854D\u8577\u8581\u85C7\u860C\u861B\u865E\u8676\u871F\u872E\u8753\u87B8\u8867\u88AC\u88D5\u8915\u89A6\u89CE\u8A89\u8A9E\u8ADB\u8AED\u8B23\u8B7D\u8BED\u8C00\u8C15\u8C37\u8C6B\u8C90\u8E30\u8EC9\u8F0D\u8F3F\u8F5D\u8FBC\u8FC2\u8FC3\u9033\u903E\u9047\u9079\u9098\u90AA\u90C1\u9105\u9151\u91A7\u91EA\u923A\u9289\u92CA\u9325\u935D\u942D\u94B0\u95BE\u9608\u9653\u9683\u9685\u96A9\u96D3\u96E4\u96E8\u96E9\u9731\u9810\u9828\u9884\u98EB\u9918\u9947\u996B\u9980\u99AD\u9A1F\u9A48\u9A6D\u9AAC\u9AC3\u9B30\u9B31\u9B3B\u9B4A\u9B5A\u9B63\u9BBD\u9BF2\u9C05\u9C4A\u9C7C\u9CFF\u9D25\u9D27\u9D2A\u9D52\u9DE0\u9DF8\u9E06\u9E12\u9E46\u9E6C\u9E8C\u9F6C\u9F75\u9F89", "yuan": "\u5086\u5143\u5186\u51A4\u5248\u539F\u53A1\u53B5\u5458\u54E1\u559B\u566E\u56E6\u56ED\u5706\u570E\u5712\u5713\u571C\u57A3\u57B8\u586C\u5917\u59A7\u59B4\u5A9B\u5AB4\u5AC4\u5B3D\u5B9B\u5BC3\u5F32\u6028\u6081\u60CC\u613F\u63BE\u63F4\u676C\u68E9\u6965\u699E\u69AC\u6A7C\u6ADE\u6C85\u6DB4\u6DF5\u6E01\u6E06\u6E0A\u6E15\u6E72\u6E90\u6E92\u7041\u7230\u7328\u733F\u7457\u76F6\u7722\u7990\u7B0E\u7BA2\u7DE3\u7E01\u7F18\u7FB1\u8099\u82AB\u82D1\u8312\u847E\u849D\u84AC\u8597\u85B3\u8696\u870E\u8735\u875D\u876F\u8788\u884F\u8881\u88EB\u88F7\u8911\u8924\u8B1C\u8D20\u8F45\u8F95\u8FDC\u903A\u9060\u908D\u90A7\u915B\u9228\u92FA\u93B1\u9662\u9858\u99CC\u9A35\u9B6D\u9CF6\u9D1B\u9D77\u9DA2\u9DB0\u9E22\u9E33\u9E53\u9EFF\u9F0B\u9F18\u9F1D", "yue": "\u4E50\u514A\u514C\u5151\u5216\u54D5\u54FE\u5558\u5666\u599C\u5B33\u5C84\u5CB3\u5DBD\u5F5F\u6071\u6085\u60A6\u6209\u625A\u6288\u6373\u64FD\u66F0\u66F1\u6708\u6782\u680E\u697D\u6A02\u6A3E\u6ADF\u6CE7\u7039\u721A\u73A5\u77C6\u77F1\u793F\u79B4\u7BB9\u7BD7\u7C46\u7C65\u7C70\u7CA4\u7CB5\u7D04\u7EA6\u81D2\u8625\u868E\u868F\u8AAA\u8AAC\u8BF4\u8D8A\u8DAF\u8DC0\u8DC3\u8E8D\u8ECF\u9205\u925E\u9470\u94A5\u94BA\u95B1\u95B2\u9605\u9AFA\u9E11\u9E19\u9EE6\u9FA0", "yun": "\u4E91\u4F1D\u508A\u5141\u52FB\u5300\u5458\u54E1\u5597\u56E9\u593D\u596B\u5998\u5B55\u607D\u60F2\u6120\u612A\u614D\u628E\u62A3\u6600\u6655\u6688\u679F\u6985\u6A52\u6B92\u6B9E\u6C32\u6C33\u6C84\u6D92\u6DA2\u6EB3\u6F90\u7147\u7174\u717E\u7185\u7189\u71A8\u72C1\u73A7\u7547\u7703\u78D2\u79D0\u7B60\u7B7C\
