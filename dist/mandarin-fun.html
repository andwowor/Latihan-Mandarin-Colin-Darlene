<title>Mandarin Fun</title>
<meta name="description" content="Latihan membaca, mendengar, dan menulis bahasa Mandarin untuk Colin dan Darlene." />
<style>
/* =========================================================================
   Mandarin Fun \002014 gaya visual ramah anak.
   Warna cerah, tombol besar, sudut membulat, umpan balik yang jelas.
   ========================================================================= */

:root {
  --bg: #f6f8ff;
  --card: #ffffff;
  --ink: #1d2440;
  --ink-soft: #5b6488;
  --line: #e4e8f5;

  --brand: #6c5ce7;
  --green: #35c47a;
  --green-dark: #23a562;
  --red: #ff5d6c;
  --amber: #ffb020;
  --blue: #2f7ef2;
  --pink: #e0489b;

  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 4px 0 rgba(29, 36, 64, 0.12);
  --shadow-lg: 0 12px 30px rgba(29, 36, 64, 0.14);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141829;
    --card: #1e2338;
    --ink: #f2f4ff;
    --ink-soft: #a3abd0;
    --line: #2e3550;
    --shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Nunito', 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;

  /* Jari anak sering menempel sepersekian detik terlalu lama di layar. Tanpa
     ini, sentuhan begitu berubah jadi seleksi teks: kata atau kalimatnya
     ter-blok biru dan menu "Salin/Cari" menutupi soal. Seluruh antarmuka
     dijadikan tidak bisa diseleksi \002014 yang memang perlu disalin diberi
     kelas .selectable. */
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* Kolom isian tetap harus bisa diseleksi, kalau tidak papan ketik jadi susah. */
.selectable, input, textarea {
  -webkit-user-select: text;
  -moz-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

/* ------------------------------------------------- lambang (avatar) anak
   Ukurannya dinyatakan dalam `em` supaya satu aturan melayani semua tempat:
   besar di layar masuk, sedang di bilah atas, sekecil huruf di keterangan
   grafik. `1.15em` dipilih agar bobot visualnya setara emoji di sebelahnya. */
.avatar-slot { display: inline-flex; align-items: center; }
.avatar {
  width: 1.15em;
  height: 1.15em;
  object-fit: contain;
  vertical-align: -.2em;
  flex: none;
}
/* Cadangan emoji: tersembunyi sampai gambarnya gagal dimuat. */
.avatar-slot__fallback { display: none; }
.avatar-slot--fallback .avatar { display: none; }
.avatar-slot--fallback .avatar-slot__fallback { display: inline; }

/* Karakter Han perlu font khusus supaya tampil rapi di semua perangkat. */
.hanzi, .zh {
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', 'Heiti SC', sans-serif;
  font-weight: 600;
}

button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

#app { min-height: 100%; display: flex; flex-direction: column; }

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 16px);
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
  animation: fade-in .25s ease;
}

@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.screen--pad-nav { padding-bottom: calc(var(--safe-bottom) + 88px); }

/* ------------------------------------------------------------- komponen */

.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}

.card__title {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  font-size: 1rem;
  font-weight: 800;
  background: var(--line);
  color: var(--ink);
  box-shadow: var(--shadow);
  transition: transform .08s ease, filter .15s ease;
  min-height: 52px;
  width: 100%;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn[disabled] { opacity: .45; box-shadow: none; cursor: not-allowed; }

.btn--primary { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); }
.btn--brand   { background: var(--brand); color: #fff; box-shadow: 0 4px 0 #4b3ec2; }
.btn--danger  { background: var(--red); color: #fff; box-shadow: 0 4px 0 #d9414f; }
.btn--ghost   { background: transparent; border: 2px solid var(--line); box-shadow: none; }
.btn--sm      { padding: 8px 14px; min-height: 40px; font-size: .9rem; }

.row { display: flex; gap: 10px; align-items: center; }
.row--between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--ink-soft); }
.small { font-size: .82rem; }
.center { text-align: center; }
.grow { flex: 1; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--line);
  font-weight: 800;
  font-size: .82rem;
  white-space: nowrap;
}

.bar {
  height: 14px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.bar__fill {
  height: 100%;
  background: var(--green);
  border-radius: 999px;
  transition: width .4s cubic-bezier(.2,.9,.3,1);
}

/* ------------------------------------------------------------ layar login */

.login { justify-content: center; gap: 22px; text-align: center; }
.login__logo { font-size: 3.6rem; line-height: 1; }
.login__title { font-size: 2rem; font-weight: 900; margin: 0; letter-spacing: -.5px; }
.login__sub { margin: 0; color: var(--ink-soft); }

.profile-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 520px) { .profile-grid { grid-template-columns: 1fr 1fr; } }

.profile-card {
  border: 3px solid var(--line);
  background: var(--card);
  border-radius: 26px;
  padding: 22px 16px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform .1s ease;
  width: 100%;
}
.profile-card:active { transform: translateY(3px) scale(.99); }
.profile-card__avatar { font-size: 3.4rem; line-height: 1.1; }
.profile-card__name { font-size: 1.45rem; font-weight: 900; margin: 4px 0 2px; }
.profile-card__meta { color: var(--ink-soft); font-size: .86rem; }
.profile-card__stats { margin-top: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

/* -------------------------------------------------------------- top bar */

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.topbar__avatar {
  font-size: 1.7rem;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--line);
  flex: none;
}
.topbar__name { font-weight: 900; line-height: 1.1; }
.topbar__chips { display: flex; gap: 6px; flex-wrap: wrap; }

.chip-xp     { background: #efe9ff; color: #5b45d6; }
.chip-streak { background: #fff0d6; color: #b26a00; }
.chip-level  { background: #dff5e8; color: #1e8a52; }
.chip-word   { background: #e2edff; color: #2160c4; }
@media (prefers-color-scheme: dark) {
  .chip-xp     { background: #3a2f6b; color: #cdbcff; }
  .chip-streak { background: #4a3410; color: #ffd28a; }
  .chip-level  { background: #17402b; color: #96e8bb; }
  .chip-word   { background: #1c3560; color: #a9cbff; }
}

/* --------------------------------------------------------- cincin target */

.goal { display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; width: 84px; height: 84px; flex: none; position: relative; }
.ring__svg { transform: rotate(-90deg); }
.ring__bg { stroke: var(--line); }
.ring__fg { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.9,.3,1); }
.ring__label {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-weight: 900; font-size: .95rem;
}

/* ------------------------------------------------------------ misi harian */

.mission {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--line);
  margin-bottom: 10px;
  background: var(--card);
}
.mission:last-child { margin-bottom: 0; }
.mission--done { border-color: var(--green); background: color-mix(in srgb, var(--green) 10%, var(--card)); }
.mission__icon { font-size: 1.7rem; flex: none; width: 40px; text-align: center; }
.mission__body { flex: 1; min-width: 0; }
.mission__title { font-weight: 800; font-size: .95rem; }
.mission__meta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-soft); margin: 4px 0 5px; }
.mission__check { font-size: 1.4rem; flex: none; }

/* --------------------------------------------------------------- peta level */

.level-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
.level-tabs::-webkit-scrollbar { display: none; }
.level-tab {
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 8px 15px;
  font-weight: 800;
  white-space: nowrap;
  font-size: .88rem;
  box-shadow: var(--shadow);
}
.level-tab[aria-selected='true'] { background: var(--brand); color: #fff; border-color: var(--brand); }
.level-tab[disabled] { opacity: .45; }

.path { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 20px; }
.path__row { display: flex; width: 100%; justify-content: center; }
/* Jalur berkelok seperti papan permainan. */
.path__row:nth-child(4n+1) { justify-content: center; }
.path__row:nth-child(4n+2) { justify-content: flex-end; padding-right: 12%; }
.path__row:nth-child(4n+3) { justify-content: center; }
.path__row:nth-child(4n+4) { justify-content: flex-start; padding-left: 12%; }

.node {
  width: 92px;
  border: none;
  background: transparent;
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 6px 0;
}
.node__disc {
  width: 68px; height: 68px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.5rem;
  font-weight: 900;
  color: #fff;
  background: var(--brand);
  box-shadow: 0 5px 0 rgba(0,0,0,.18);
  transition: transform .1s ease;
}
.node:active .node__disc { transform: translateY(4px); box-shadow: none; }
.node--locked .node__disc { background: var(--line); color: var(--ink-soft); box-shadow: 0 5px 0 rgba(0,0,0,.08); }
.node--done .node__disc { background: var(--green); box-shadow: 0 5px 0 var(--green-dark); }
.node__stars { font-size: .78rem; letter-spacing: 1px; }
.node__label { font-size: .72rem; color: var(--ink-soft); text-align: center; line-height: 1.2; }
/* Tanda buku kecil di pojok: materinya belum pernah dibaca. */
.node__disc { position: relative; }
.node__flag {
  position: absolute; top: -4px; right: -6px;
  font-size: .9rem;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
}

/* --------------------------------------------------------------- sheet */

.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 18, 35, .45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 50;
  animation: fade-in .18s ease;
}
.sheet {
  background: var(--card);
  width: 100%; max-width: 720px;
  border-radius: 26px 26px 0 0;
  padding: 20px 16px calc(var(--safe-bottom) + 20px);
  animation: slide-up .22s cubic-bezier(.2,.9,.3,1);
  max-height: 88vh; overflow-y: auto;
}
@keyframes slide-up { from { transform: translateY(100%); } to { transform: none; } }
.sheet__handle { width: 44px; height: 5px; background: var(--line); border-radius: 999px; margin: 0 auto 14px; }

.skill-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-weight: 800;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
}
.skill-btn:active { transform: translateY(3px); box-shadow: none; }
.skill-btn__emoji { font-size: 1.8rem; }
/* Keterangan selalu turun ke baris sendiri, kalau tidak judul dan penjelasan
   menyambung jadi satu kalimat panjang yang sulit dipindai. */
.skill-btn__sub { display: block; font-weight: 600; font-size: .8rem; color: var(--ink-soft); }

.skill-btn[disabled] { opacity: .5; box-shadow: none; cursor: not-allowed; }
/* Sesi belajar adalah pintu masuk pelajaran, jadi tombolnya paling menonjol. */
.skill-btn--study { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--card)); }

/* -------------------------------------------------------- sesi belajar */

.study { flex: 1; display: flex; flex-direction: column; }
/* Kartu ditaruh di tengah layar: mata anak tidak perlu berpindah jauh dari
   huruf besar ke tombol Lanjut di bawah. */
.study > .grow { display: flex; flex-direction: column; justify-content: center; }
.study__step { font-weight: 800; font-size: .82rem; color: var(--ink-soft); margin: 0 0 10px; }
.study__card { margin-bottom: 12px; }
.study__meaning { font-size: 1.3rem; font-weight: 800; margin-top: 10px; }

.study__cover {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; gap: 10px;
  padding: 12px 0;
}
.study__emoji { font-size: 3.4rem; line-height: 1; }
.study__title { font-size: 2.1rem; font-weight: 900; margin: 0; line-height: 1.2; }
.study__subtitle { margin: 0; color: var(--ink-soft); font-weight: 700; }

/* Kartu bekal HSK dibedakan jelas supaya anak tahu ini "bonus", bukan
   materi YCT yang akan diujikan berat. */
.study__card--bridge { border-color: var(--brand); border-style: dashed; }
.study__ribbon {
  display: inline-block;
  background: color-mix(in srgb, var(--brand) 16%, var(--card));
  color: var(--brand);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: .74rem; font-weight: 800;
  margin-bottom: 12px;
}
.study__badge {
  background: color-mix(in srgb, var(--amber) 18%, var(--card));
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: .8rem; font-weight: 700;
  margin: 0;
}
.study__example { text-align: left; margin-bottom: 0; }

.tag {
  display: inline-block;
  border-radius: 999px;
  padding: 1px 8px;
  font-size: .68rem; font-weight: 800;
  vertical-align: middle;
}
.tag--bridge { background: color-mix(in srgb, var(--brand) 16%, var(--card)); color: var(--brand); }
.tag--also   { background: color-mix(in srgb, var(--amber) 22%, var(--card)); color: #9a6400; }
@media (prefers-color-scheme: dark) { .tag--also { color: var(--amber); } }

.chip-study { background: #efe9ff; color: #5b45d6; }
@media (prefers-color-scheme: dark) { .chip-study { background: #3a2f6b; color: #cdbcff; } }

/* ------------------------------------------------------------- latihan */

.quiz { flex: 1; display: flex; flex-direction: column; }
.quiz__head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.quiz__bar { flex: 1; }
.quiz__hearts { font-size: 1rem; letter-spacing: -2px; flex: none; }
.quiz__combo { font-size: .8rem; font-weight: 900; color: var(--amber); }

.quiz__instruction { font-weight: 800; font-size: 1.05rem; margin: 0 0 14px; }

.prompt {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 16px;
  text-align: center;
  margin-bottom: 16px;
}
.prompt__zh { font-size: 3.1rem; line-height: 1.15; }
.prompt__zh--sentence { font-size: 1.9rem; }
.prompt__py { color: var(--ink-soft); font-size: 1rem; margin-top: 6px; }
.prompt__id { font-size: 1.5rem; font-weight: 800; }

.speaker {
  width: 108px; height: 108px;
  border-radius: 50%;
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 2.6rem;
  box-shadow: 0 6px 0 #1f5fc0;
  margin: 0 auto;
  display: grid; place-items: center;
}
.speaker:active { transform: translateY(4px); box-shadow: none; }
.speaker--slow { width: 56px; height: 56px; font-size: 1.3rem; background: var(--amber); box-shadow: 0 4px 0 #cc8500; }

.options { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.options--wide { grid-template-columns: 1fr; }

.option {
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 16px 12px;
  font-weight: 800;
  font-size: 1rem;
  min-height: 66px;
  box-shadow: var(--shadow);
  transition: transform .08s ease;
  word-break: break-word;
}
.option:active { transform: translateY(3px); box-shadow: none; }
.option--hanzi { font-size: 1.9rem; }
.option--sentence { font-size: 1.15rem; }
.option[aria-pressed='true'] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--card)); }
.option--correct { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--card)); }
.option--wrong   { border-color: var(--red);   background: color-mix(in srgb, var(--red) 16%, var(--card)); }

/* Papan susun kata / kalimat */
.builder {
  min-height: 78px;
  border: 2px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
  margin-bottom: 12px;
}
.tile {
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 1.5rem;
  font-weight: 700;
  box-shadow: var(--shadow);
}
.tile:active { transform: translateY(3px); box-shadow: none; }
.tile--used { opacity: .28; pointer-events: none; }

/* Latihan berbicara */
.mic-wrap { display: grid; justify-items: center; gap: 10px; padding: 8px 0 4px; }
.mic {
  width: 118px; height: 118px;
  border-radius: 50%;
  border: none;
  background: var(--pink);
  color: #fff;
  font-size: 2.9rem;
  box-shadow: 0 6px 0 #b53379;
  display: grid; place-items: center;
  transition: transform .1s ease;
}
.mic:active { transform: translateY(4px); box-shadow: none; }
.mic[disabled] { opacity: .55; }

/* Denyut saat sedang mendengarkan */
.mic--listening { background: var(--red); box-shadow: 0 6px 0 #c9394a; animation: mic-pulse 1.1s ease-in-out infinite; }
@keyframes mic-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.07); }
}

.mic__hint { margin: 0; font-weight: 800; font-size: .92rem; text-align: center; }
.mic__heard {
  margin: 0; min-height: 30px;
  font-size: 1.5rem; text-align: center;
  color: var(--brand);
}

/* Kanvas menulis */
.trace-wrap { position: relative; width: 260px; height: 260px; margin: 0 auto 12px; touch-action: none; }
.trace-guide, .trace-canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: var(--radius-sm); }
/* Latar kotak bantu (garis tengah horizontal + vertikal) seperti buku tulis Mandarin. */
.trace-guide {
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 50% 50% / 100% 50%,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 50% 50% / 50% 100%,
    var(--card);
  border: 2px solid var(--line);
  user-select: none;
}
.trace-canvas { touch-action: none; }

/* Umpan balik */
.feedback {
  position: sticky;
  bottom: 0;
  margin: 14px -16px calc(var(--safe-bottom) * -1);
  padding: 16px 16px calc(var(--safe-bottom) + 16px);
  border-radius: 22px 22px 0 0;
  animation: slide-up .2s ease;
}
.feedback--ok  { background: color-mix(in srgb, var(--green) 20%, var(--card)); }
.feedback--bad { background: color-mix(in srgb, var(--red) 18%, var(--card)); }
.feedback__title { font-weight: 900; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.feedback__body { font-size: .92rem; margin: 4px 0 12px; }

/* ---------------------------------------------------------------- hasil */

.result { justify-content: center; text-align: center; gap: 6px; }
.result__stars { font-size: 3.2rem; letter-spacing: 4px; }
.result__title { font-size: 1.7rem; font-weight: 900; margin: 4px 0; }
.result__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.result__stat { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius-sm); padding: 12px 6px; }
.result__stat b { display: block; font-size: 1.35rem; }
.result__stat span { font-size: .74rem; color: var(--ink-soft); }

.badge-pop {
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--amber) 20%, var(--card));
  border: 2px solid var(--amber);
  border-radius: var(--radius-sm);
  padding: 12px; margin-bottom: 8px; text-align: left;
}
.badge-pop__emoji { font-size: 2rem; }

/* -------------------------------------------------------------- progres */

.period-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.period-tabs::-webkit-scrollbar { display: none; }
.period-tab {
  border: 2px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 7px 13px; font-weight: 800; font-size: .82rem; white-space: nowrap;
}
.period-tab[aria-selected='true'] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.versus__side { text-align: center; padding: 12px 6px; border-radius: var(--radius-sm); border: 2px solid var(--line); }
.versus__side--win { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--card)); }
.versus__avatar { font-size: 2.2rem; }
.versus__xp { font-size: 1.6rem; font-weight: 900; }
.versus__vs { font-weight: 900; color: var(--ink-soft); }

/* Kolom harus meregang setinggi grafik; kalau container-nya align-items:flex-end,
   tinggi persen pada batang tidak punya acuan dan batangnya jadi gepeng. */
.chart { display: flex; align-items: stretch; gap: 3px; height: 140px; padding-top: 8px; }
.chart__col { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; gap: 2px; }
.chart__bar { flex: 1; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 2px; transition: height .4s ease; }
.chart__bar--b { background: var(--pink); }

.skill-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.skill-row__emoji { font-size: 1.4rem; width: 30px; }
.skill-row__bar { flex: 1; }

/* Keterangan warna. Warna melekat pada anaknya (biru Colin, merah muda
   Darlene) dan dipakai sama persis di grafik XP maupun di perbandingan
   keterampilan, supaya satu warna selalu berarti satu orang. */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; font-size: .8rem; font-weight: 700; }
.legend__item { display: inline-flex; align-items: center; gap: 6px; }
.legend__swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

/* Perbandingan ketepatan dua anak, satu kelompok per keterampilan. */
.skillcmp { margin-bottom: 15px; }
.skillcmp:last-of-type { margin-bottom: 0; }
.skillcmp__head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.skillcmp__emoji { font-size: 1.1rem; }
.skillcmp__name { font-weight: 800; font-size: .92rem; }

.skillcmp__row { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
.skillcmp__row:last-child { margin-bottom: 0; }
.skillcmp__who {
  width: 74px; flex: none;
  font-size: .76rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.skillcmp__track {
  flex: 1; min-width: 0;
  height: 11px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.skillcmp__fill {
  display: block; height: 100%;
  border-radius: 999px;
  min-width: 4px;              /* nilai sekecil apa pun tetap terlihat */
  transition: width .4s cubic-bezier(.2,.9,.3,1);
}
.skillcmp__val {
  width: 84px; flex: none;
  text-align: right;
  font-size: .72rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.skillcmp__val b { font-size: .82rem; }

/* Belum pernah dicoba \002260 0% benar: jalurnya dibiarkan kosong bergaris putus
   supaya tidak terbaca sebagai "semua salah". */
.skillcmp__row--idle .skillcmp__track {
  background: transparent;
  border: 1.5px dashed var(--line);
}

@media (max-width: 22rem) {
  .skillcmp__who { width: 62px; font-size: .72rem; }
  .skillcmp__val { width: 74px; font-size: .68rem; }
}

/* -------------------------------------------------------------- lencana */

.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge {
  text-align: center; padding: 12px 6px;
  border: 2px solid var(--line); border-radius: var(--radius-sm);
  background: var(--card);
}
.badge--locked { opacity: .38; filter: grayscale(1); }
.badge__emoji { font-size: 2rem; line-height: 1.2; }
.badge__name { font-size: .72rem; font-weight: 800; margin-top: 4px; }

/* Incaran berikutnya: tiga lencana terdekat, ditulis lengkap dengan syaratnya
   supaya anak tahu persis apa yang harus dikerjakan. */
.next-badge {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.next-badge:last-child { border-bottom: none; padding-bottom: 0; }
.next-badge__emoji { font-size: 1.7rem; width: 34px; text-align: center; flex: none; }
.next-badge__desc { display: block; font-size: .8rem; font-weight: 600; color: var(--ink-soft); }

/* --------------------------------------------------------------- kamus */

.word-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.word-row__zh { font-size: 1.5rem; min-width: 68px; }
.word-row__body { flex: 1; min-width: 0; }
.word-row__py { color: var(--ink-soft); font-size: .82rem; }
.box-dots { display: flex; gap: 3px; }
.box-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.box-dot--on { background: var(--green); }

/* ------------------------------------------------------------ navigasi */

.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-top: 2px solid var(--line);
  display: flex;
  padding: 6px 4px calc(var(--safe-bottom) + 6px);
  z-index: 20;
}
.nav__item {
  flex: 1; border: none; background: transparent;
  display: grid; justify-items: center; gap: 1px;
  padding: 6px 2px; border-radius: 12px;
  font-size: .66rem; font-weight: 800; color: var(--ink-soft);

.nav__item[aria-current='page'] { color: var(--brand); }
.nav__emoji { font-size: 1.35rem; }
.nav__badge {
  position: absolute; transform: translate(14px, -4px);
  background: var(--red); color: #fff;
  border-radius: 999px; font-size: .58rem; padding: 1px 5px;
}

/* -------------------------------------------------- isian (menu orang tua) */

.field { display: block; margin-bottom: 12px; }
.field__label { display: block; font-size: .8rem; font-weight: 800; margin-bottom: 5px; }
.field__label--row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.field__reveal {

  color: var(--brand);
  font-size: .78rem; font-weight: 800;
  padding: 2px 4px;
  white-space: nowrap;
}
.field__input {
  width: 100%;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: inherit;
  font-size: 1rem;
  min-height: 48px;
}
.field__input:focus { outline: 3px solid var(--brand); outline-offset: 1px; }
.field__input::placeholder { color: var(--ink-soft); opacity: .7; }

.empty { text-align: center; padding: 32px 16px; color: var(--ink-soft); }
.empty__emoji { font-size: 2.6rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 92px);

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; overflow: hidden; }
.confetti i {
  position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(105vh) rotate(560deg); opacity: .9; }
}

/* ----------------------------------------------- pemilih suara pengucapan */

.voice-list { display: grid; gap: 8px; }

.voice {
  display: flex; align-items: center; gap: 8px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 4px 6px 4px 10px;
  background: var(--card);
}
.voice--on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--card)); }

.voice__pick { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 8px 0; cursor: pointer; }
.voice__pick input { accent-color: var(--brand); width: 20px; height: 20px; flex: none; }
.voice__body { display: grid; gap: 2px; min-width: 0; }
.voice__name { font-weight: 800; font-size: .92rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.voice__note { display: block; line-height: 1.35; }

.voice__tag {
  background: var(--brand); color: #fff;
  font-size: .66rem; font-weight: 800; letter-spacing: .02em;
  padding: 2px 7px; border-radius: 999px; white-space: nowrap;
}

.voice__try {
  flex: none;
  width: 40px; height: 40px; border-radius: 50%;

  color: var(--ink); font-size: .9rem; line-height: 1;

.seg__btn {

  font-family: inherit; font-weight: 800; font-size: .85rem;
  cursor: pointer;
}
.seg__btn--on { border-color: var(--brand); background: var(--brand); color: #fff; }

bi": "\u4F4A\u4F56\u4F5B\u4FFE\u506A\u5315\u5421\u5487\u54D4\u555A\u55F6\u5752\u581B\u58C1\u5936\u5970\u59A3\u59BC\u5A1D\u5A62\u5B16\u5B36\u5C44\u5D25\u5E01\u5E63\u5E64\u5E87\u5EB3\u5EE6\u5F0A\u5F3B\u5F3C\u5F43\u5F7C\u5FC5\u602D\u6036\u610A\u610E\u62C2\u655D\u6583\u65C7\u6707\u673C\u67C0\u67F2\u6890\u6945\u698C\u6BD4\u6BD5\u6BD6\u6BD9\u6BDE\u6BF4\u6C98\u6CCC\u6E62\u6ED7\u6EED\u6F77\u6FDE\u714F\u719A\u72F4\u7358\u7359\u73CC\u74A7\u7540\u7541\u7550\u7562\u7595\u75AA\u75F9\u75FA\u7680\u7695\u7764\u7765\u78A7\u7955\u7986\u79D5\u79D8\u7A2B\u7B13\u7B14\u7B46\u7B5A\u7B85\u7B86\u7BE6\u7BF3\u7C83\u7C8A\u7D15\u7D34\u7DBC\u7E2A\u7E74\u7EB0\u7F7C\u7FCD\u805B\u80B6\u80C7\u8177\u81C2\u822D\u8298\u82FE\u835C\u8378\u8406\u841E\u84D6\u84FD\u853D\u859C\u870C\u8795\u8890\u88E8\u8945\u895E\u8963\u89F1\u8A56\u8BD0\u8C4D\u8C8F\u8CB1\u8CC1\u8D14\u8D32\u8D51\u8DF8\u8E55\u8E83\u8E84\u8F9F\u903C\u907F\u90B2\u9119\u9128\u912A\u924D\u939E\u93CE\u9434\u94CB\u9587\u9588\u9589\u959F\u95EC\u95ED\u965B\u979E\u97B8\u97E0\u98F6\u9946\u999D\u99DC\u9A46\u9AC0\u9AF2\u9B53\u9B85\u9C0F\u9CBE\u9D56\u9D9D\u9DDD\u9DE9\u9F0A\u9F3B", "bian": "\u4FBF\u533E\u535E\u53D8\u5909\u5CC5\u5F01\u5FA7\u5FED\u60FC\u6241\u6283\u63D9\u662A\u6C73\u6C74\u709E\u7178\u7251\u7335\u7371\u73A3\u7502\u75BA\u782D\u78A5\u7A28\u7A86\u7B3E\u7BAF\u7C53\u7C69\u7CC4\u7DE8\u7DF6\u7F0F\u7F16\u81F1\u8251\u82C4\u8439\u85CA\u8759\u890A\u898D\u89B5\u8ADA\u8B8A\u8CB6\u8D2C\u8FA1\u8FA7\u8FA8\u8FA9\u8FAB\u8FAE\u8FAF\u8FB9\u8FBA\u904D\u9089\u908A\u91C6\u937D\u959E\u9795\u97AD\u9BFE\u9BFF\u9CCA\u9D18\u9DA3", "biao": "\u4FF5\u50C4\u5126\u5882\u5A4A\u5AD1\u5E56\u5F6A\u647D\u6753\u6807\u6A19\u6AA6\u6DF2\u6EEE\u700C\u706C\u719B\u7202\u730B\u762D\u78E6\u7A6E\u7BFB\u813F\u8194\u8198\u81D5\u85E8\u8868\u88F1\u893E\u8AD8\u8B24\u8D06\u9336\u93E2\u9463\u9556\u9573\u98A9\u98AE\u98B7\u98C6\u98C7\u98C8\u98CA\u98D1\u98D9\u98DA\u9A6B\u9A89\u9AA0\u9ADF\u9C3E\u9CD4\u9E83", "bie": "\u5225\u522B\u5F46\u5FB6\u618B\u67ED\u67F2\u762A\u765F\u767F\u8382\u864C\u86C2\u87DE\u8952\u8E69\u9C49\u9CD6\u9F08\u9F9E", "bin": "\u4EFD\u50A7\u5110\u5BBE\u5F6C\u6448\u64EF\u658C\u68B9\u6915\u69DF\u6AB3\u6BA1\u6BAF\u6C43\u6EE8\u6FD2\u6FF1\u6FF5\u7015\u73A2\u7478\u74B8\u780F\u7E7D\u7F24\u8191\u81CF\u8668\u8C69\u8C73\u8CD3\u8CD4\u90A0\u944C\u9554\u9726\u983B\u986E\u9891\u9ACC\u9AD5\u9AE9\u9B02\u9B13\u9B22", "bing": "\u4E19\u4E26\u4ECC\u4ED2\u4F75\u5002\u504B\u50A1\u5175\u51AB\u51B0\u57AA\u5BCE\u5C4F\u5C5B\u5E76\u5E77\u5EB0\u6032\u62A6\u63A4\u6452\u661E\u663A\u678B\u67C4\u681F\u6824\u68B9\u68C5\u69DF\u6AB3\u6C37\u70B3\u7415\u75C5\u772A\u7980\u79C9\u7A1F\u7A89\u7ADD\u7D63\u82EA\u86C3\u8A81\u90B4\u9235\u927C\u92F2\u9643\u9750\u9786\u979E\u97B8\u9905\u9920\u997C\u9BA9", "bo": "\u4EB3\u4EE2\u4F2F\u4F5B\u4FBC\u50E0\u50F0\u525D\u5265\u52C3\u535A\u535C\u54F1\u5575\u5643\u5697\u58C6\u5B5B\u5B79\u5D93\u5E1B\u5F74\u613D\u61EA\u62E8\u632C\u640F\u64A5\u64AD\u64D7\u64D8\u67CF\u67ED\u6872\u6991\u6A97\u6A98\u6B02\u6B95\u6CCA\u6CE2\u6D61\u6DFF\u6E24\u6E8A\u717F\u7254\u72DB\u733C\u73BB\u74DD\u74DF\u7676\u7677\u76AA\u76CB\u7835\u7886\u78FB\u7921\u7934\u79E1\u7A5B\u7B94\u7C19\u7C38\u7C3F\u7CEA\u7D34\u7F3D\u8091\u80C9\u8116\u818A\u822C\u8236\u824A\u8274\u82E9\u83E0\u8421\u8467\u8514\u8522\u8543\u8584\u8617\u86BE\u88AF\u88B0\u88B9\u894F\u896E\u8A96\u8B08\u8B52\u8DB5\u8DDB\u8E23\u8E73\u90E3\u9238\u9251\u9262\u92CD\u939B\u946E\u94B5\u94B9\u94C2\u9548\u9911\u993A\u997D\u998E\u999B\u999E\u99C1\u99EE\u9A4B\u9A73\u9AC6\u9AC9\u9B8A\u9C4D\u9C8C\u9D53\u9E41", "bu": "\u4E0D\u4F48\u52CF\u535C\u535F\u5425\u5498\u54FA\u57D4\u57D7\u57E0\u5821\u5A44\u5CEC\u5E03\u5EAF\u5ECD\u6016\u6091\u62AA\u6355\u6357\u636C\u6661\u67E8\u6B65\u6B68\u6B69\u74FF\u7B81\u7BF0\u7C3F\u8379\u8500\u8865\u88DC\u8AA7\u8E04\u8F50\u900B\u90E8\u90F6\u91AD\u9208\u923D\u933B\u949A\u94B8\u9914\u9922\u9BC6\u9CEA\u9D4F\u9E14", "ca": "\u5693\u56C3\u62C6\u64E6\u6503\u7924\u7938\u906A", "cai": "\u5038\u5072\u554B\u57F0\u5A47\u5BC0\u5F69\u624D\u6250\u63A1\u63CC\u6750\u68CC\u6BDD\u731C\u776C\u7DB5\u7E29\u7E94\u83DC\u8521\u88C1\u8CA1\u8D22\u8DF4\u8E29\u91C7", "can": "\u50AA\u510F\u53C2\u53C3\u53C4\u53C5\u55B0\u5607\u56CB\u5B20\u5B71\u60E8\u60ED\u6158\u6159\u615A\u61AF\u63BA\u6472\u6701\u6B8B\u6B98\u6E4C\u6FAF\u707F\u71E6\u7218\u74A8\u7A47\u7BF8\u7CB2\u8592\u8695\u8745\u8836\u883A\u8B32\u93D2\u98E1\u9910\u9A42\u9A96\u9EEA\u9EF2", "cang": "\u4ED3\u4EFA\u4F27\u5009\u5096\u51D4\u5328\u5D62\u6B0C\u6CA7\u6EC4\u6FF8\u734A\u73B1\u7472\u7BEC\u8231\u8259\u82CD\u84BC\u85CF\u87A5\u8CF6\u9476\u9DAC\u9E27", "cao": "\u50AE\u5608\u5C6E\u5D86\u613A\u6145\u6152\u61C6\u64A1\u64CD\u66F9\u66FA\u69FD\u6F15\u7CD9\u808F\u825A\u8278\u8349\u84F8\u87AC\u893F\u8959\u9135\u93EA\u9A32\u9F1C", "ce": "\u4FA7\u5074\u518A\u518C\u5395\u53A0\u5928\u5EC1\u607B\u60FB\u61A1\u62FA\u6547\u6805\u6D4B\u6E2C\u755F\u7B27\u7B56\u7B5E\u7B74\u7BA3\u7C0E\u7CA3\u835D\u8417\u8434\u84DB", "cen": "\u53C2\u53C3\u53C4\u53C5\u57C1\u5C91\u5D7E\u68A3\u6C75\u6D94\u7A47\u7B12\u7BF8", "ceng": "\u564C\u5C42\u5C64\u5D92\u66FD\u66FE\u6A67\u7AF2\u8E6D\u9A53", "cha": "\u4EDB\u4F98\u505B\u5239\u524E\u53C9\u55B3\u55CF\u5693\u579E\u597C\u59F9\u5BDF\u5C94\u5D56\u5DEE\u6260\u6271\u633F\u6348\u63D2\u63F7\u643D\u6456\u6748\u67E5\u67FB\u688C\u6942\u69CE\u6AAB\u6C4A\u7339\u7580\u78B4\u79C5\u7D01\u81FF\u8256\u8286\u82F4\u832C\u8336\u8869\u8A67\u8A6B\u8BE7\u8E45\u929F\u9364\u9388\u9454\u9538\u9572\u976B\u9937\u9987", "chai": "\u4FAA\u5115\u558D\u56C6\u5DEE\u62C6\u67F4\u72B2\u7625\u7961\u809E\u8286\u831D\u867F\u8806\u8883\u8A0D\u8C7A\u91F5\u9497", "chan": "\u4E33\u4EA7\u50DD\u5103\u5133\u5181\u522C\u5257\u5277\u5296\u5355\u5574\u55AE\u563D\u56B5\u56C5\u58E5\u5A75\u5B0B\u5B71\u5D2D\u5D7C\u5D83\u5D84\u5DC9\u5E5D\u5E68\u5EDB\u5FCF\u61F4\u61FA\u63BA\u6400\u644C\u6472\u647B\u6519\u65BA\u65F5\u68B4\u68CE\u6B03\u6BDA\u6D50\u6E79\u6EFB\u6F79\u6F7A\u6FB6\u700D\u703A\u705B\u7158\u71C0\u7351\u7522\u7523\u785F\u78DB\u7985\u79AA\u7C05\u7DC2\u7DFE\u7E5F\u7E75\u7E8F\u7E92\u7F20\u7FBC\u826C\u82C2\u8487\u8546\u8749\u87B9\u87D0\u87EC\u87FE\u88E7\u895C\u8998\u89C7\u8A97\u8AC2\u8B42\u8B87\u8B92\u8C04\u8C17\u8E94\u8FBF\u913D\u9141\u91A6\u92CB\u92D3\u93DF\u9471\u94F2\u9561\u9575\u95B3\u95E1\u9610\u97C2\u986B\u98A4\u995E\u998B\u9AA3", "chang": "\u4EE7\u4EE9\u4F25\u5000\u5018\u5021\u507F\u50D8\u511F\u514F\u5382\u53B0\u5531\u5617\u5690\u573A\u5834\u5872\u5A3C\u5AE6\u5C1D\u5E38\u5EE0\u5F9C\u6005\u60B5\u60DD\u655E\u660C\u6636\u66A2\u6919\u6C05\u6DCC\u6DD0\u713B\u7316\u739A\u7429\u7452\u747A\u74FA\u751E\u7545\u757C\u80A0\u8178\u8193\u82CC\u83D6\u8407\u88EE\u88F3\u8AAF\u92F9\u9329\u9520\u9577\u9578\u957F\u95B6\u95DB\u960A\u97D4\u9B2F\u9BE7\u9C68\u9CB3\u9CBF\u9F1A", "chao": "\u4EE6\u4EEF\u527F\u528B\u52E6\u5435\u5632\u5DD0\u5DE2\u5DE3\u5F28\u600A\u6284\u6477\u6641\u671D\u69F1\u6A14\u6B29\u6F05\u6F6E\u7092\u7123\u712F\u717C\u724A\u7727\u7AB2\u7ABC\u7C86\u7DBD\u7EF0\u7F7A\u8016\u89D8\u8A2C\u8B3F\u8D85\u8F48\u911B\u9214\u949E\u9EA8\u9F02\u9F0C", "che": "\u4F21\u4FE5\u5056\u52F6\u546B\u5513\u577C\u5972\u5C3A\u5C6E\u5F7B\u5FB9\u626F\u63A3\u63CA\u6470\u64A4\u64A6\u6F88\u70E2\u70F2\u710E\u7221\u77AE\u7817\u7868\u7869\u8045\u8397\u86FC\u8ECA\u8F66\u8FE0\u9819", "chen": "\u4F27\u5041\u5096\u512D\u55D4\u56AB\u5875\u588B\u5926\u5BB8\u5C18\u5FF1\u6116\u62BB\u6375\u6550\u6576\u6668\u66DF\u6815\u686D\u68A3\u68FD\u6987\u6A04\u6AEC\u6C88\u6C89\u7141\u722F\u741B\u75A2\u760E\u7628\u778B\u7876\u789C\u78E3\u79F0\u7A31\u7D9D\u81E3\u831E\u8380\u8390\u852F\u85BC\u87B4\u886C\u896F\u8A26\u8AC3\u8AF6\u8B13\u8B96\u8C0C\u8C36\u8CDD\u8D02\u8D81\u8D82\u8DBB\u8DC8\u8E38\u8ED9\u8FB0\u8FE7\u90F4\u91A6\u9202\u9356\u9648\u9673\u9703\u9DD0\u9E8E\u9F53\u9F54\u9F80", "cheng": "\u4E1E\u4E57\u4E58\u4FB1\u5041\u51C0\u51C8\u5448\u564C\u57CE\u57D5\u57E9\u5818\u584D\u5856\u5A0D\u5BAC\u5CF8\u5EB1\u5F8E\u609C\u60E9\u6186\u6195\u61F2\u6210\u627F\u62A2\u6330\u6381\u63E8\u6436\u645A\u6490\u6491\u649C\u665F\u667F\u673E\u67A8\u67FD\u68D6\u68E6\u6909\u6A18\u6A55\u6A56\u6A59\u6A89\u6A99\u6C36\u6CDF\u6D06\u6D67\u6D7E\u6DE8\u6E97\u6F82\u6F84\u7013\u722F\u725A\u73F5\u73F9\u7424\u757B\u76DB\u7748\u77A0\u77C3\u7880\u79E4\u79F0\u7A0B\u7A31\u7A6A\u7A9A\u7AC0\u7B6C\u7D7E\u7DFD\u7F49\u812D\u837F\u86CF\u87F6\u88CE\u8AA0\u8BDA\u8D6A\u8D6C\u901E\u90D5\u9172\u92EE\u9397\u93FF\u9423\u943A\u94D6\u94DB\u9637\u9757\u9833\u9953\u9A01\u9A2C\u9A8B\u9BCE", "chi": "\u4F2C\u4F41\u4F88\u4F99\u4FFF\u50BA\u52C5\u52D1\u5319\u5376\u53F1\u53FA\u5403\u544E\u54E7\u557B\u55AB\u55E4\u5644\u566D\u577B\u5791\u5880\u599B\u5AB8\u5C3A\u5F1B\u5F68\u5F72\u5F73\u5FB2\u605C\u6065\u6157\u6178\u618F\u61D8\u6261\u62B6\u62F8\u6301\u6347\u645B\u6521\u6555\u65A5\u6758\u67C5\u67E2\u6A06\u6B3C\u6B6D\u6B6F\u6BA6\u6C60\u6CB6\u6E41\u6F26\u707B\u70BD\u70FE\u71BE\u72CB\u74FB\u75D3\u75F4\u75F8\u7608\u761B\u7661\u7719\u7735\u779D\u7AFE\u7B1E\u7B42\u7B88\u7B8E\u7BEA\u7C9A\u7D7A\u7FC4\u7FC5\u7FE4\u7FE8\u801B\u803B\u8094\u80E3\u80F5\u815F\u830C\u834E\u83ED\u8687\u86A9\u86B3\u87AD\u88B2\u88B3\u88ED\u892B\u8A35\u8A83\u8ABA\u8B18\u8C49\u8CBE\u8D64\u8D7F\u8DA9\u8DE2\u8E1F\u8FDF\u8FE1\u9045\u905F\u906B\u9072\u908C\u90D7\u9253\u9279\u9290\u9349\u96F4\u98ED\u996C\u99B3\u9A70\u9B51\u9D1F\u9D44\u9D92\u9D97\u9D99\u9DD8\u9E31\u9EB6\u9ED0\u9F52\u9F5D\u9F7F", "chong": "\u5145\u51B2\u5603\u5BA0\u5BF5\u5D07\u5D08\u5FB8\u5FE1\u6183\u61A7\u63F0\u644F\u6C96\u6D7A\u6D8C\u6F34\u721E\u73EB\u75CB\u79CD\u7DDF\u7F7F\u7FC0\u8202\u825F\u833A\u866B\u8769\u87F2\u885D\u8908\u8E56\u91CD\u9283\u94F3\u9680", "chou": "\u4E11\u4E12\u4EC7\u4FB4\u4FE6\u5062\u5114\u541C\u568B\u5A64\u5B26\u5E31\u5E6C\u601E\u60C6\u6101\u61E4\u62BD\u63AB\u640A\u677B\u677D\u6826\u68BC\u6906\u6BA0\u71FD\u7270\u72A8\u72AB\u7564\u7574\u7587\u7633\u7697\u76E9\u7785\u77C1\u7A20\u7B79\u7BD8\u7C4C\u7D2C\u7D52\u7DA2\u7EF8\u81ED\u81F0\u83D7\u85B5\u88EF\u8A76\u8B8E\u8B90\u8BEA\u8DFE\u8E0C\u8E8A\u905A\u9167\u916C\u9194\u919C\u91BB\u96D4\u96E0\u96E6\u9B57\u9B98", "chu": "\u4E8D\u4FF6\u5097\u50A8\u510A\u5132\u51E6\u51FA\u520D\u521D\u52A9\u53A8\u563C\u57F1\u5904\u5AB0\u5C80\u5E6E\u5EDA\u6035\u6149\u61B7\u6410\u6462\u6474\u654A\u65B6\u6775\u67F7\u6918\u695A\u696E\u698B\u6A17\u6A71\u6A7B\u6A9A\u6AC9\u6AD6\u6AE5\u6B2A\u6B5C\u6CCF\u6EC0\u6EC1\u6FCB\u70AA\u7293\u73FF\u7421\u74B4\u755C\u77D7\u7840\u790E\u7987\u7ACC\u7AD0\u7BE8\u7D40\u7ECC\u801D\u8021\u81C5\u82BB\u83C6\u84A2\u84AD\u85F8\u8655\u870D\u87F5\u891A\u89E6\u89F8\u8AD4\u8C56\u8C60\u8C99\u8D8E\u8E70\u8E87\u8E95\u9110\u924F\u92E4\u9504\u95A6\u9664\u96CF\u96DB\u9DB5\u9EDC\u9F63\u9F6D\u9F7C", "chua": "\u6B3B\u6B58", "chuai": "\u555C\u562C\u63E3\u640B\u6B3C\u8197\u81AA\u8E39", "chuan": "\u4E32\u4F20\u50B3\u50E2\u5276\u5598\u570C\u5DDB\u5DDD\u66B7\u692F\u693D\u6B42\u6C1A\u6C4C\u732D\u7394\u744F\u7A7F\u7BC5\u819E\u821B\u8221\u8229\u8239\u8348\u8CD7\u8E33\u8F32\u9044\u91E7\u948F\u9DA8", "chuang": "\u50B8\u5205\u521B\u5231\u524F\u5259\u5275\u55A0\u5647\u5E62\u5E8A\u6006\u6134\u6450\u6723\u6A66\u7240\u724E\u7255\u75AE\u7621\u78E2\u7A93\u7A97\u7ABB\u95D6\u95EF", "chui": "\u5015\u5439\u570C\u5782\u57C0\u60D9\u6376\u6425\u6858\u68F0\u690E\u69CC\u708A\u787E\u7BA0\u8144\u83D9\u9318\u939A\u9524\u9672\u9840\u9FA1", "chun": "\u5046\u5507\u583E\u5A8B\u60F7\u65FE\u6625\u6699\u6710\u6776\u693F\u69C6\u6A41\u6AC4\u6D71\u6DF3\u6E7B\u6EE3\u6F18\u7289\u7443\u7776\u7BBA\u7D14\u7EAF\u80AB\u8123\u819E\u829A\u83BC\u8405\u8436\u8493\u84F4\u877D\u8822\u8CF0\u8F34\u9187\u9195\u931E\u9659\u9BD9\u9C06\u9D89\u9D9E\u9E51", "chuo": "\u5437\u54FE\u555C\u56BD\u5A15\u5A16\u5A65\u5A7C\u5B4E\u60D9\u6233\u62FA\u64C9\u6B60\u6DB0\u6DD6\u78ED\u7BB9\u7DBD\u7E5B\u7EF0\u8DA0\u8E00\u8E14\u8F1F\u8F8D\u8FB5\u8FB6\u9034\u916B\u92DC\u93C3\u9461\u991F\u9F6A\u9F8A", "ci": "\u4F3A\u4F4C\u4F7D\u5068\u5179\u523A\u523E\u5470\u5472\u5559\u5790\u5B28\u5DEE\u5E9B\u6148\u673F\u67CC\u6828\u6B21\u6B64\u6CDA\u6FE8\u73BC\u73C1\u74F7\u7506\u75B5\u7689\u78C1\u7920\u7960\u7CCD\u7D58\u7E12\u8308\u8326\u8328\u83BF\u858B\u86D3\u8786\u8800\u8A5E\u8BCD\u8CDC\u8D50\u8D80\u8DD0\u8F9D\u8F9E\u8FA4\u8FAD\u96CC\u98FA\u9908\u9AB4\u9ACA\u9B86\u9D1C\u9DBF\u9DC0\u9E5A\u9F79", "cong": "\u4E1B\u4ECE\u5306\u53E2\u56EA\u56F1\u5A43\u5B6E\u5F93\u5F94\u5F96\u5F9E\u5FE9\u6031\u60A4\u60B0\u6121\u6152\u6181\u66B0\u679E\u68C7\u6964\u6A05\u6A2C\u6A37\u6B09\u6DD9\u6F0E\u6F17\u6F40\u6F48\u6F68\u7047\u7127\u719C\u721C\u742E\u747D\u7481\u779B\u7882\u7BF5\u7E71\u8061\u8066\u806A\u8070\u82C1\u8310\u8471\u84EF\u8525\u85C2\u87CC\u8AB4\u8B25\u8CE8\u8CE9\u931D\u936F\u93D3\u93E6\u9A18\u9A44\u9AA2", "cou": "\u50B6\u51D1\u6971\u6E4A\u8160\u8F33\u8F8F", "cu": "\u4FC3\u5352\u5648\u5AA8\u5F82\u601A\u61B1\u6A7B\u6B82\u731D\u7604\u762F\u76BB\u7C07\u7C97\u7E2C\u8128\u851F\u89D5\u8A8E\u8D8B\u8D97\u8DA3\u8DA8\u8E27\u8E3F\u8E59\u8E74\u8E75\u9162\u918B\u9863\u9E81\u9E84\u9E86\u9EA4\u9F00", "cuan": "\u5DD1\u64BA\u6512\u651B\u6522\u6AD5\u6B11\u6BA9\u6C46\u6FFD\u7052\u71B6\u7228\u7A73\u7A9C\u7ABD\u7ABE\u7AC4\u7BE1\u7C12\u8E7F\u8EA5\u9142\u9147\u92D1\u9479\u9569", "cui": "\u4F1C\u5005\u50AC\u51D7\u5550\u555B\u5894\u5D12\u5D14\u5D5F\u5FF0\u60B4\u615B\u6467\u690A\u69B1\u69EF\u6BF3\u6DEC\u6F3C\u6FE2\u7120\u71A3\u7355\u7417\u7480\u75A9\u7601\u76A0\u78EA\u7AC1\u7C8B\u7CB9\u7D23\u7DB7\u7E17\u7F1E\u7FC6\u7FE0\u8103\u8106\u813A\u81AC\u81B5\u81CE\u8403\u8870\u894A\u8DA1\u93D9\u96B9\u9847", "cun": "\u4F9F\u520C\u540B\u58FF\u5B58\u5BF8\u5FD6\u62F5\u6751\u6F8A\u76B4\u7AF4\u7C7F\u81A5\u8E06\u8E72\u90A8", "cuo": "\u5249\u5252\u539D\u590E\u5D6F\u5D73\u5EB4\u632B\u63AA\u6413\u64AE\u68E4\u7473\u75E4\u7625\u7749\u77EC\u78CB\u7E12\u811E\u839D\u83A1\u84AB\u84CC\u8516\u8658\u8ACE\u8E49\u902A\u9073\u9142\u9147\u919D\u92BC\u932F\u9388\u9509\u9519\u9E7A\u9E7E", "da": "\u4EA3\u5273\u5312\u547E\u5491\u54D2\u55D2\u5660\u57AF\u58B6\u5927\u59B2\u601B\u60EE\u619A\u6253\u642D\u6498\u6C4F\u6C93\u6E9A\u709F\u71F5\u7557\u7563\u75B8\u7629\u7714\u7B1A\u7B2A\u7B54\u7E68\u7F8D\u8037\u8345\u8359\u8598\u87FD\u8921\u8A5A\u8DF6\u8FBE\u8FCF\u8FD6\u8FDA\u9039\u9054\u9389\u939D\u943D\u977C\u9791\u97C3\u9F96\u9F98\u9FCE", "dai": "\u4EE3\u4FA2\u50A3\u53C7\u5446\u5454\u5788\u57ED\u5927\u5CB1\u5E12\u5E26\u5E2F\u5E36\u5ED7\u5F85\u6020\u61DB\u6234\u66C3\u67CB\u68E3\u6B79\u6B86\u6BD2\u703B\u7343\u73B3\u7447\u7519\u7B89\u7C24\u7D3F\u7DFF\u7ED0\u825C\u86AE\u8773\u888B\u8976\u8A52\u8BD2\u8CA3\u8CB8\u8D37\u8DE2\u8E5B\u8ED1\u8EDA\u8EE9\u8F6A\u8FE8\u902E\u91F1\u96B8\u9734\u9746\u99D8\u9A80\u9B98\u9D0F\u9EDB\u9EF1", "dan": "\u4E39\u4E3C\u4EB6\u4F14\u4F46\u50E4\u510B\u5210\u52EF\u5330\u5355\u5358\u547E\u550C\u5556\u5557\u557F\u55AE\u563E\u5649\u56AA\u5989\u5A85\u5E0E\u5F39\u5F3E\u5F48\u60D4\u60EE\u6116\u619A\u61BA\u628C\u62C5\u63B8\u64A2\u64A3\u64D4\u65E6\u67E6\u6B9A\u6BAB\u6C2E\u6C8A\u6CF9\u6DE1\u6FB9\u71C0\u72DA\u73AC\u74ED\u7514\u758D\u75B8\u7605\u7649\u765A\u76BD\u7708\u77F3\u7803\u79AB\u7A9E\u7BAA\u7C1E\u7D1E\u7E75\u803C\u803D\u8043\u8078\u80C6\u8145\u81BB\u81BD\u840F\u84DE\u86CB\u8711\u8874\u891D\u894C\u89DB\u8A11\u8A95\u8BDE\u8CE7\u8D09\u8D55\u8EAD\u90F8\u9132\u9156\u9188\u972E\u9815\u9924\u994F\u99BE\u99F3\u9AE7\u9D20\u9ED5\u9EEE\u9EF5", "dang": "\u5052\u5105\u515A\u51FC\u5679\u5735\u57B1\u58CB\u5A78\u5B95\u5D35\u5D45\u5D63\u5F53\u6113\u6321\u64CB\u6529\u6863\u6A94\u6B13\u6C39\u6F52\u6FA2\u7059\u73F0\u7452\u7497\u74AB\u74FD\u7576\u76EA\u778A\u7800\u78AD\u7911\u7B5C\u7C1C\u7C39\u8261\u8361\u83EA\u8569\u862F\u87F7\u88C6\u8960\u8B61\u8B9C\u8C20\u8DA4\u903F\u943A\u94DB\u95E3\u96FC\u9EE8", "dao": "\u5012\u5200\u5202\u5230\u53E8\u5604\u5675\u58D4\u5BFC\u5C0E\u5C9B\u5CF6\u5D8B\u5D8C\u5DB9\u5E31\u5E6C\u5FC9\u60BC\u6363\u636F\u6417\u64E3\u6737\u68BC\u6921\u69DD\u6AA4\u6C18\u7118\u71FE\u74D9\u76D7\u76DC\u7977\u7982\u79B1\u7A32\u7A3B\u7B8C\u7D69\u7E9B\u7FE2\u7FFF\u8220\u8254\u83FF\u87A9\u885C\u885F\u88EF\u8E48\u8EC7\u8FBA\u9053\u91D6\u9666\u969D\u96AF\u9B5B\u9C7D", "de": "\u561A\u5730\u5DB3\u5E95\u5F97\u5FB3\u5FB7\u6074\u60B3\u60EA\u68CF\u6DC2\u7684\u8126\u86AE\u9340\u951D", "dei": "\u561A\u5F97", "den": "\u6265\u627D", "deng": "\u50DC\u51F3\u5654\u58B1\u5B01\u5D9D\u6195\u6225\u6AC8\u6F84\u7013\u706F\u71C8\u7492\u767B\u77AA\u78F4\u7AF3\u7B49\u7C26\u8260\u89B4\u8C4B\u8E6C\u9093\u9127\u9419\u956B\u96A5", "di": "\u4EFE\u4F4E\u4FE4\u5059\u50C0\u538E\u5467\u54CB\u5519\u5547\u5572\u5600\u5681\u5730\u5754\u5758\u577B\u57C5\u57CA\u57DE\u5824\u5886\u5891\u58AC\u5943\u5A23\u5A82\u5AE1\u5CBB\u5D7D\u5DB3\u5E1D\u5E95\u5EF8\u5F1F\u5F24\u5F7D\u601F\u6178\u625A\u62B5\u62DE\u638B\u63D0\u63E5\u6455\u654C\u6575\u65F3\u6755\u6791\u67A4\u67E2\u688A\u6891\u68E3\u6974\u6A00\u6C10\u6DA4\u6E27\u6ECC\u6EF4\u710D\u7274\u72C4\u7393\u73F6\u750B\u7590\u7684\u7731\u7747\u7825\u78AE\u78B2\u78FE\u7976\u7998\u79EA\u7B1B\u7B2C\u7BF4\u7C74\u7CF4\u7DE0\u7F14\u7F9D\u7FDF\u805C\u8091\u8163\u82D0\u82D6\u830B\u837B\u83C2\u83E7\u8482\u84E7\u850B\u8510\u8515\u85E1\u8743\u876D\u87AE\u889B\u89BF\u89CC\u89DD\u8A46\u8ADF\u8AE6\u8BCB\u8C1B\u8C74\u8D86\u8E36\u8E62\u8EE7\u8FEA\u9012\u9013\u9046\u905E\u9069\u9070\u90B8\u91F1\u926A\u93D1\u955D\u963A\u9684\u976E\u97AE\u9814\u99B0\u9AB6\u9AE2\u9BF3\u9E10", "dia": "\u55F2", "dian": "\u4F43\u508E\u5178\u53A7\u56B8\u576B\u57AB\u588A\u58C2\u594C\u5960\u5A5D\u5A70\u5D6E\u5DC5\u5DD3\u5DD4\u5E97\u60E6\u6242\u6382\u6527\u6541\u655F\u6923\u69C7\u69D9\u6A42\u6A5D\u6BBF\u6DC0\u6EC7\u6FB1\u70B9\u73B7\u7414\u7535\u7538\u75C1\u75F6\u7628\u765C\u766B\u7672\u7898\u7AB4\u7C1F\u84A7\u8547\u8714\u8DD5\u8E2E\u8E4E\u923F\u94BF\u963D\u96FB\u975B\u985A\u985B\u98A0\u9A54\u9EDE\u9F7B", "diao": "\u4F04\u51CB\u5201\u521F\u53FC\u540A\u595D\u5C4C\u5F14\u5F34\u5F6B\u625A\u6389\u6906\u6C48\u7431\u7639\u76C4\u7797\u7889\u7A8E\u7AB5\u7AE8\u7C13\u7D69\u84E7\u85CB\u866D\u86C1\u8A0B\u8A82\u8ABF\u8C03\u8C82\u91E3\u921F\u929A\u92B1\u92FD\u932D\u9443\u9493\u94DE\u94EB\u96D5\u96FF\u9B61\u9B89\u9BDB\u9CB7\u9CE5\u9CED\u9D70\u9F26", "die": "\u4F5A\u53E0\u54A5\u54CB\u5551\u558B\u57A4\u581E\u5CCC\u5D3C\u5D7D\u5E49\u6022\u604E\u60F5\u621C\u6315\u63F2\u6633\u66E1\u67E3\u696A\u69E2\u6B9C\u6C0E\u6CC6\u7239\u7243\u7252\u74DE\u7573\u7582\u7589\u758A\u7723\u7730\u789F\u7D70\u7ED6\u800A\u800B\u80C5\u81F7\u8253\u82F5\u8728\u8776\u87B2\u890B\u893A\u8A44\u8ADC\u8C0D\u8D83\u8DCC\u8DD5\u8DEE\u8E40\u8EFC\u8FED\u957B\u97A2\u9C08\u9CBD\u9D29", "ding": "\u4E01\u4EC3\u53EE\u5576\u5975\u5B9A\u5D7F\u5E04\u5FCA\u639F\u6917\u6FCE\u738E\u753A\u753C\u7594\u76EF\u77F4\u7887\u78A0\u78F8\u8035\u8062\u815A\u827C\u8423\u85A1\u8670\u874A\u8A02\u8BA2\u914A\u91D8\u92CC\u9320\u9424\u9489\u94E4\u952D\u976A\u9802\u9841\u9876\u98E3\u9964\u9F0E\u9F11", "diu": "\u4E1F\u4E22\u92A9\u94E5\u98A9", "dong": "\u4E1C\u4F97\u5032\u50CD\u51AC\u51BB\u51CD\u52A8\u52D5\u52ED\u549A\u578C\u57EC\u58A5\u59DB\u5A3B\u5B1E\u5CBD\u5CD2\u5D20\u5D2C\u5F9A\u606B\u61C2\u6219\u630F\u63F0\u6638\u6771\u680B\u68DF\u6C21\u6C2D\u6D1E\u6DB7\u6E69\u70D4\u71D1\u72EA\u7850\u7B17\u7BBD\u7D67\u80E8\u80F4\u8156\u82F3\u83C4\u8463\u856B\u8740\u8ACC\u8FF5\u9718\u99E7\u9B97\u9BDF\u9D87\u9DAB\u9E2B\u9F15", "dou": "\u4E67\u4FB8\u515C\u5160\u540B\u543A\u5517\u551E\u6296\u6597\u65A3\u6793\u68AA\u6A77\u6BED\u6D62\u6E0E\u7006\u72F5\u75D8\u7797\u7AA6\u7AC7\u7BFC\u8130\u8373\u8538\u86AA\u8BFB\u8C46\u9017\u90D6\u90FD\u9158\u9204\u92C0\u94AD\u9597\u95D8\u9627\u9661\u9916\u997E\u9B25\u9B26\u9B2A\u9B2C\u9B2D", "du": "\u51DF\u5262\u5335\u53BE\u561F\u5835\u5992\u59AC\u59E4\u5B3B\u5EA6\u6581\u6675\u668F\u675C\u691F\u6ADD\u6BAC\u6BB0\u6BD2\u6D9C\u6E0E\u6E21\u7006\u724D\u7258\u728A\u72A2\u72EC\u7368\u743D\u74C4\u76BE\u7763\u7779\u79FA\u7AFA\u7B03\u7BE4\u809A\u828F\u8370\u8799\u8827\u8839\u88FB\u89A9\u8AAD\u8B80\u8B9F\u8BFB\u8C44\u8CED\u8D15\u8D4C\u90FD\u918F\u9316\u934D\u945F\u9540\u95CD\u9607\u976F\u97C7\u97E3\u97E5\u9813\u987F\u9A33\u9AD1\u9EE9\u9EF7", "duan": "\u5073\u526C\u5845\u5A8F\u65AD\u65B7\u6934\u6BB5\u6BC8\u7145\u7456\u77ED\u78AB\u7AEF\u7C16\u7C6A\u7DDE\u7F0E\u8011\u8176\u846E\u890D\u8E96\u935B\u9374\u953B", "dui": "\u514A\u514C\u5151\u554D\u5796\u5806\u5860\u5BF9\u5BFE\u5C0D\u603C\u619D\u619E\u61DF\u6553\u655A\u6566\u6778\u6FE7\u6FFB\u7022\u7029\u75FD\u7893\u78D3\u794B\u7D90\u85B1\u8B48\u8B75\u8F5B\u8FFD\u9413\u941C\u9566\u961F\u966E\u968A\u9827\u9D2D", "dun": "\u4F05\u5428\u5678\u56E4\u5749\u58A9\u58AA\u58AB\u5E89\u5FF3\u60C7\u619E\u6489\u64B4\u6566\u696F\u6A54\u6C8C\u6F61\u7096\u71C9\u729C\u7364\u76F9\u76FE\u7818\u78B7\u7905\u8733\u8DB8\u8E32\u8E72\u8E7E\u8E89\u9007\u9041\u906F\u920D\u949D\u9566\u9813\u987F\u9A50", "duo": "\u4EB8\u4EDB\u51D9\u5234\u5241\u525F\u526B\u5484\u54C6\u54DA\u55A5\u5689\u56B2\u579B\u579C\u57F5\u5815\u58AE\u58AF\u591A\u591B\u593A\u596A\u5972\u5AA0\u5C2E\u5D1C\u5EA6\u60F0\u619C\u6305\u6306\u6387\u6553\u655A\u6560\u656A\u6735\u6736\u6755\u675D\u67A4\u67C1\u67C2\u67EE\u6857\u692F\u6BF2\u6CB0\u6CB2\u7553\u75E5\u787E\u7D9E\u7F0D\u8235\u88B3\u88F0\u8D93\u8DE2\u8DE5\u8DFA\u8E31\u8EB1\u8EB2\u8EC3\u922C\u9438\u94CE\u964A\u964F\u968B\u9693\u96B3\u98FF\u9973\u99B1\u99C4\u9A6E\u9D7D", "e": "\u4FC4\u5054\u50EB\u530E\u537E\u5384\u542A\u5443\u545D\u54A2\u54B9\u54E6\u555E\u5641\u5669\u56EE\u57A9\u580A\u5828\u582E\u59B8\u59BF\u59F6\u5A25\u5A3E\u5A3F\u5A40\u5C59\u5C8B\u5CC9\u5CE8\u5CE9\u5D3F\u5EC5\u6076\u60AA\u60E1\u6115\u6239\u627C\u6415\u6424\u6439\u64DC\u654B\u6799\u6AEE\u6B38\u6B5E\u6B7A\u6D1D\u6D90\u6E42\u73F4\u7427\u75F7\u75FE\u7692\u774B\u7808\u7810\u7828\u7846\u78C0\u7918\u816D\u82CA\u83AA\u843C\u855A\u8685\u86FE\u8741\u89A8\u8A1B\u8A90\u8AE4\u8B4C\u8B8D\u8BB9\u8C14\u8C5F\u8EDB\u8EF6\u8F6D\u8FD7\u904C\u904F\u907B\u9102\u920B\u922A\u92E8\u9354\u9469\u9507\u9537\u95BC\u960F\u9628\u9638\u963F\u980B\u981E\u981F\u984D\u984E\u989A\u989D\u9913\u9929\u997F\u9A00\u9B64\u9C10\u9C2A\u9C77\u9CC4\u9D48\u9D5D\u9D5E\u9D9A\u9E45\u9E57\u9F43\u9F76", "ei": "\u6B38\u8A92\u8BF6", "en": "\u5940\u5CCE\u6069\u6441\u717E\u84BD", "eng": "\u97A5", "er": "\u4E8C\u4F74\u4F95\u513F\u5150\u5152\u5235\u54A1\u5532\u5C12\u5C13\u5C14\u5CCF\u5F0D\u5F10\u6752\u682D\u682E\u6895\u6A32\u6BE6\u6D0F\u6D31\u723E\u73E5\u7CAB\u800C\u800F\u8033\u804F\u80F9\u834B\u85BE\u8848\u88BB\u8A80\u8CAE\u8CB3\u8D30\u8DB0\u8F00\u8F5C\u8FE9\u9087\u927A\u94D2\u9651\u96AD\u990C\u9975\u99EC\u9AF5\u9AF6\u9B9E\u9C95\u9D2F\u9E38", "fa": "\u4E4F\u4F10\u4F71\u50A0\u51B9\u53D1\u577A\u57A1\u58A2\u59C2\u5CDC\u5F42\u6830\u6A43\u6CB7\u6CD5\u6D4C\u704B\u73D0\u743A\u75BA\u767A\u767C\u7782\u781D\u7B29\u7B4F\u7F5A\u7F70\u7F78\u8337\u855F\u85C5\u9166\u9197\u91B1\u9345\u95A5\u9600\u9AEA\u9AEE", "fan": "\u4EEE\u51E1\u51E2\u51E3\u52EB\u5325\u53CD\u5643\u58A6\u597F\u5A4F\u5B0E\u5B0F\u5E06\u5E61\u5FDB\u61A3\u6255\u62DA\u65D9\u65DB\u674B\u67C9\u6873\u68B5\u68E5\u6A0A\u6A4E\u6C3E\u6C4E\u6CDB\u6EFC\u702A\u703F\u70E6\u7169\u71D4\u72AF\u72BF\u74A0\u7548\u7568\u756A\u76D5\u77FE\u792C\u7B32\u7B35\u7BC4\u7C53\u7C75\u7DD0\u7E41\u7E59\u7FB3\u7FFB\u81B0\u8224\u8227\u8303\u8543\u85A0\u85E9\u8629\u881C\u894E\u8A09\u8CA9\u8D29\u8E6F\u8ED3\u8EEC\u8F3D\u8F53\u8FD4\u91E9\u9407\u9422\u9492\u98BF\u98DC\u98EF\u98F0\u996D\u9C55\u9DED", "fang": "\u4EFF\u5023\u531A\u574A\u57C5\u580F\u59A8\u5F77\u623F\u653E\u65B9\u65CA\u6609\u6618\u678B\u6C78\u6DD3\u7265\u74EC\u7706\u772A\u794A\u7D21\u7EBA\u80AA\u822B\u82B3\u8684\u8A2A\u8BBF\u8DBD\u90A1\u9201\u933A\u94AB\u9632\u9AE3\u9B74\u9C82\u9D0B\u9DAD", "fei": "\u4FF7\u5255\u532A\u539E\u5420\u5561\u595C\u5983\u5A53\u5A54\u5C5D\u5E9F\u5EC3\u5EE2\u60B1\u6249\u6590\u6632\u6683\u66CA\u670F\u676E\u67F9\u68D0\u69A7\u6A43\u6A68\u6AE0\u6CB8\u6DDD\u6E04\u6FF7\u72BB\u72D2\u7306\u75BF\u75F1\u7648\u7829\u7B30\u7BDA\u7DCB\u7EEF\u7FE1\u80A5\u80BA\u80C7\u80CF\u80D0\u8153\u82BE\u83F2\u8409\u855C\u871A\u8730\u87E6\u88F6\u8AB9\u8BFD\u8CBB\u8D39\u9428\u9544\u966B\u970F\u9745\u975E\u975F\u98DB\u98DD\u98DE\u9925\u99A1\u9A11\u9A1B\u9BE1\u9CB1\u9F23", "fen": "\u4EFD\u507E\u50E8\u5206\u5429\u5674\u5746\u574B\u575F\u58B3\u594B\u596E\u59A2\u5C8E\u5E09\u5E69\u5F05\u5FFF\u6124\u61A4\u6610\u6706\u670C\u678C\u68A4\u68FB\u68FC\u6A68\u6C1B\u6C7E\u6FC6\u7035\u7083\u711A\u71CC\u71D3\u7356\u73A2\u7793\u780F\u79CE\u7AD5\u7C89\u7CAA\u7CDE\u7D1B\u7EB7\u7F92\u7FB5\u7FC2\u81B9\u82AC\u84B6\u8561\u86A0\u86A1\u886F\u8A1C\u8C6E\u8C76\u8EAE\u8F52\u915A\u9216\u943C\u96AB\u96F0\u9934\u9959\u999A\u99A9\u9B75\u9C5D\u9CBC\u9CFB\u9EC2\u9EFA\u9F16\u9F22", "feng": "\u4E30\u4EF9\u4FF8\u5051\u50FC\u51AF\u51E4\u51E8\u51EC\u51EE\u552A\u57C4\u5838\u5906\u5949\u59A6\u5BF7\u5C01\u5CEF\u5CF0\u5D36\u6453\u67AB\u687B\u6953\u6A92\u6CA3\u6CA8\u6D72\u6E22\u6E57\u6E84\u6F28\u7043\u7090\u70FD\u7128\u7148\u71A2\u728E\u7326\u7412\u75AF\u760B\u76FD\u781C\u78B8\u7BC8\u7D98\u7E2B\u7F1D\u8242\u8391\u8451\u8634\u8702\u882D\u8982\u8AF7\u8BBD\u8C50\u8CF5\u8D57\u9022\u9137\u9146\u92D2\u93BD\u93E0\u950B\u973B\u974A\u98A8\u98CC\u98CE\u99AE\u9CEF\u9CF3\u9D0C\u9EB7", "fo": "\u4ECF\u4EF8\u4F5B\u5772\u68BB", "fou": "\u4E0D\u5426\u599A\u6B95\u70B0\u7D11\u7F36\u7F39\u7F3B\u96EC\u9D00", "fu": "\u4E40\u4E76\u4ED8\u4F0F\u4F15\u4F5B\u4FCC\u4FD8\u4FDB\u4FEF\u5069\u5085\u51A8\u51EB\u521C\u526F\u5310\u544B\u5452\u5488\u5490\u54F9\u5638\u577F\u5798\u57BA\u590D\u592B\u5987\u598B\u59C7\u5A10\u5A4F\u5A66\u5A8D\u5B14\u5B5A\u5B75\u5B93\u5BCC\u5C03\u5CAA\u5CCA\u5DFF\u5E17\u5E45\u5E5E\u5E9C\u5F17\u5F23\u5F7F\u5FA9\u6024\u602B\u61EF\u6255\u6276\u6299\u629A\u62C2\u62CA\u634A\u636C\u64AB\u6577\u65A7\u65C9\u670D\u678E\u67B9\u67CE\u67EB\u67ED\u683F\u6874\u68F4\u6928\u6931\u6991\u6C1F\u6CED\u6D11\u6D6E\u6DAA\u6ECF\u6F93\u70A5\u70F0\u7124\u7236\u739E\u73B8\u7408\u74B7\u752B\u7536\u7549\u7550\u7557\u7641\u76D9\u7806\u7829\u7953\u7954\u798F\u79A3\u79FF\u7A03\u7A2A\u7ACE\u7B26\u7B30\u7B5F\u7B81\u7B99\u7C20\u7CB0\u7CD0\u7D28\u7D31\u7D3C\u7D65\u7D8D\u7D92\u7DEE\u7E1B\u7E80\u7EC2\u7ECB\u7F1A\u7F58\u7F66\u7FC7\u80A4\u80D5\u812F\u8150\u8151\u8179\u819A\u8240\u8274\u8299\u82A3\u82BE\u82FB\u8300\u832F\u8342\u8374\u83A9\u83D4\u842F\u844D\u84F2\u8567\u8659\u86A5\u86A8\u86B9\u86D7\u8705\u8709\u875C\u8760\u876E\u886D\u889A\u889D\u88B1\u8907\u8914\u8946\u8965\u8984\u8986\u8A03\u8A42\u8AE8\u8BA3\u8C67\u8CA0\u8CE6\u8CFB\u8D1F\u8D4B\u8D59\u8D74\u8DBA\u8DD7\u8E3E\u8F14\u8F39\u8F3B\u8F85\u8F90\u909E\u90D9\u90DB\u911C\u915C\u91DC\u91E1\u9207\u9258\u925C\u9351\u9362\u961C\u961D\u9644\u97CD\u97E8\u982B\u98AB\u98B0\u99A5\u99D9\u9A78\u9AF4\u9B34\u9B84\u9B92\u9BB2\u9C12\u9C8B\u9CC6\u9CE7\u9CEC\u9CFA\u9D14\u9D69\u9D9D\u9EA9\u9EAC\u9EB1\u9EB8\u9EFB\u9EFC", "ga": "\u4F3D\u5477\u5496\u560E\u5620\u5676\u5939\u593E\u5C15\u5C1C\u5C2C\u621B\u65EE\u738D\u80F3\u8ECB\u8F67\u91D3\u9337\u9486\u9B40", "gai": "\u4E10\u4E62\u4F85\u5303\u5304\u5793\u59DF\u5CD0\u5FCB\u6224\u6461\u6539\u6650\u675A\u6982\u69E9\u69EA\u6E89\u6F11\u74C2\u7561\u76D6\u78D1\u7974\u7D60\u7D6F\u80F2\u82A5\u8344\u8462\u84CB\u8A72\u8BE5\u8C65\u8CC5\u8CCC\u8D45\u90C2\u9223\u9499\u9654\u9691", "gan": "\u4E7E\u4EE0\u4F44\u501D\u51CE\u51F2\u5481\u5769\u5C32\u5C34\u5C36\u5C37\u5E72\u5E79\u5FD3\u611F\u64C0\u653C\u6562\u65F0\u6746\u67D1\u687F\u69A6\u6A44\u6A8A\u6C75\u6CD4\u6DE6\u6F27\u6F89\u6FB8\u7068\u7395\u73B5\u7518\u75B3\u76AF\u76F0\u77F8\u79C6\u7A08\u7AFF\u7B34\u7B78\u7BE2\u7C33\u7C93\u7D3A\u7EC0\u809D\u8289\u82F7\u8677\u8866\u8A4C\u8D11\u8D1B\u8D63\u8D76\u8D95\u8FC0\u9150\u9AAD\u9B50\u9C64\u9CE1\u9CF1", "gang": "\u4EA2\u5188\u51AE\u521A\u525B\u5808\u583D\u5C97\u5CA1\u5D17\u6205\u6206\u6207\u625B\u6386\u6443\u6760\u68E1\u69D3\u6E2F\u7135\u7139\u7268\u7285\u72BA\u7598\u77FC\u7899\u7B7B\u7DB1\u7EB2\u7F38\u7F41\u7F61\u809B\u91ED\u92FC\u93A0\u94A2\u9FCD", "gao": "\u52C2\u543F\u544A\u5930\u5CFC\u641E\u6772\u69C0\u69C1\u69D4\u69F9\u6A70\u6ABA\u6ADC\u734B\u768B\u7690\u776A\u777E\u796E\u7970\u799E\u7A01\u7A3E\u7A3F\u7B76\u7BD9\u7CD5\u7E1E\u7F1F\u7F94\u7F99\u818F\u81EF\u83D2\u85C1\u85F3\u8AA5\u8BF0\u90DC\u92EF\u93AC\u9506\u9550\u97DF\u993B\u9AD8\u9AD9\u9DCE\u9DF1\u9F1B", "ge": "\u4E2A\u4E87\u4EE1\u4F6B\u4F6E\u500B\u5272\u530C\u5404\u5408\u5424\u5444\u54AF\u54E5\u54FF\u55DD\u55F0\u5605\u572A\u5865\u5F41\u6105\u6208\u6213\u6228\u6262\u630C\u6401\u643F\u64F1\u654B\u683C\u69C5\u6ACA\u6B4C\u6EC6\u6ED2\u726B\u72B5\u7332\u7366\u7599\u76D6\u784C\u7B87\u7D07\u7EA5\u8090\u80F3\u8188\u81C8\u81F5\u8238\u8316\u845B\u84CB\u867C\u86D2\u86E4\u88BC\u88D3\u89E1\u8AFD\u8B0C\u8F35\u8F55\u927B\u9391\u9398\u93B6\u94EC\u9549\u95A3\u95A4\u9601\u9694\u9769\u9788\u97B7\u97D0\u97DA\u988C\u9979\u9A14\u9ABC\u9B32\u9BA5\u9BAF\u9C84\u9D1A\u9D3F\u9E3D", "gei": "\u7D66\u7ED9", "gen": "\u4E98\u4E99\u54CF\u63EF\u6404\u6839\u826E\u831B\u8DDF", "geng": "\u522F\u54FD\u57C2\u5829\u5CFA\u5E9A\u632D\u6685\u66F4\u6897\u6929\u6D6D\u713F\u754A\u7D59\u7D5A\u7D86\u7DEA\u7E06\u7EE0\u7FAE\u7FB9\u8015\u803F\u8384\u83EE\u8CE1\u8D53\u90E0\u9888\u9ABE\u9BC1\u9CA0\u9D8A\u9E52", "gong": "\u4F8A\u4F9B\u516C\u5171\u529F\u5311\u5314\u53B7\u551D\u55CA\u5868\u5BAB\u5BAE\u5DE5\u5DE9\u5E4A\u5EFE\u5F13\u606D\u6129\u6150\u62F1\u62F2\u653B\u675B\u6831\u6C5E\u6F92\u7195\u73D9\u7854\u78BD\u7BE2\u7CFC\u7CFF\u7D05\u7EA2\u7FBE\u80B1\u86A3\u89E5\u89F5\u8CA2\u8D1B\u8D21\u8EAC\u8EB3\u8F01\u92BE\u978F\u9AF8\u9F8F\u9F94\u9F9A", "gou": "\u4F5D\u508B\u5193\u52FE\u53E5\u5474\u5542\u5778\u57A2\u591F\u5920\u59E4\u5ABE\u5CA3\u5F40\u62D8\u6406\u6480\u6784\u67B8\u69CB\u6C9F\u6E9D\u7179\u72D7\u73BD\u75C0\u7B31\u7BDD\u7C3C\u7CD3\u7DF1\u7F11\u8007\u8008\u8009\u82B6\u82DF\u86BC\u88A7\u8920\u89AF\u89CF\u8A3D\u8A6C\u8BDF\u8C7F\u8CFC\u8D2D\u9058\u920E\u9264\u94A9\u96CA\u97B2\u97DD", "gu": "\u4F30\u50A6\u50F1\u51C5\u53E4\u5471\u5495\u5502\u5503\u5552\u55D7\u560F\u56FA\u580C\u5903\u59D1\u5AF4\u5B64\u5C33\u5D13\u5D2E\u5DEC\u5DED\u6018\u6132\u6262\u6287\u6545\u675A\u67E7\u688F\u68DD\u6996\u69BE\u6A6D\u6ACE\u6BC2\u6C69\u6CBD\u6CD2\u6DC8\u6FF2\u7014\u726F\u727F\u75FC\u76B7\u76BC\u76EC\u77BD\u78C6\u797B\u7A12\u7A40\u7B1F\u7B8D\u7B9B\u7BD0\u7CD3\u7E0E\u7F5B\u7F5F\u7F96\u80A1\u8135\u81CC\u82FD\u83C7\u83F0\u84C7\u85A3\u86C4\u86CA\u8831\u89DA\u8A41\u8BC2\u8C37\u8CC8\u8D3E\u8EF1\u8EF2\u8F42\u8F71\u8F9C\u9027\u9164\u9232\u9237\u932E\u94B4\u9522\u96C7\u9867\u987E\u9936\u9989\u9AA8\u9B95\u9BDD\u9CB4\u9D23\u9DBB\u9E2A\u9E44\u9E58\u9F13\u9F14", "gua": "\u518E\u522E\u5250\u526E\u5280\u5366\u53E7\u5471\u54BC\u5569\u576C\u5BE1\u62EC\u6302\u639B\u681D\u6870\u6B44\u7171\u74DC\u7D53\u7DFA\u7F63\u7F6B\u80CD\u88BF\u8902\u8A7F\u8AE3\u8BD6\u8D8F\u8E3B\u929B\u92BD\u94E6\u98AA\u98B3\u9A27\u9D30\u9E39", "guai": "\u4E56\u53CF\u592C\u602A\u6060\u62D0\u63B4\u67B4\u67FA\u7B89\u7F6B", "guan": "\u4E31\u500C\u5173\u51A0\u535D\u5B98\u60B9\u60BA\u60EF\u6163\u63BC\u645C\u65A1\u68FA\u6A0C\u6B1F\u6BCC\u6CF4\u6DAB\u6DC9\u6F45\u704C\u721F\u742F\u74AD\u74D8\u75EF\u761D\u764F\u76E5\u77D4\u77DC\u77DD\u7936\u797C\u7AA4\u7B66\u7BA1\u7DB8\u7EB6\u7F46\u7F50\u8218\u839E\u8484\u898C\u89B3\u89C0\u89C2\u8CAB\u8D2F\u8E80\u8F28\u9066\u9327\u93C6\u9475\u959E\u95A2\u95D7\u95DC\u96DA\u9928\u9986\u9C25\u9C5E\u9C79\u9CCF\u9CE4\u9E1B\u9E73", "guang": "\u4FC7\u50D9\u5149\u54A3\u5799\u59EF\u5E7F\u5E83\u5EE3\u6304\u6497\u6844\u6D38\u6F62\u706E\u7097\u709A\u709B\u70E1\u72B7\u7377\u73D6\u7844\u80F1\u81E6\u81E9\u832A\u8F04\u901B\u92A7\u9EC6", "gui": "\u4E80\u4F79\u5080\u523D\u523F\u528A\u528C\u5326\u532D\u532E\u5331\u53AC\u572D\u579D\u59AB\u59FD\u5AAF\u5AE2\u5B00\u5B84\u5DA1\u5DB2\u5DC2\u5E30\u5E8B\u5EAA\u5EC6\u5F52\u6051\u646B\u648C\u6530\u6531\u660B\u6677\u6739\u67DC\u6842\u6867\u691D\u6922\u69E3\u69F6\u69FB\u69FC\u6A3B\u6A9C\u6AC3\u6AF0\u6AF7\u6B78\u6C3F\u6E40\u6E8E\u7085\u7324\u73EA\u7470\u749D\u74CC\u7650\u7678\u7688\u7786\u77A1\u77B6\u7845\u796A\u79AC\u7A90\u7B40\u7C02\u7C0B\u80FF\u8325\u84D5\u862C\u86EB\u879D\u87E1\u88BF\u8958\u898F\u89C4\u89E4\u8A6D\u8BE1\u8CB4\u8D35\u8DB9\u8DEA\u8ECC\u8ED3\u8F68\u90BD\u90CC\u9400\u944E\u95A8\u95FA\u9652\u96DF\u97BC\u9A29\u9B36\u9B39\u9B3C\u9BAD\u9C56\u9C65\u9C91\u9CDC\u9CFA\u9F9C\u9F9F", "gun": "\u4E28\u60C3\u68CD\u6EDA\u6EFE\u7754\u78D9\u7DC4\u7DF7\u7EF2\u84D8\u8509\u886E\u889E\u88F7\u8B34\u8F25\u8F8A\u9B8C\u9BC0\u9CA7", "guo": "\u5459\u54BC\u556F\u5590\u5613\u56D7\u56EF\u56F6\u56FB\u56FD\u5700\u570B\u57DA\u581D\u588E\u5D1E\u5E3C\u5E57\u5F49\u5F4D\u60C8\u6156\u61D6\u63B4\u6451\u654B\u679C\u6901\u6947\u69E8\u6ACE\u6DA1\u6DC9\u6E26\u6F0D\u6FC4\u7313\u7611\u77CC\u7C02\u7CBF\u7DB6\u8052\u805D\u8142\u8158\u8195\u83D3\u852E\u8662\u873E\u8748\u87C8\u88F9\u8901\u8F20\u8FC7\u904E\u90ED\u921B\u934B\u9439\u9505\u991C\u9983\u9998", "ha": "\u54C8\u5964\u7D26\u867E\u86E4\u8766\u927F\u94EA", "hai": "\u4EA5\u548D\u54B3\u55D0\u55E8\u56A1\u5870\u598E\u5B69\u5BB3\u62F8\u6C26\u6D77\u70F8\u7332\u7D6F\u80F2\u84CB\u8FD8\u9084\u90C2\u917C\u91A2\u9900\u995A\u99ED\u99F4\u9A87\u9AB8", "han": "\u4E06\u4EE0\u4F44\u50BC\u516F\u51FD\u51FE\u5382\u5388\u542B\u54FB\u5505\u558A\u5705\u57BE\u5A22\u5AE8\u5BD2\u5C7D\u5D21\u5D45\u5FD3\u608D\u61A8\u61BE\u625E\u634D\u6496\u64BC\u653C\u65F0\u65F1\u6657\u6658\u66B5\u6892\u6937\u6B5B\u6C49\u6C57\u6C75\u6D5B\u6D6B\u6D86\u6DB5\u6F22\u6F8F\u701A\u710A\u7113\u71AF\u7233\u72B4\u7302\u7400\u751D\u7694\u7745\u7B12\u7B68\u7F55\u7FF0\u80A3\u839F\u83E1\u850A\u8677\u86B6\u86FF\u872C\u872D\u8792\u8B40\u8C3D\u8C43\u8F1A\u9097\u90AF\u9163\u91EC\u92B2\u92CE\u92E1\u9588\u95DE\u95EC\u961A\u96D7\u97D3\u97E9\u9807\u9837\u9844\u9878\u9894\u99A0\u99AF\u99FB\u9B7D\u9CF1\u9DBE\u9F3E", "hang": "\u4EA2\u542D\u57B3\u592F\u5994\u5DF7\u5FFC\u65BB\u676D\u6841\u6C86\u7B10\u7B55\u7D4E\u7ED7\u822A\u82C0\u86A2\u884C\u88C4\u8CA5\u8FD2\u909F\u980F\u9883\u9B67", "hao": "\u4E5A\u5090\u512B\u53F7\u547A\u54E0\u55E5\u5637\u5651\u5686\u568E\u58D5\u597D\u604F\u608E\u660A\u6626\u6667\u66A0\u66A4\u66AD\u66CD\u6903\u6BDC\u6BEB\u6D69\u6DCF\u6EC8\u6EDC\u6F94\u6FE0\u704F\u705D\u7346\u734B\u7354\u768B\u7693\u769C\u769E\u76A1\u76A5\u79CF\u7AD3\u7C47\u8017\u8055\u8320\u84BF\u8583\u8585\u85A7\u85C3\u865F\u869D\u8814\u8AD5\u8B79\u8C6A\u8C89\u90DD\u9117\u93AC\u9550\u9865\u98A2\u9C1D", "he": "\u4F55\u4F6B\u52BE\u5408\u5413\u5475\u548A\u548C\u54BC\u54EC\u555D\u559B\u559D\u55C3\u55EC\u5648\u5687\u578E\u58D1\u59C0\u5BC9\u5CC6\u60D2\u62B2\u6546\u66F7\u6705\u67C7\u6838\u6941\u6B31\u6BFC\u6CB3\u6DB8\u6E2E\u6F95\u7103\u7142\u7186\u7187\u71FA\u7200\u72E2\u7332\u764B\u76AC\u76C7\u76C9\u76CD\u76D2\u76D6\u788B\u7909\u79BE\u7BD5\u7C7A\u7CAD\u7D07\u7EA5\u7FEE\u7FEF\u82DB\u8377\u83CF\u8402\u84CB\u879B\u881A\u8894\u8910\u8988\u8A36\u8A38\u8A65\u8B1E\u8BC3\u8C88\u8C89\u8CC0\u8D3A\u8D6B\u90C3\u91DB\u924C\u9449\u95A1\u95A4\u95D4\u9602\u9616\u96BA\u974D\u974E\u974F\u97A8\u981C\u988C\u9904\u9978\u9B7A\u9C84\u9DA1\u9DAE\u9DB4\u9E16\u9E56\u9E64\u9EA7\u9F55\u9F81\u9FA2", "hei": "\u55E8\u563F\u6F76\u9ED1\u9ED2", "hen": "\u4F77\u54CF\u5677\u5F88\u6068\u62EB\u72E0\u75D5\u8A6A\u978E", "heng": "\u4EA8\u54FC\u5548\u583C\u59EE\u6046\u6052\u6099\u6497\u6841\u6A2A\u6A6B\u6DA5\u70C6\u73E9\u80FB\u811D\u8605\u884C\u8861\u9445\u9D34\u9D46\u9E3B", "hng": "\u54FC", "hong": "\u4EDC\u53B7\u53FF\u5430\u543D\u544D\u54C4\u551D\u55CA\u569D\u57AC\u5985\u5A02\u5B8F\u5B96\u5C78\u5DC6\u5F18\u5F4B\u6129\u6150\u63C8\u6494\u664E\u6C6F\u6C97\u6CD3\u6D2A\u6D64\u6D72\u6E31\u6E39\u6E84\u6F42\u6F92\u7074\u70D8\u7122\u7392\u739C\u74E8\u7854\u7861\u7AD1\u7AE4\u7BCA\u7CA0\u7D05\u7D18\u7D2D\u7D8B\u7EA2\u7EAE\u7FBE\u7FC3\u7FDD\u803E\u82F0\u836D\u8452\u8453\u857B\u85A8\u8679\u8A07\u8A0C\u8BA7\u8C39\u8C3C\u8C3E\u8EE3\u8F37\u8F5F\u8F70\u921C\u9277\u92BE\u92D0\u9367\u958E\u95A7\u95C0\u95C2\u95F3\u9710\u971F\u9783\u9B28\u9B5F\u9D3B\u9E3F\u9EC9\u9ECC", "hou": "\u4FAF\u5019\u539A\u540E\u543C\u543D\u5474\u5589\u5795\u5820\u5E3F\u5F8C\u6D09\u72BC\u7334\u760A\u777A\u77E6\u7BCC\u7CC7\u7FED\u7FF5\u8329\u8454\u8C5E\u9005\u90C8\u9107\u9297\u936D\u9931\u9ABA\u9B9C\u9BF8\u9C5F\u9C8E\u9C98\u9F41", "hu": "\u4E4E\u4E55\u4E6F\u4E92\u4FFF\u51B1\u5322\u532B\u547C\u548C\u552C\u553F\u5596\u55C0\u55C3\u5611\u561D\u569B\u56EB\u5780\u58F6\u58F7\u58FA\u59F1\u5A5F\u5AA9\u5AED\u5AEE\u5BE3\u5CB5\u5E0D\u5E60\u5F16\u5F27\u5FFD\u6018\u6019\u6057\u60DA\u620F\u622F\u6231\u6232\u6236\u6237\u6238\u623D\u6248\u6287\u62A4\u6430\u6462\u659B\u6608\u6612\u66F6\u6791\u6838\u695B\u695C\u69F2\u69F4\u6B51\u6C7B\u6C8D\u6CAA\u6CD8\u6D52\u6DF2\u6DF4\u6E56\u6EEC\u6EF8\u6EF9\u6FE9\u702B\u70C0\u7100\u7173\u71A9\u72D0\u7322\u7425\u745A\u74E0\u74E1\u74F3\u7910\u795C\u7B0F\u7BB6\u7C04\u7C90\u7CCA\u7D57\u7D94\u7E0E\u7E20\u80E1\u81B4\u8290\u8294\u82B4\u82F8\u8400\u846B\u851B\u8530\u864D\u864E\u8656\u865D\u8774\u879C\u885A\u89F3\u89F7\u8B3C\u8B77\u8BB8\u8C70\u8EE4\u8F77\u9120\u9190\u933F\u9359\u9378\u96BA\u96D0\u96FD\u9800\u9836\u992C\u9B0D\u9B71\u9BF1\u9C17\u9C6F\u9CE0\u9CF8\u9D60\u9D98\u9DA6\u9DAE\u9DBB\u9E0C\u9E44\u9E55\u9E58\u9E71", "hua": "\u5212\u5283\u5316\u534E\u542A\u545A\u54D7\u5629\u57D6\u593B\u59E1\u5A72\u5A73\u5AFF\u5B05\u5D0B\u6433\u6466\u64B6\u6779\u67A0\u6866\u691B\u69EC\u6A3A\u6ED1\u6F85\u733E\u753B\u756B\u7575\u7809\u7874\u78C6\u7CC0\u7E63\u8219\u82B1\u82B2\u83EF\u848A\u8550\u8624\u8796\u89DF\u8A71\u8AAE\u8AD9\u8AE3\u8B41\u8B6E\u8BDD\u8C41\u91EA\u91EB\u92D8\u9335\u93F5\u94E7\u9A4A\u9A85\u9DE8\u9ECA", "huai": "\u4F6A\u54B6\u574F\u58CA\u58DE\u5F8A\u6000\u61D0\u61F7\u69D0\u6AF0\u6DEE\u7024\u8032\u8639\u863E\u8922\u8931\u8E1D", "huan": "\u5524\u559A\u559B\u56BE\u571C\u57B8\u581A\u5942\u5950\u5B1B\u5B49\u5BA6\u5BCF\u5BF0\u5CD8\u5D48\u5E7B\u60A3\u610C\u61C1\u61FD\u6362\u63DB\u64D0\u650C\u6853\u6899\u69F5\u6B22\u6B53\u6B61\u6D39\u6D63\u6DA3\u6E19\u6F36\u6FA3\u6FB4\u70C9\u7115\u7165\u72BF\u72DF\u7342\u737E\u73AF\u744D\u74B0\u74DB\u75EA\u7613\u7746\u778F\u7CEB\u7D59\u7D84\u7DE9\u7E6F\u7F13\u7F33\u7FA6\u8092\u8341\u8408\u8411\u849D\u85E7\u8B99\u8C62\u8C72\u8C86\u8C9B\u8F58\u8FD8\u902D\u9084\u90C7\u9144\u9370\u9436\u953E\u956E\u95E4\u961B\u96C8\u96DA\u9A69\u9B1F\u9BC7\u9BF6\u9C00\u9CA9\u9D05\u9D4D\u9E6E", "huang": "\u505F\u5164\u51F0\u55A4\u582D\u5843\u58B4\u595B\u5A93\u5BBA\u5D32\u5DDF\u5E4C\u5FA8\u6033\u604D\u60F6\u6130\u614C\u63D8\u6643\u6644\u66C2\u671A\u697B\u69A5\u6ACE\u6C7B\u6E5F\u6EC9\u6F62\u70BE\u714C\u7180\u71BF\u735A\u745D\u749C\u7640\u7687\u769D\u76A9\u78FA\u7A54\u7BC1\u7C27\u7E28\u8093\u824E\u8352\u845F\u8757\u87E5\u8841\u8A64\u8AFB\u8B0A\u8C0E\u8DAA\u9051\u9360\u93A4\u9404\u953D\u968D\u97F9\u992D\u9A1C\u9C09\u9C51\u9CC7\u9DEC\u9EC3\u9EC4", "hui": "\u4F1A\u4F6A\u50E1\u5136\u532F\u5349\u54B4\u54D5\u5599\u5612\u5645\u5655\u5666\u5696\u56D8\u56DE\u56EC\u571A\u5815\u58AE\u5A4E\u5A88\u5B12\u5B48\u5BED\u5C76\u5C77\u5E51\u5EC6\u5EFB\u5EFD\u5F57\u5F59\u5F5A\u5FBB\u5FBD\u605A\u605B\u6062\u6075\u6094\u60E0\u6167\u6193\u61F3\u62FB\u6325\u63EE\u649D\u6656\u6666\u6689\u66B3\u6703\u6867\u6932\u694E\u69E5\u6A5E\u6A85\u6A93\u6A9C\u6AD8\u6BA8\u6BC0\u6BC1\u6BC7\u6C47\u6CCB\u6D03\u6D04\u6D4D\u6E4F\u6E83\u6ED9\u6F53\u6F70\u6FAE\u6FCA\u7008\u7070\u7073\u70E0\u70E3\u70E9\u7147\u71EC\u71F4\u7369\u73F2\u743F\u74A4\u74AF\u75D0\u7623\u7773\u77BA\u784A\u7988\u79FD\u7A62\u7BF2\u7D75\u7E62\u7E6A\u7ED8\u7F0B\u7FD9\u7FDA\u7FEC\u7FFD\u8294\u8334\u835F\u8527\u8559\u8588\u8589\u85F1\u8633\u867A\u8698\u86D4\u86D5\u8716\u879D\u87EA\u8886\u8918\u8A6F\u8A7C\u8AA8\u8AF1\u8B53\u8B6D\u8B7F\u8BB3\u8BD9\u8BF2\u8C57\u8CC4\u8D3F\u8F1D\u8F89\u8FF4\u9025\u928A\u93F8\u942C\u95E0\u9613\u9693\u96B3\u9767\u982E\u986A\u9892\u992F\u9BB0\u9C34\u9EBE", "hun": "\u4FD2\u5031\u5702\u5A5A\u5A6B\u5C21\u5FF6\u60DB\u6141\u638D\u660F\u662C\u68CD\u68D4\u6B99\u6D51\u6DBD\u6DF7\u6E3E\u6E63\u6E77\u6EB7\u7104\u711D\u73F2\u743F\u7703\u7767\u776F\u7774\u7888\u8364\u8477\u8512\u89E8\u8AE2\u8BE8\u8F4B\u95BD\u960D\u991B\u9984\u9B42\u9F32", "huo": "\u4F19\u4F78\u4FF0\u5268\u5290\u5419\u548C\u549F\u5590\u5684\u56AF\u56BF\u5925\u596F\u59E1\u5F60\u60D1\u6216\u6347\u639D\u64ED\u6509\u65E4\u66E4\u6AB4\u6C8E\u6D3B\u6E71\u6F37\u6FCA\u6FE9\u7016\u706B\u706C\u7177\u7372\u7668\u7713\u77C6\u77D0\u790A\u7978\u798D\u79EE\u79F3\u79F4\u7A6B\u7AA2\u7BE7\u8020\u802F\u81DB\u8267\u83B7\u84A6\u85FF\u8816\u8B0B\u8C41\u8CA8\u8D27\u8D8F\u90A9\u9225\u9343\u944A\u94AC\u952A\u956C\u9584\u96D8\u970D\u9743\u97C4\u9A1E", "ji": "\u4E0C\u4E2E\u4E41\u4E69\u4E9F\u4EBC\u4EBD\u4F0B\u4F0E\u4F76\u5048\u506E\u50DF\u5176\u517E\u5180\u51E0\u51FB\u5209\u520F\u5242\u525E\u5264\u5291\u52E3\u5359\u5373\u537D\u53CA\u53DD\u53FD\u5409\u54AD\u54DC\u5527\u559E\u55D8\u5630\u568C\u573E\u5756\u578D\u57FA\u5832\u5848\u5849\u58BC\u5947\u5980\u5993\u59DE\u59EC\u5AC9\u5B63\u5BC2\u5BC4\u5C10\u5C50\u5C70\u5C8C\u5D46\u5D47\u5D74\u5DAF\u5DF1\u5E3A\u5E7E\u5EB4\u5EED\u5F50\u5F51\u5F76\u5F9B\u5FCC\u5FE3\u6025\u60B8\u60CE\u6131\u61BF\u61E0\u61FB\u621F\u6222\u6280\u6324\u638E\u63E4\u6456\u6483\u64A0\u64BD\u64CA\u64DA\u64E0\u6532\u6567\u65E1\u65E2\u65E3\u66A8\u66A9\u66C1\u671E\u671F\u673A\u6781\u6785\u689E\u68D8\u6956\u696B\u6975\u69C9\u69E3\u6A2D\u6A5F\u6A76\u6A95\u6A9D\u6AB5\u6AC5\u6AED\u6B9B\u6BC4\u6C65\u6C72\u6CF2\u6D0E\u6D4E\u6DC1\u6E08\u6E52\u6F03\u6F08\u6F57\u6FC0\u6FC8\u6FDF\u7031\u710F\u7284\u72B1\u7391\u74A3\u74BE\u755F\u7578\u757F\u75BE\u75F5\u7620\u7660\u766A\u7680\u768D\u7789\u77F6\u78EF\u78FC\u796D\u799D\u79A8\u79EF\u7A18\u7A29\u7A37\u7A3D\u7A44\u7A4A\u7A4D\u7A56\u7A67\u7B04\u7B08\u7B53\u7B95\u7BBF\u7C0A\u7C0E\u7C4D\u7CFB\u7D00\u7D12\u7D1A\u7D66\u7D99\u7DA8\u7DC1\u7DDD\u7E3E\u7E4B\u7E6B\u7E7C\u7EA7\u7EAA\u7ED9\u7EE7\u7EE9\u7F09\u7F7D\u7F81\u7F87\u7F88\u8024\u802D\u808C\u810A\u818C\u81EE\u8265\u82A8\u82B0\u82D9\u830D\u8324\u8360\u846A\u84BA\u84DF\u8507\u8540\u857A\u858A\u85BA\u85C9\u860E\u862E\u863B\u8640\u866E\u874D\u878F\u87E3\u88DA\u8940\u894B\u8989\u898A\u89AC\u89CA\u89D9\u89ED\u8A08\u8A18\u8A8B\u8AC5\u8AD4\u8B4F\u8B64\u8BA1\u8BA5\u8BB0\u8BD8\u8C3B\u8CEB\u8CF7\u8D4D\u8D8C\u8D9E\u8DE1\u8DFB\u8DFD\u8E11\u8E16\u8E50\u8E5F\u8E8B\u8EA4\u8EB8\u8F2F\u8F5A\u8F91\u8FF9\u90C6\u9288\u92A1\u9324\u9353\u93F6\u9416\u9447\u9459\u9645\u969B\u96AE\u96C6\u96DE\u96E7\u9701\u9735\u973D\u9769\u978A\u97BF\u97F2\u98E2\u9951\u9965\u9A65\u9AA5\u9AFB\u9B3E\u9B55\u9B5D\u9B62\u9B65\u9B86\u9BDA\u9BFD\u9C36\u9C3F\u9C40\u9C6D\u9C7E\u9C9A\u9CAB\u9CEE\u9D4B\u9D8F\u9DBA\u9DC4\u9DD1\u9E04\u9E21\u9E61\u9E82\u9F4C\u9F4E\u9F4F\u9F50\u9F51", "jia": "\u4E6B\u4EF7\u4F3D\u4F73\u5047\u50A2\u50F9\u52A0\u53DA\u54FF\u550A\u5609\u560F\u573F\u57C9\u5939\u593E\u5A7D\u5AC1\u5B8A\u5BB6\u5CAC\u5E4F\u5F8D\u5FA6\u5FE6\u605D\u621B\u621E\u6274\u62B8\u62C1\u62EE\u631F\u633E\u659A\u659D\u67B6\u67B7\u689C\u6935\u698E\u69A2\u69DA\u6A9F\u6BE0\u6CC7\u6D43\u6D79\u728C\u7330\u7333\u73BE\u73C8\u7532\u75C2\u7615\u7A3C\u7B33\u7CD8\u801E\u80DB\u8125\u8175\u8304\u835A\u83A2\u846D\u86F1\u86FA\u8888\u88B7\u88CC\u8C6D\u8C91\u8CC8\u8D3E\u8DCF\u8DF2\u8FE6\u90CF\u90DF\u9240\u926B\u92CF\u93B5\u94BE\u94D7\u9553\u982C\u9830\u9889\u988A\u99D5\u9A7E\u9D10\u9D36\u9D4A\u9E9A", "jian": "\u4EF6\u4F9F\u4FED\u4FF4\u5039\u5065\u5094\u50E3\u50ED\u5109\u517C\u51BF\u51CF\u5251\u5263\u526A\u5271\u528D\u528E\u5292\u5294\u56CF\u56DD\u575A\u5805\u5811\u583F\u5879\u58B9\u5978\u59E6\u59E7\u5BCB\u5C16\u5E34\u5E75\u5EFA\u5F3F\u5F45\u5FA4\u60E4\u620B\u6214\u6229\u622C\u62E3\u6338\u6361\u63C0\u63C3\u63F5\u641B\u64BF\u64F6\u6515\u65D4\u6695\u6701\u67A7\u67EC\u682B\u6898\u68C0\u691C\u6937\u693E\u6957\u6997\u69DB\u6A2B\u6A4F\u6AA2\u6ABB\u6AFC\u6B7C\u6BB1\u6BB2\u6BFD\u6D0A\u6D45\u6DA7\u6E10\u6E1B\u6E54\u6E55\u6E85\u6F38\u6F97\u6FFA\u7010\u7033\u7038\u703D\u714E\u719E\u71B8\u724B\u726E\u728D\u730F\u73AA\u73D4\u744A\u7450\u76D1\u76E3\u7751\u7777\u77AF\u77B7\u77BC\u7877\u788A\u78B1\u78F5\u7900\u7906\u791B\u7937\u7A34\u7B15\u7B3A\u7B67\u7B80\u7B8B\u7BAD\u7BEF\u7C21\u7C48\u7C5B\u7CCB\u7D78\u7DD8\u7E11\u7E5D\u7E6D\u7F04\u7F23\u7FE6\u807B\u80A9\u8171\u81F6\u8230\u8266\u8270\u8271\u8327\u8350\u83C5\u83FA\u844C\u84B9\u852A\u8551\u8573\u85A6\u85C6\u8643\u87B9\u8812\u88B8\u88E5\u8947\u8949\u897A\u898B\u89B5\u89B8\u89C1\u8A43\u8AD3\u8AEB\u8B07\u8B2D\u8B5B\u8B7C\u8B7E\u8C0F\u8C2B\u8C5C\u8C63\u8CCE\u8CE4\u8D31\u8D9D\u8DBC\u8DC8\u8DF5\u8E10\u8E3A\u8E47\u8F5E\u91F0\u91FC\u9274\u92C4\u92D1\u92FB\u9373\u9375\u93AB\u93E9\u9417\u9427\u9431\u9451\u9452\u946C\u946F\u9473\u950F\u952E\u9592\u9593\u95F4\u96C3\u97AC\u97AF\u97C0\u97C9\u991E\u9930\u996F\u99A2\u9B0B\u9C0E\u9C14\u9C1C\u9C39\u9CA3\u9CD2\u9CFD\u9D51\u9D73\u9DBC\u9E63\u9E78\u9E7B\u9E7C\u9E89", "jiang": "\u508B\u50F5\u52E5\u531E\u5320\u5842\u58C3\u5905\u5956\u5968\u596C\u59DC\u5C06\u5C07\u5D79\u5F1C\u5F36\u5F37\u5F3A\u5F4A\u646A\u647E\u6868\u69F3\u6A7F\u6AE4\u6BAD\u6C5F\u6D1A\u6D46\u6E2F\u6EF0\u6F3F\u729F\u734E\u7555\u757A\u7585\u7586\u7913\u7CE1\u7CE8\u7D73\u7E6E\u7EDB\u7F30\u7FDE\u8029\u8199\u8333\u8441\u848B\u8523\u8591\u8679\u8780\u87BF\u8B1B\u8B3D\u8BB2\u8C47\u9171\u91A4\u91AC\u964D\u97C1\u985C\u9C42\u9CC9", "jiao": "\u4EA4\u4F7C\u4FA5\u50E5\u50EC\u510C\u527F\u528B\u52E6\u53EB\u544C\u55AC\u5602\u5604\u5610\u5626\u564D\u566D\u56BC\u59E3\u5A07\u5B0C\u5B13\u5B42\u5CE4\u5CE7\u5D95\u5DA0\u5DA3\u5FBA\u5FBC\u6054\u608E\u618D\u61A2\u61BF\u630D\u6322\u6341\u6405\u644E\u6477\u649F\u64B9\u652A\u654E\u6559\u656B\u657D\u657F\u658D\u65A0\u6648\u669E\u66D2\u6821\u6912\u6A14\u6D47\u6E6B\u6E6C\u6ED8\u6F16\u6F50\u6F86\u7042\u705A\u70C4\u7126\u714D\u71CB\u71DE\u721D\u72E1\u7365\u73D3\u74AC\u7644\u768E\u76A6\u76AD\u77EB\u77EF\u7901\u7A5A\u7A8C\u7A96\u7B05\u7B4A\u7C25\u7D5E\u7E73\u7E90\u7EDE\u7F34\u80F6\u811A\u8173\u81A0\u81B2\u81EB\u827D\u832D\u832E\u8549\u85E0\u8660\u86DF\u87DC\u87ED\u8990\u899A\u89BA\u89C9\u89D2\u8A06\u8B51\u8B65\u8CCB\u8DAD\u8DE4\u8E0B\u8F03\u8F47\u8F4E\u8F7F\u8F83\u90CA\u9175\u91AE\u91C2\u91E5\u9278\u940E\u94F0\u9903\u997A\u9A55\u9A84\u9BAB\u9C4E\u9C9B\u9D41\u9DE6\u9DEE\u9E6A\u9FA3", "jie": "\u4E2F\u4ECB\u4EF7\u501F\u5022\u5048\u507C\u5091\u50F9\u5226\u5227\u523C\u52AB\u52BC\u5369\u536A\u5424\u54DC\u5536\u5551\u5588\u55BC\u55DF\u568C\u5826\u583A\u5979\u598E\u59D0\u5A55\u5A8E\u5A98\u5AAB\u5AC5\u5B51\u5BB6\u5BC1\u5C10\u5C46\u5C4A\u5C8A\u5C95\u5D28\u5D51\u5D65\u5DB0\u5DB1\u5DBB\u5DC0\u5E6F\u5E8E\u5FA3\u6088\u6212\u622A\u6262\u62EE\u6377\u63A5\u63B2\u63B6\u63ED\u6429\u64D1\u64EE\u64F3\u65BA\u6605\u6762\u6770\u6840\u6854\u685D\u6904\u6950\u696C\u6976\u6977\u69A4\u6A9E\u6BD1\u6D01\u6D2F\u6E5D\u6ED0\u6F54\u716F\u7297\u72E4\u73A0\u743E\u744E\u754C\u754D\u758C\u7596\u75A5\u75CE\u7664\u7686\u776B\u780E\u78A3\u790D\u79F8\u7A2D\u7AED\u7BC0\u7D12\u7D50\u7D5C\u7ED3\u7FAF\u8024\u813B\u8282\u82A5\u83AD\u83E8\u84F5\u85C9\u86A7\u86E3\u86F6\u8710\u8754\u8818\u881E\u883D\u8857\u8871\u8878\u8893\u88B7\u88BA\u88D3\u892F\u89E3\u89E7\u8A10\u8A70\u8AA1\u8AB1\u8B2F\u8BA6\u8BD8\u8BEB\u8D8C\u8E15\u8FFC\u9263\u937B\u9385\u957C\u9636\u968E\u9782\u978A\u9821\u9889\u98F7\u9AB1\u9B6A\u9B9A\u9C92\u9D9B\u9DA1", "jin": "\u4EC5\u4ECA\u4ED0\u4F12\u4FAD\u50C5\u50F8\u5118\u51DA\u52A4\u52B2\u52C1\u537A\u53AA\u552B\u5664\u568D\u57D0\u5807\u583B\u5890\u58D7\u5997\u5A5C\u5AE4\u5B10\u5B27\u5BD6\u5C3D\u5DF9\u5DFE\u5ED1\u60CD\u616C\u6422\u65A4\u6649\u664B\u6783\u6997\u69FF\u6B4F\u6BA3\u6D25\u6D55\u6D78\u6E8D\u6F0C\u6FC5\u6FDC\u70EC\u7161\u71FC\u73D2\u740E\u743B\u7468\u747E\u74A1\u74B6\u76E1\u77DC\u77DD\u781B\u7972\u7981\u7AFB\u7B12\u7B4B\u7D1F\u7D27\u7DCA\u7E09\u7F19\u81F8\u8355\u8369\u83EB\u83F3\u84F3\u85CE\u887F\u895F\u89B2\u89D0\u89D4\u8B39\u8C28\u8CEE\u8D10\u8D46\u8FD1\u8FDB\u9032\u91D1\u91D2\u91FF\u9326\u9485\u9526\u9773\u9949\u9991\u99B8\u9E76\u9EC5\u9F7D", "jing": "\u4E3C\u4E95\u4EAC\u4EB0\u4FD3\u501E\u50B9\u5106\u5162\u51C0\u51C8\u522D\u5244\u52A4\u52B2\u52C1\u5753\u5755\u5759\u5883\u598C\u5A59\u5A5B\u5A67\u5B91\u5DE0\u5E5C\u5F2A\u5F33\u5F84\u5F91\u60CA\u61AC\u61BC\u64CF\u656C\u65CC\u65CD\u666F\u6676\u66BB\u66D4\u6871\u68B7\u6A78\u6B8C\u6B91\u6C6B\u6C6C\u6CFE\u6D44\u6D87\u6DE8\u6F8B\u701E\u7304\u734D\u7484\u749F\u74A5\u75C9\u75D9\u775B\u79D4\u7A09\u7A7D\u7ADE\u7ADF\u7AE7\u7AEB\u7AF6\u7AF8\u7B90\u7C87\u7CB3\u7CBE\u7D4C\u7D93\u7DA1\u7ECF\u8059\u80BC\u80EB\u811B\u8148\u830E\u8346\u834A\u8396\u83C1\u844F\u87FC\u8AA9\u8B66\u8E01\u8FF3\u9015\u92DE\u93E1\u955C\u9631\u9753\u9756\u9759\u975A\u975C\u981A\u9838\u9888\u9A5A\u9BE8\u9CB8\u9D5B\u9D81\u9D84\u9E96\u9EA0\u9F31", "jiong": "\u4FB0\u50D2\u5182\u518B\u518F\u56E7\u5770\u57DB\u6243\u6244\u6CC2\u6D7B\u6F83\u7085\u70AF\u70F1\u715A\u715B\u71B2\u71DB\u7A98\u7D45\u7D97\u81E6\u81E9\u860F\u8614\u8927\u8FE5\u9008\u9284\u9848\u988E\u99C9\u99EB", "jiu": "\u4E29\u4E45\u4E46\u4E5D\u4E63\u5003\u50E6\u5279\u52FC\u5313\u531B\u5336\u53A9\u548E\u557E\u597A\u5C31\u5EC4\u5ECF\u5ED0\u6166\u6344\u63C2\u63EA\u63EB\u644E\u6551\u65E7\u673B\u6766\u67E9\u67FE\u6855\u6A1B\u6B0D\u6BA7\u6C3F\u6C63\u7078\u725E\u7396\u759A\u7A35\u7A76\u7CFA\u7CFE\u7D24\u7EA0\u81FC\u8205\u820A\u820F\u841B\u8D73\u9152\u9579\u9604\u97ED\u97EE\u9B0F\u9B2E\u9BE6\u9CE9\u9DF2\u9E20\u9E6B\u9E94\u9F68", "ju": "\u4E14\u4E3E\u4E6C\u4F21\u4FB7\u4FE5\u4FF1\u5028\u5036\u50EA\u5177\u51E5\u5267\u5287\u52EE\u530A\u53E5\u5480\u5579\u57E7\u57FE\u58C9\u59D6\u5A35\u5A45\u5A6E\u5BE0\u5C40\u5C45\u5C66\u5C68\u5CA0\u5CA8\u5D0C\u5DC8\u5DE8\u5DEA\u5F06\u5FC2\u6007\u6010\u601A\u60E7\u6133\u61C5\u61FC\u6285\u62D2\u62D8\u62E0\u6319\u6336\u636E\u63AC\u63DF\u64DA\u64E7\u661B\u67B8\u67DC\u6854\u68AE\u6907\u6908\u6910\u6989\u6998\u6A58\u6A8B\u6AF8\u6B05\u6B6B\u6BE9\u6BF1\u6CAE\u6CC3\u6CE6\u6D30\u6DBA\u6DD7\u6E20\u6E68\u6FBD\u70AC\u70E5\u7117\u7123\u728B\u7291\u72CA\u72D9\u73C7\u741A\u75BD\u7717\u77BF\u77E9\u7820\u79EC\u7AAD\u7AB6\u7B65\u7C34\u7C94\u7CB7\u7E58\u7F5D\u801F\u805A\u8065\u8152\u8209\u824D\u82E3\u82F4\u8392\u83CA\u83F9\u849F\u84A9\u84FB\u861C\u8661\u86B7\u871B\u87B6\u8893\u88FE\u8977\u8A4E\u8ACA\u8BB5\u8C66\u8C97\u8D84\u8D9C\u8DD4\u8DD9\u8DDD\u8DFC\u8E18\u8E1E\u8E3D\u8E6B\u8E86\u8EB9\u8ECA\u8F02\u8F66\u907D\u90AD\u90F9\u91B5\u9245\u92E6\u92F8\u943B\u949C\u9514\u952F\u95B0\u9671\u96CE\u97A0\u97AB\u98B6\u98D3\u99CF\u99D2\u99F6\u9A67\u9A79\u9B88\u9B94\u9D21\u9D59\u9D74\u9D8B\u9DAA\u9F30\u9F33\u9F5F\u9F83", "juan": "\u5026\u52B5\u52CC\u52EC\u5377\u545F\u5708\u570F\u57CD\u5946\u594D\u59E2\u5A1F\u5A58\u5DB2\u5DC2\u5DFB\u5E23\u5F2E\u6081\u60D3\u617B\u6350\u6372\u6718\u684A\u688B\u68EC\u6926\u6D93\u6DC3\u7106\u72F7\u7367\u74F9\u7737\u774A\u7760\u7D6D\u7D79\u7E33\u7EE2\u7F65\u7F82\u8127\u8143\u81C7\u83E4\u8528\u8832\u88D0\u8B82\u9104\u92D1\u92D7\u9308\u93B8\u942B\u9529\u954C\u95C2\u96BD\u96CB\u9799\u98EC\u990B\u9E43", "jue": "\u4E85\u5014\u5095\u51B3\u5214\u5282\u5337\u53A5\u53D5\u5437\u564A\u5658\u5671\u56BC\u57C6\u58C6\u599C\u5B52\u5B53\u5C69\u5C6B\u5D1B\u5D2B\u5DA1\u5DA5\u5F21\u5F4F\u61A0\u61B0\u6204\u6289\u6317\u6354\u6398\u6485\u64A7\u652B\u6877\u6A5B\u6A5C\u6AED\u6B2E\u6C12\u6C7A\u6CEC\u704D\u7133\u71A6\u71CB\u7211\u721D\u7234\u7235\u7357\u7383\u73A6\u73A8\u73CF\u7474\u749A\u75A6\u761A\u77CD\u77DE\u77E1\u7804\u7A71\u7D55\u7D76\u7E58\u7EDD\u811A\u81C4\u82B5\u855D\u8568\u8673\u8697\u87E8\u87E9\u88A6\u8990\u899A\u89BA\u89C9\u89D2\u89D6\u89EE\u89FC\u8A23\u8AB3\u8B4E\u8BC0\u8C32\u8C9C\u8D7D\u8D89\u8DB9\u8E76\u8E77\u8EA9\u920C\u940D\u941D\u9481\u9562\u99C3\u9AC9\u9CDC\u9D02\u9D03\u9DE2", "jun": "\u4FCA\u5101\u519B\u541B\u5441\u5747\u57C8\u59F0\u5BEF\u5CFB\u61CF\u6343\u6508\u651F\u6659\u687E\u68DE\u6C6E\u6D5A\u6FEC\u710C\u71C7\u73FA\u756F\u76B2\u76B8\u76B9\u7885\u7AE3\u7B60\u7B98\u7B9F\u8399\u83CC\u8470\u8690\u8720\u8880\u89A0\u8CD0\u8ECD\u90E1\u921E\u9281\u929E\u9355\u94A7\u9656\u96BD\u96CB\u9835\u9915\u9982\u99FF\u9A8F\u9BB6\u9C
